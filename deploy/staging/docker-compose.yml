# Staging API on the Hostinger VPS (docs/09-deployment.md «Two API copies + one worker»). Lives in
# /opt/ayat-albayan-staging. Only ayat-lb is published, on localhost: the host Caddy (not in this repo,
# shared with the CRM) keeps proxying the API domain to 127.0.0.1:3110 unchanged.
# Never touches the CRM stack in /opt/wacrm. Roll it with roll.sh (one build, one container at a time).
# Memory (8 GB VPS shared with the CRM): 2 × 512 MB API + 1 GB worker (512 MB Node heap + Chromium PDFs) + 128 MB
# PDF sandbox + 64 MB LB + 96 MB Redis = 2336 MB ≈ 2.3 GB. After a deploy, measure (docker stats) the worker's RSS
# during a report PDF, and ayat-pdf's and an API copy's while a scanned 10 MB chat PDF previews, and adjust.
name: ayat-albayan-staging

# Every container's log rotates here, not in the daemon (shared with the CRM): never the whole disk.
x-log: &log
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-app: &app
  # One image per deploy (built by ayat-worker's build:), reused by every app service. Never pulled:
  # a registry image of this name is not ours.
  image: ayat-api:staging
  pull_policy: never
  env_file: .env
  restart: unless-stopped
  logging: *log
  # SIGTERM: Fastify stops taking connections and finishes the requests in flight (main.ts).
  stop_grace_period: 30s
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 5s
    timeout: 3s
    retries: 3
    start_period: 60s

x-shared-env: &shared-env
  # Shared cache (docs/09 «Shared cache»), on every app process. Redis down = the database, never an error.
  REDIS_URL: redis://ayat-redis:6379
  # Owner, 2026-11-01: «i want to go live with strip payments now». This stack is PRODUCTION
  # (api.ayatalbayan.com). FEATURE_STRIPE=live mounts the Stripe module (docs/30) and accepts a live
  # key (test = sandbox keys only). «التكاملات» lists the Stripe group (the keys, the switch). Nothing
  # takes real money until an admin saves a live key and the live webhook secret there and turns on
  # «خدمة الدفع الإلكتروني» (STRIPE_ENABLED): until then every Stripe route but the signed webhook is
  # 404 and GET /stripe/feature says off. To switch Stripe off: delete these two lines and redeploy
  # (docs/09). API_PUBLIC_URL is the host of the family's /pay/<token> pages.
  FEATURE_STRIPE: live
  API_PUBLIC_URL: https://api.ayatalbayan.com

x-api-env: &api-env
  <<: *shared-env
  # HTTP and webhooks only: no job runs here; «run now» kicks go to the worker (APP_ROLE, docs/09).
  APP_ROLE: api
  # The host Caddy + ayat-lb: req.ip stays the visitor (the rate limits key on it).
  TRUST_PROXY_HOPS: "2"
  WORKER_URL: http://ayat-worker:3000
  NODE_OPTIONS: --max-old-space-size=384

services:
  ayat-worker:
    <<: *app
    build:
      context: ./src
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *shared-env
      # Every background job (outbox sender, reminders, PDFs, Google sync, …); HTTP for /health and the
      # internal kick route only, on the project network (no host port).
      APP_ROLE: worker
      NODE_OPTIONS: --max-old-space-size=512
    deploy:
      resources:
        limits:
          # 512 MB heap + Chromium's own processes (outside the heap): 768 MB left Chromium too little.
          memory: 1024M

  ayat-api-a:
    <<: *app
    environment:
      <<: *api-env
      # An admin save here also reloads the other copy's config at once (kickConfigReload, docs/09).
      PEER_URLS: http://ayat-api-b:3000
    volumes:
      - pdf-sock:/run/pdf:ro
    deploy:
      resources:
        limits:
          memory: 512M

  ayat-api-b:
    <<: *app
    environment:
      <<: *api-env
      PEER_URLS: http://ayat-api-a:3000
    volumes:
      - pdf-sock:/run/pdf:ro
    deploy:
      resources:
        limits:
          memory: 512M

  # Chat PDF previews (docs/09 «PDF sandbox»): pdfinfo / pdftoppm parse a stranger's bytes HERE, never in an
  # API copy. Same image (poppler-utils), its own command, and nothing worth stealing: no env_file (no
  # secret), no network at all, a read-only root, no capabilities, no setuid. The API copies reach it only
  # through the unix socket /run/pdf/pdf.sock on the pdf-sock volume (read-only on their side). Not `<<: *app`:
  # that anchor carries env_file.
  ayat-pdf:
    image: ayat-api:staging
    pull_policy: never
    command: ["node", "dist/modules/messaging/inbox/files/pdf/pdf-sandbox.js"]
    user: node
    # tini as PID 1: reaps any orphan (a zombie would hold one of the 64 pids for good) and forwards SIGTERM to
    # node, which finishes the render in flight.
    init: true
    environment:
      NODE_ENV: production
      # Node's own heap stays small: the container's memory is for poppler (the OOM killer's first pick, choom).
      NODE_OPTIONS: --max-old-space-size=64
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # The PDF and its JPEGs, one run at a time (charged to the memory limit below).
    tmpfs:
      - /tmp:size=64m
    volumes:
      - pdf-sock:/run/pdf
    restart: unless-stopped
    stop_grace_period: 30s
    # Smaller than the others: whatever runs as node here can write to its own stdout.
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "2"
    # The socket exists only once this run listens (a stale one is removed first): no second node in 128 MB.
    healthcheck:
      test: ["CMD", "test", "-S", "/run/pdf/pdf.sock"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          # ponytail: 128M = node (~50M) + one pdftoppm; a scanned page that needs more is killed (503, retried
          # after 10 min). Measure with docker stats on a scanned 10 MB PDF (docs/09) before giving it more.
          memory: 128M
          cpus: "1"
          # Threads count too: node's ~12 and one poppler run fit; a fork bomb does not.
          pids: 64

  # Round robin over the two copies with active health checks; a refused connection is retried on the other.
  ayat-lb:
    image: caddy:2.10.2-alpine
    ports:
      - "127.0.0.1:3110:8080"
    volumes:
      # The directory, not the file: roll.sh rewrites lb/Caddyfile in place and reloads.
      - ./lb:/etc/caddy:ro
    restart: unless-stopped
    logging: *log
    deploy:
      resources:
        limits:
          memory: 64M

  # Shared cache for every copy and the worker. Internal network only: no published port. No persistence:
  # everything in it is a copy of the database.
  ayat-redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped
    logging: *log
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 96M

volumes:
  # The PDF sandbox's socket only (no data). tmpfs, 64 KB: the one path ayat-pdf can write that is not its own
  # /tmp can never fill the disk the CRM shares; owned by node (uid 1000, apps/api/Dockerfile), owner only.
  pdf-sock:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=64k,uid=1000,gid=1000,mode=0700"
