packages:
  - apps/*
  - packages/*
  - tools/*
  - e2e
  - docs/design/brand/tools
allowBuilds:
  supabase: true
  esbuild: true
  '@swc/core': true
  '@nestjs/core': false
  '@parcel/watcher': false
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@supabase/cli-darwin-arm64@2.119.0'
  - '@supabase/cli-darwin-x64@2.119.0'
  - '@supabase/cli-linux-arm64-musl@2.119.0'
  - '@supabase/cli-linux-arm64@2.119.0'
  - '@supabase/cli-linux-x64-musl@2.119.0'
  - '@supabase/cli-linux-x64@2.119.0'
  - '@supabase/cli-windows-arm64@2.119.0'
  - '@supabase/cli-windows-x64@2.119.0'
  - '@turbo/darwin-64@2.11.6'
  - '@turbo/darwin-arm64@2.11.6'
  - '@turbo/linux-64@2.11.6'
  - '@turbo/linux-arm64@2.11.6'
  - '@turbo/windows-64@2.11.6'
  - '@turbo/windows-arm64@2.11.6'
  - supabase@2.119.0
  - turbo@2.11.6
  - '@tanstack/react-router@1.170.41'
  - '@tanstack/router-cli@1.167.40'
  - '@tanstack/router-core@1.171.34'
  - '@tanstack/router-generator@1.167.40'
  - '@tanstack/router-plugin@1.168.42'
  - vite@8.3.2
  - '@oxlint/binding-android-arm-eabi@1.95.0'
  - '@oxlint/binding-android-arm64@1.95.0'
  - '@oxlint/binding-darwin-arm64@1.95.0'
  - '@oxlint/binding-darwin-x64@1.95.0'
  - '@oxlint/binding-freebsd-x64@1.95.0'
  - '@oxlint/binding-linux-arm-gnueabihf@1.95.0'
  - '@oxlint/binding-linux-arm-musleabihf@1.95.0'
  - '@oxlint/binding-linux-arm64-gnu@1.95.0'
  - '@oxlint/binding-linux-arm64-musl@1.95.0'
  - '@oxlint/binding-linux-ppc64-gnu@1.95.0'
  - '@oxlint/binding-linux-riscv64-gnu@1.95.0'
  - '@oxlint/binding-linux-riscv64-musl@1.95.0'
  - '@oxlint/binding-linux-s390x-gnu@1.95.0'
  - '@oxlint/binding-linux-x64-gnu@1.95.0'
  - '@oxlint/binding-linux-x64-musl@1.95.0'
  - '@oxlint/binding-openharmony-arm64@1.95.0'
  - '@oxlint/binding-win32-arm64-msvc@1.95.0'
  - '@oxlint/binding-win32-ia32-msvc@1.95.0'
  - '@oxlint/binding-win32-x64-msvc@1.95.0'
  - oxlint@1.95.0
# One @types/react for every workspace: two copies made React's JSX types differ between an app and
# the kit sources it type-checks (the cause of the old tsconfig `react` paths).
catalog:
  '@types/react': ~19.2.18
  oxlint: 1.95.0
# One React DOM for the workspace, equal to react 19.2.3 (React refuses a mismatched pair): apps/staff-web and the
# optional react-dom peer of expo-router / @expo/metro-runtime would otherwise take the newest 19.x (docs/32 x1).
overrides:
  react-dom: 19.2.3
  '@types/react-dom': ~19.2.3
patchedDependencies:
  expo-sharing@57.0.24: patches/expo-sharing@57.0.24.patch
