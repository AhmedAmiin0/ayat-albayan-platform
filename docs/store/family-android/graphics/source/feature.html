<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:N;src:url(bold.ttf);font-weight:700}
@font-face{font-family:N;src:url(med.ttf);font-weight:500}
html,body{margin:0;width:1024px;height:500px;overflow:hidden}
body{background:radial-gradient(120% 140% at 85% 50%,#0b6b52 0%,#064E3B 55%,#04382b 100%);
 font-family:N;color:#FBF7EE;display:flex;align-items:center;gap:56px;padding:0 84px;box-sizing:border-box}
.mark{width:300px;height:322px;flex:none;filter:drop-shadow(0 10px 24px rgba(0,0,0,.28))}
.mark img{width:100%;height:100%;object-fit:contain}
.text{display:grid;gap:14px;flex:1}
h1{margin:0;font-size:92px;font-weight:700;line-height:1.15;color:#FBF7EE}
.rule{width:120px;height:3px;background:#C9A24A;border-radius:2px}
p{margin:0;font-size:32px;white-space:nowrap;font-weight:500;line-height:1.5;color:#E9DFC6}
.en{font-size:24px;letter-spacing:.06em;color:#C9A24A;direction:ltr;text-align:right;font-weight:500}
</style></head><body>
<div class="mark"><img src="mark.png" alt=""></div>
<div class="text">
 <h1>آيات البيان</h1>
 <div class="rule"></div>
 <p>حلقات القرآن وتقاريرها في مكان واحد</p>
 <div class="en">AYAT AL-BAYAN</div>
</div>
</body></html>
