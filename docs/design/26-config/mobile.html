<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الإعدادات على الهاتف</title>
<meta name="description" content="Design mock: Expo admin settings screens (docs/26 IA brief; docs/07 §12). Four phone frames, static, fake data, no JS.">
<link rel="stylesheet" href="./tokens.css">
<style>
/* tokens and themes: tokens.css (docs/07 §3). Phone-only styles below. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--sunk); color: var(--ink); font-family: var(--font-sans); font-size: 15px; line-height: 1.6; }
h1, h2, h3, p, ul, figure { margin: 0; }
ul { padding: 0; list-style: none; }
a { color: var(--lapis); }
:focus-visible { outline: 2px solid var(--lapis); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
.num, bdi { font-variant-numeric: tabular-nums; }
bdi[dir="ltr"] { white-space: nowrap; }
.vh { position: absolute; inline-size: 1px; block-size: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.i { inline-size: 20px; block-size: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.g { inline-size: 12px; block-size: 12px; flex: none; }

/* ===== board ===== */
.board { padding-block: 16px 48px; padding-inline: 16px; max-inline-size: 1720px; margin-inline: auto; }
.mhead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; margin-block-end: 20px; }
.mhead > div { flex: 1 1 420px; }
.mhead h1 { font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.5; }
.mhead p { max-inline-size: 80ch; color: var(--ink-2); font-size: 14px; }
.phones { display: flex; flex-wrap: wrap; gap: 40px 32px; align-items: flex-start; justify-content: center; }
figure { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; inline-size: 375px; max-inline-size: 100%; }
figcaption { font-size: 13px; color: var(--ink-2); }
figcaption b { color: var(--ink); }
figcaption ul { display: grid; gap: 4px; margin-block-start: 6px; }
figcaption li { display: flex; gap: 6px; align-items: baseline; }

/* ===== phone: no jadwal frame, no cartouche (docs/07 §5, §12) ===== */
.phone { position: relative; display: flex; flex-direction: column; inline-size: 375px; max-inline-size: 100%; min-block-size: 760px; overflow: hidden; background: var(--margin); border: 1px solid var(--rule-strong); border-radius: 12px; box-shadow: var(--elev-page); }
.sysbar { display: flex; justify-content: space-between; padding-block: 8px 0; padding-inline: 20px; font-size: 12px; font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.appbar { display: flex; align-items: center; gap: 4px; padding-block: 6px 10px; padding-inline: 8px 16px; }
.appbar h2 { font-family: var(--font-display); font-weight: 700; font-size: 28px; line-height: 1.5; }
.appbar h2.sm { font-size: 23px; }
.back { display: inline-grid; place-items: center; inline-size: 44px; block-size: 44px; border: 0; border-radius: 8px; background: transparent; color: var(--ink-2); cursor: pointer; }
.body { flex: 1; display: flex; flex-direction: column; gap: 16px; padding-inline: 16px; padding-block-end: 16px; }
.sec-h { font-size: 13px; font-weight: 600; color: var(--ink-3); margin-block-end: -8px; }
.tabbar { display: grid; grid-template-columns: repeat(4, 1fr); padding-block: 6px 18px; padding-inline: 8px; background: var(--page); border-block-start: 1px solid var(--rule-strong); }
.tabbar a { position: relative; display: grid; justify-items: center; gap: 2px; min-block-size: 48px; padding-block-start: 4px; color: var(--ink-3); font-size: 12px; font-weight: 500; text-decoration: none; }
.tabbar a[aria-current="page"] { color: var(--ink); font-weight: 700; }
.tabbar a[aria-current="page"] .i { color: var(--lapis); }
.tabbar .badge { position: absolute; inset-block-start: 0; inset-inline-start: calc(50% + 6px); min-inline-size: 22px; block-size: 18px; padding-inline: 5px; border-radius: 999px; background: var(--saffron-wash); color: var(--saffron); font-size: 12px; font-weight: 700; line-height: 18px; text-align: center; box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--saffron) 30%, transparent); }

/* ===== lists and cards ===== */
.list { background: var(--page); border: 1px solid var(--rule-strong); border-radius: 12px; overflow: hidden; }
.list > li + li { border-block-start: 1px solid var(--rule); }
.nav-row { display: flex; align-items: center; gap: 12px; min-block-size: 64px; padding-block: 10px; padding-inline: 14px; color: var(--ink); text-decoration: none; }
.nav-row .ic { display: grid; place-items: center; inline-size: 24px; block-size: 24px; background: none; color: var(--ink-3); flex: none; }
.nav-row .t { flex: 1; min-inline-size: 0; display: grid; gap: 2px; }
.nav-row .t b { font-weight: 600; font-size: 16px; }
.nav-row .t > span { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; font-size: 13px; color: var(--ink-3); }
.nav-row .chev { color: var(--ink-3); }
.nav-row.is-static { color: var(--ink-2); }
.card { display: grid; gap: 10px; padding: 14px; background: var(--page); border: 1px solid var(--rule-strong); border-radius: 12px; }
.card h3 { font-size: 16px; font-weight: 600; }
.kv { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-block-size: 30px; }
.kv .k { color: var(--ink-2); font-size: 14px; }
.web-note { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-3); }
.web-note .i { inline-size: 16px; block-size: 16px; }

/* ===== controls (16px inputs, 44px targets) ===== */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-block-size: 44px; padding-inline: 16px; border: 1px solid transparent; border-radius: 8px; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; text-decoration: none; }
.btn--block { inline-size: 100%; }
.btn--primary { background: var(--lapis); color: var(--on-lapis); }
.btn--secondary { background: var(--raised); color: var(--ink); border-color: var(--rule-input); }
.btn--ghost { background: transparent; color: var(--lapis); }
.btn--danger { background: var(--cinnabar-solid); color: var(--on-cinnabar); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.input { inline-size: 100%; min-block-size: 44px; padding-inline: 12px; border: 1px solid var(--rule-input); border-radius: 8px; background: var(--raised); color: var(--ink); font: inherit; font-size: 16px; font-variant-numeric: tabular-nums; }
.input:focus { outline: 2px solid var(--lapis); outline-offset: 1px; border-color: var(--lapis); }
.search { position: relative; flex: none; max-inline-size: none; }
.search .i { position: absolute; inset-inline-start: 12px; inset-block-start: 12px; translate: none; color: var(--ink-3); pointer-events: none; }
.search .input { padding-inline-start: 40px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-block: 4px; margin-inline: -16px; padding-inline: 16px; }
.fchip { display: inline-flex; align-items: center; gap: 6px; min-block-size: 44px; padding-inline: 14px; border: 1px solid var(--rule-input); border-radius: 999px; background: var(--raised); color: var(--ink-2); font: inherit; font-size: 14px; white-space: nowrap; cursor: pointer; }
.fchip[aria-pressed="true"] { background: var(--lapis-wash); color: var(--ink); font-weight: 600; border-color: var(--lapis); }
.fchip .n { color: var(--ink-3); font-variant-numeric: tabular-nums; }
/* switch: the tokens.css spec (40×24, neutral-wash track with inset rule, raised knob; on = lapis); 44px hit area */
.sw { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-inline-size: 44px; min-block-size: 44px; flex: none; cursor: pointer; }
.sw input { position: absolute; inset: 0; inline-size: 100%; block-size: 100%; margin: 0; opacity: 0; cursor: pointer; }
.sw .track { position: relative; flex: none; inline-size: 40px; block-size: 24px; border-radius: 999px; background: var(--neutral-wash); box-shadow: inset 0 0 0 1px var(--rule-input); transition: background-color 120ms; }
.sw .track::after { content: ""; position: absolute; inset-block-start: 3px; inset-inline-start: 3px; inline-size: 18px; block-size: 18px; border-radius: 50%; background: var(--raised); box-shadow: 0 0 0 1px var(--rule-input); transition: inset-inline-start 120ms; }
.sw input:checked + .track { background: var(--lapis); box-shadow: none; }
.sw input:checked + .track::after { inset-inline-start: 19px; background: var(--on-lapis); box-shadow: none; }
.sw input:focus-visible + .track { outline: 2px solid var(--lapis); outline-offset: 2px; }

/* ===== chips (nuqta + word) ===== */
.chip { --fg: var(--ink-2); --bg: var(--neutral-wash); display: inline-flex; align-items: center; gap: 6px; block-size: 26px; padding-inline: 8px 10px; border: 1px solid color-mix(in oklab, var(--fg) 26%, transparent); border-radius: 999px; background: var(--bg); color: var(--fg); font-size: 13px; font-weight: 600; white-space: nowrap; }
.chip--ok { --fg: var(--verdigris); --bg: var(--verdigris-wash); }
.chip--act { --fg: var(--saffron); --bg: var(--saffron-wash); }
.tag { display: inline-flex; align-items: center; gap: 4px; min-block-size: 22px; padding-inline: 8px; border: 1px solid var(--rule-input); border-radius: 999px; color: var(--ink-2); font-size: 12px; font-weight: 600; white-space: nowrap; }
.meta { font-size: 12px; color: var(--ink-3); }
.key { font-family: var(--font-sans); font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

/* ===== «القيم»: two-column table; a row opens the bottom-sheet editor ===== */
.mt { inline-size: 100%; border-collapse: collapse; background: var(--page); border: 1px solid var(--rule-strong); border-radius: 12px; }
.mt caption { caption-side: top; padding-block-end: 6px; text-align: start; }
.mt .cap { font-family: var(--font-display); font-weight: 700; font-size: 19px; }
.mt thead th { padding-block: 6px; padding-inline: 12px; border-block-end: 3px double var(--gold); color: var(--ink-3); font-size: 12px; font-weight: 600; text-align: start; }
.mt thead th + th { inline-size: 42%; }
.mt tbody th, .mt tbody td { padding-block: 0; padding-inline: 12px; border-block-end: 1px solid var(--rule); text-align: start; vertical-align: middle; font-weight: 600; font-size: 15px; }
.mt tbody tr:last-child > * { border-block-end: 0; }
.mt tbody tr { position: relative; }
.mv { display: flex; align-items: center; justify-content: space-between; gap: 6px; inline-size: 100%; min-block-size: 52px; padding: 0; border: 0; background: none; color: var(--ink); font: inherit; font-weight: 600; text-align: start; cursor: pointer; }
.mv::after { content: ""; position: absolute; inset: 0; }
.mv:focus-visible { outline-offset: -2px; }
.mv small { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; color: var(--ink-3); }
.mv .i { inline-size: 16px; block-size: 16px; color: var(--ink-3); }
a.fchip { text-decoration: none; }
a.fchip[aria-current="page"] { background: var(--lapis-wash); color: var(--ink); font-weight: 600; border-color: var(--lapis); box-shadow: inset 0 -3px 0 var(--lapis); }

/* ===== notification rows ===== */
.nrow { display: flex; align-items: flex-start; gap: 10px; padding-block: 10px; padding-inline: 14px; }
.nrow .t { flex: 1; min-inline-size: 0; display: grid; gap: 4px; }
.nrow .t b { font-weight: 600; font-size: 15px; }
.nrow .t .line { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--ink-3); }
.nrow .t .why { font-size: 12px; color: var(--ink-3); }
.lock { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--ink-2); }
.lock .i { inline-size: 16px; block-size: 16px; }

</style>
</head>

<main class="board">

    <div><h1>الإعدادات في تطبيق الإدارة</h1><p>أربع شاشات من تطبيق الهاتف، كل منها شاشة واحدة. لا إطار ولا خرطوشة على الهاتف. النوافذ السفلية والحالات في <a href="./states.html#mobile">states.html</a>. البيانات تجريبية.</p></div>

          <table class="mt">
