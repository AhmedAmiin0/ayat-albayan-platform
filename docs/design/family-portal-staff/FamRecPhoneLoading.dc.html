body{margin:0}
a{color:inherit}
:focus-visible{outline:2px solid #047857;outline-offset:2px}
@media (hover:hover) and (pointer:fine){[data-h]:hover{background-color:var(--h)!important}[data-hc]:hover{color:var(--hc)!important}}
[data-press]:active{background-color:var(--h)!important}
@media (prefers-reduced-motion:no-preference){
[data-h],[data-hc],[data-press]{transition:background-color 120ms ease-out,color 120ms ease-out,border-color 120ms ease-out,transform 120ms cubic-bezier(0.2, 0.7, 0.2, 1)}
[data-press=btn]:active{transform:scale(0.98)}
[data-press=row]:active{transform:scale(0.99)}
[data-tab]{transition:color 200ms ease-out,border-color 200ms ease-out}
[data-enter]{animation:ab-fade-up 200ms cubic-bezier(0.2, 0.7, 0.2, 1) both}
[data-enter="2"]{animation-delay:50ms}
[data-live]::after{content:"";position:absolute;inset:0;border-radius:50%;background:currentColor;animation:ab-live 2s cubic-bezier(0.2, 0.7, 0.2, 1) infinite}
[data-ind]{transition:transform 200ms cubic-bezier(0.2, 0.7, 0.2, 1)}
@keyframes ab-fade-up{from{opacity:0.6;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes ab-live{from{transform:scale(1);opacity:0.5}to{transform:scale(2.6);opacity:0}}
}
[data-seek]:focus-visible{outline-offset:4px}
@media (prefers-reduced-motion:no-preference){
[data-swap]{animation:rec-swap 200ms cubic-bezier(0.2, 0.7, 0.2, 1) both}
[data-thumb]{transition:transform 120ms cubic-bezier(0.2, 0.7, 0.2, 1)}
[data-seek]:active [data-thumb]{transform:scale(1.25)}
[data-skel]{animation:rec-breathe 700ms cubic-bezier(0.2, 0.7, 0.2, 1) infinite alternate}
[data-eq] span{transform-origin:50% 100%;animation:rec-eq 600ms cubic-bezier(0.2, 0.7, 0.2, 1) infinite alternate}
[data-eq] span:nth-child(2){animation-delay:-200ms}
[data-eq] span:nth-child(3){animation-delay:-400ms}
@keyframes rec-swap{from{transform:translateY(6px)}to{transform:none}}
@keyframes rec-breathe{from{opacity:1}to{opacity:0.55}}
@keyframes rec-eq{from{transform:scaleY(1)}to{transform:scaleY(0.4)}}
}
@media (hover:hover) and (pointer:fine) and (prefers-reduced-motion:no-preference){[data-seek]:hover [data-thumb]{transform:scale(1.25)}}
</style>
</helmet>
