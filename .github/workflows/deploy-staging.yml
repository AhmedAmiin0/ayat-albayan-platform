name: deploy-staging
# Deploy staging from GitHub (docs/09-deployment.md §GitHub deploy): Actions → deploy-staging → Run workflow.
# Every value comes from the GitHub environment "develop" (Settings → Environments → develop):
# secrets for anything private, variables for the rest. Nothing is read from a laptop.
# The server's .env is MERGED, not replaced: a key left empty in GitHub keeps the server's value.
on:
  # Automatic: every merge into develop, once ci has passed on it (a red develop never ships).
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [develop]
  # By hand: Actions → deploy-staging → Run workflow.
  workflow_dispatch:
    inputs:
      migrate:
        description: Push database migrations to the staging Supabase first
        type: boolean
        default: true
      env_only:
        description: Only update the server .env and restart the API (no code, no web, no migrations)
        type: boolean
        default: false

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    # A ci run on develop that failed, or that came from a fork/PR, deploys nothing.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
       && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: develop
    env:
      DEST: ${{ vars.DEPLOY_DIR || '/opt/ayat-albayan-staging' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The exact commit ci passed on (auto), or the chosen branch (by hand).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY" -a -n "${{ vars.SSH_HOST }}" || { echo "::error::set secret SSH_PRIVATE_KEY and variable SSH_HOST in the develop environment"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          if [ -n "$SSH_KNOWN_HOSTS" ]; then printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; else ssh-keyscan -H "${{ vars.SSH_HOST }}" > ~/.ssh/known_hosts; fi
          printf 'Host target\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n' \
            "${{ vars.SSH_HOST }}" "${{ vars.SSH_USER || 'root' }}" > ~/.ssh/config
          ssh target "test -d $DEST" || { echo "::error::$DEST missing on the server"; exit 1; }

      - name: Merge the server .env (key names only are logged)
        # API .env keys (apps/api/src/env.ts), scoped to this step only.
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          WA_ACCESS_TOKEN: ${{ secrets.WA_ACCESS_TOKEN }}
          WA_APP_SECRET: ${{ secrets.WA_APP_SECRET }}
          WA_VERIFY_TOKEN: ${{ secrets.WA_VERIFY_TOKEN }}
          FEEDBACK_TOKEN_SECRET: ${{ secrets.FEEDBACK_TOKEN_SECRET }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          RECORDING_S3_ACCESS_KEY: ${{ secrets.RECORDING_S3_ACCESS_KEY }}
          RECORDING_S3_SECRET: ${{ secrets.RECORDING_S3_SECRET }}
          EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
          # … and variables:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          WEB_ORIGIN: ${{ vars.WEB_ORIGIN }}
          WA_API_BASE: ${{ vars.WA_API_BASE }}
          WA_API_VERSION: ${{ vars.WA_API_VERSION }}
          WA_PHONE_NUMBER_ID: ${{ vars.WA_PHONE_NUMBER_ID }}
          WA_WABA_ID: ${{ vars.WA_WABA_ID }}
          WA_APP_ID: ${{ vars.WA_APP_ID }}
          MESSAGING_ENABLED: ${{ vars.MESSAGING_ENABLED }}
          LIVEKIT_URL: ${{ vars.LIVEKIT_URL }}
          RECORDING_S3_ENDPOINT: ${{ vars.RECORDING_S3_ENDPOINT }}
          RECORDING_S3_REGION: ${{ vars.RECORDING_S3_REGION }}
          RECORDING_S3_BUCKET: ${{ vars.RECORDING_S3_BUCKET }}
          EXPO_API_BASE: ${{ vars.EXPO_API_BASE }}
          FX_API_URL: ${{ vars.FX_API_URL }}
        run: |
          umask 077
          # Missing file = start empty; present but unreadable = stop (never write a partial .env).
          ssh target "if [ -e $DEST/.env ]; then cat $DEST/.env; fi" > current.env
          keys="SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY SUPABASE_JWT_SECRET WEB_ORIGIN WA_API_BASE WA_API_VERSION
            WA_PHONE_NUMBER_ID WA_WABA_ID WA_ACCESS_TOKEN WA_APP_ID WA_APP_SECRET WA_VERIFY_TOKEN MESSAGING_ENABLED
            FEEDBACK_TOKEN_SECRET LIVEKIT_URL LIVEKIT_API_KEY LIVEKIT_API_SECRET RECORDING_S3_ENDPOINT RECORDING_S3_REGION
            RECORDING_S3_BUCKET RECORDING_S3_ACCESS_KEY RECORDING_S3_SECRET EXPO_ACCESS_TOKEN EXPO_API_BASE FX_API_URL"
          node tools/scripts/env-merge.mjs current.env $keys > new.env
          if cmp -s current.env new.env; then echo "server .env unchanged"; else
            ssh target "cp $DEST/.env $DEST/.env.bak-\$(date +%F-%H%M%S) 2>/dev/null || true; umask 077; cat > $DEST/.env.new && mv $DEST/.env.new $DEST/.env" < new.env
            echo "server .env updated (backup kept next to it)"; fi
          rm -f current.env new.env

      - name: Database migrations
        if: ${{ github.event_name == 'workflow_run' || (inputs.migrate && !inputs.env_only) }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          pnpm i --frozen-lockfile --filter @ab/db
          cd packages/db
          pnpm exec supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}" -p "$SUPABASE_DB_PASSWORD" >/dev/null
          pnpm exec supabase db push -p "$SUPABASE_DB_PASSWORD" --yes

      - name: Ship the API and rebuild its container
        if: ${{ !inputs.env_only }}
        run: |
          ssh target "rm -rf $DEST/src.new && mkdir -p $DEST/src.new"
          git archive --format=tar HEAD | ssh target "tar --no-same-owner -x -C $DEST/src.new"
          scp -q deploy/staging/docker-compose.yml "target:$DEST/docker-compose.yml"
          ssh target "cd $DEST && rm -rf src.old && { [ ! -d src ] || mv src src.old; } && mv src.new src \
            && docker compose up -d --build --remove-orphans && docker image prune -f >/dev/null"

      - name: Restart the API with the new .env
        if: ${{ inputs.env_only }}
        run: ssh target "cd $DEST && docker compose up -d --force-recreate --remove-orphans"

      - name: Build and upload the web app (atomic swap)
        if: ${{ !inputs.env_only }}
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          pnpm i --frozen-lockfile
          pnpm --filter @ab/db --filter @ab/shared build >/dev/null
          pnpm --filter web build
          ssh target "rm -rf $DEST/web.new && mkdir -p $DEST/web.new"
          tar -C apps/web/dist -cf - . | ssh target "tar --no-same-owner -x -C $DEST/web.new && chmod -R o+rX $DEST/web.new \
            && rm -rf $DEST/web.old && { [ ! -d $DEST/web ] || mv $DEST/web $DEST/web.old; } && mv $DEST/web.new $DEST/web"

      - name: Health check
        run: |
          url="${{ vars.API_URL }}"
          if [ -z "$url" ]; then ssh target "curl -fsS --retry 30 --retry-delay 5 --retry-all-errors http://127.0.0.1:3110/health"
          else curl -fsS --retry 30 --retry-delay 5 --retry-all-errors "$url/health"; fi
          echo; echo "staging is up"

      - name: Remove the key
        if: always()
        run: rm -rf ~/.ssh/id_deploy
