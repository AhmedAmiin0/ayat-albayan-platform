name: deploy-staging
# STAGING (owner 2026-10-31: «make a new one and make it the staging»), separate from production in every part:
# Supabase gqkqbxxgqttfbbqoqedf, /opt/ayat-albayan-stg on the shared VPS (compose project ayat-albayan-stg, API on
# 127.0.0.1:3120), https://staging-app.ayatalbayan.com + https://staging-api.ayatalbayan.com, GitHub environment
# «staging», EAS channel «staging». DEMO data only. docs/09-deployment.md «Staging».
# Automatic: every merge into develop once ci passed on it; by hand: Actions → deploy-staging → Run workflow.
# B1 (docs/09): repository-level secrets hold PRODUCTION values and resolve in any job whose environment lacks the
# name, so this file reads ONLY secrets.STG_* (no repository secret has that prefix) and hard-codes every public
# staging value; tools/scripts/ci-checks/env-split/workflows-split.test.mjs keeps it so.
# Never production: not its Supabase ref, server directory, port, preview OTA channel or release tags.
# Never WA_PHONE_NUMBER_ID / WA_ALLOWED_RECIPIENTS (by hand on the server only), never /opt/wacrm.
run-name: >-
  deploy-staging ${{ github.event.workflow_run.head_sha || github.sha }}${{ inputs.env_only && ' env-only' || '' }}
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      env_only:
        description: Only update the server .env and restart the API (no code, no web, no migrations)
        type: boolean
        default: false
      seed_demo:
        description: After the migrations, load the DEMO data (tools/scripts/seed/seed-demo.mjs) into the staging database
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  # Without the deploy key an automatic run is skipped with a warning (so merging before the owner's setup is
  # harmless); a run started by hand fails and says what is missing.
  preflight:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
       && github.event.workflow_run.head_branch == 'develop'
       && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: staging
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Manual runs must be started on develop
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/develop' }}
        run: |
          echo "::error::staging is deployed from develop only (this run is on ${{ github.ref }})"
          exit 1
      - id: check
        env:
          STG_SSH_PRIVATE_KEY: ${{ secrets.STG_SSH_PRIVATE_KEY }}
          STG_SUPABASE_ANON_KEY: ${{ secrets.STG_SUPABASE_ANON_KEY }}
          STG_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STG_SUPABASE_SERVICE_ROLE_KEY }}
          STG_DATABASE_URL: ${{ secrets.STG_DATABASE_URL }}
        run: |
          if [ -z "$STG_SSH_PRIVATE_KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            msg="staging deploy skipped: the environment «staging» has no STG_SSH_PRIVATE_KEY yet (docs/09-deployment.md «Staging»)"
            if [ "${{ github.event_name }}" = workflow_dispatch ]; then echo "::error::$msg"; exit 1; fi
            echo "::warning::$msg"; exit 0
          fi
          missing=""
          for v in STG_SUPABASE_ANON_KEY STG_SUPABASE_SERVICE_ROLE_KEY STG_DATABASE_URL; do [ -n "${!v}" ] || missing="$missing $v"; done
          if [ -n "$missing" ]; then echo "::error::add to the environment «staging»:$missing"; exit 1; fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

  # Every run migrates (the first one applies every migration to the empty project). No reviewer: DEMO data only.
  migrate:
    needs: preflight
    if: ${{ needs.preflight.outputs.ready == 'true' && !inputs.env_only }}
    permissions:
      contents: read
    uses: ./.github/workflows/db-migrate.yml
    with:
      apply: true
      target: staging
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}
    secrets: inherit

  # The staging app's OTA (channel «staging», never preview): only once a staging APK exists (repository variable
  # STG_OTA_BASELINE_SHA = its commit), when mobile JS changed since the last green staging OTA (else that APK)
  # and native-changes.mjs finds no native change for the staging profile. Anything unclear = no OTA.
  plan:
    needs: preflight
    if: ${{ needs.preflight.outputs.ready == 'true' && !inputs.env_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      ota: ${{ steps.ota.outputs.ota }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - id: ota
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NATIVE_BASE: ${{ vars.STG_OTA_BASELINE_SHA }}
        run: |
          ota=false
          base=$(node tools/scripts/env/deploy-baseline.mjs staging | sed -n 's/^ota_base=//p')
          base=${base:-$NATIVE_BASE}
          js() { git diff --name-only "$base" HEAD -- apps/mobile packages/shared \
            ':(glob,exclude)**/*.test.ts' ':(glob,exclude)**/*.test.tsx' ':(glob,exclude)**/*.md'; }
          if [ -z "$NATIVE_BASE" ]; then echo "::notice::no staging APK recorded (variable STG_OTA_BASELINE_SHA): no OTA"
          elif ! git merge-base --is-ancestor "$base" HEAD; then echo "::notice::${base:0:7} is not behind this commit: no OTA"
          elif [ -z "$(js)" ]; then echo "no mobile JS change since ${base:0:7}: no OTA"
          elif ! node tools/scripts/ci-checks/native-changes.mjs "$NATIVE_BASE" staging; then
            echo "::warning::native change since the staging APK: build one (mobile → build-android-apk, profile staging), then set STG_OTA_BASELINE_SHA"
          else ota=true; fi
          echo "ota=$ota" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [preflight, migrate]
    if: ${{ !cancelled() && needs.preflight.outputs.ready == 'true' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    permissions:
      contents: read
    env:
      DEST: /opt/ayat-albayan-stg
      SSH_HOST: 148.230.116.195
      API_URL: https://staging-api.ayatalbayan.com
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Build the web app (before anything on the server changes)
        if: ${{ !inputs.env_only }}
        env:
          VITE_API_URL: https://staging-api.ayatalbayan.com
          VITE_SUPABASE_URL: https://gqkqbxxgqttfbbqoqedf.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STG_SUPABASE_ANON_KEY }}
        run: |
          pnpm i --frozen-lockfile
          pnpm --filter @ab/db --filter @ab/shared --filter @ab/client-core build >/dev/null
          pnpm --filter web build

      - name: SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STG_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STG_SSH_KNOWN_HOSTS }}
        run: |
          echo "::add-mask::$SSH_HOST"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          if [ -n "$SSH_KNOWN_HOSTS" ]; then printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else echo "::warning::STG_SSH_KNOWN_HOSTS is not set: the host key is fetched with ssh-keyscan"; ssh-keyscan -H "$SSH_HOST" > ~/.ssh/known_hosts; fi
          printf 'Host target\n  HostName %s\n  User root\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n  ServerAliveInterval 30\n  ServerAliveCountMax 6\n' \
            "$SSH_HOST" > ~/.ssh/config
          # 711: the host Caddy (user caddy) reaches web/ but cannot list the folder; .env stays root-only (umask 077).
          ssh target "install -d -m 711 $DEST"

      - name: Merge the server .env (key names only are logged)
        # SUPABASE_URL, WEB_ORIGIN and the hosts are pinned in deploy/stg/docker-compose.yml, never in .env.
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STG_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.STG_SUPABASE_JWT_SECRET }}
          FEEDBACK_TOKEN_SECRET: ${{ secrets.STG_FEEDBACK_TOKEN_SECRET }}
          LOGIN_CODE_PEPPER: ${{ secrets.STG_LOGIN_CODE_PEPPER }}
        run: |
          umask 077
          ssh target "if [ -e $DEST/.env ]; then cat $DEST/.env; fi" > current.env
          keys="SUPABASE_SERVICE_ROLE_KEY SUPABASE_JWT_SECRET FEEDBACK_TOKEN_SECRET LOGIN_CODE_PEPPER"
          node tools/scripts/env/env-merge.mjs current.env $keys > new.env
          if cmp -s current.env new.env; then echo "server .env unchanged"; else
            ssh target "cp $DEST/.env $DEST/.env.bak-\$(date +%F-%H%M%S) 2>/dev/null || true; umask 077; cat > $DEST/.env.new && mv $DEST/.env.new $DEST/.env" < new.env
            echo "server .env updated (backup kept next to it)"; fi
          rm -f current.env new.env

      # The code and deploy/stg go up as *.new, then ONE command under the deploy lock swaps them in (the previous ones
      # kept as *.old) and rolls; a failed roll runs rollback.sh in the same command. setsid -w + .deploy.log: an ssh
      # drop never stops it halfway. Exit codes: 75 lock held (nothing changed), 1 rolled back, 3 rollback failed too
      # (the first deploy has nothing to roll back to), 4 the swap failed partway, 255 ssh lost.
      - name: Ship the API code and deploy/stg
        if: ${{ !inputs.env_only }}
        run: |
          ssh target "rm -rf $DEST/src.new && mkdir -p $DEST/src.new"
          git archive --format=tar HEAD | ssh target "tar --no-same-owner -x -C $DEST/src.new"
          for f in docker-compose.yml roll.sh rollback.sh; do scp -q "deploy/stg/$f" "target:$DEST/$f.new"; done

      - name: Swap in and roll the API
        if: ${{ !inputs.env_only }}
        run: |
          ssh target "cd $DEST && setsid -w flock -n -E 75 .deploy.lock sh -c '
            for f in docker-compose.yml roll.sh; do [ ! -f \$f ] || cp \$f \$f.old; done &&
            rm -rf src.old && { [ ! -d src ] || mv src src.old; } && mv src.new src &&
            mv docker-compose.yml.new docker-compose.yml && mv roll.sh.new roll.sh && mv rollback.sh.new rollback.sh || exit 4
            { sh roll.sh || { sh rollback.sh || exit 3; exit 1; }; }' > .deploy.log 2>&1 < /dev/null; rc=\$?; cat .deploy.log; exit \$rc" || {
            rc=$?
            case "$rc" in
              75) echo "::error::another deploy holds $DEST/.deploy.lock: nothing was changed" ;;
              1) echo "::error::the roll failed: rollback.sh put the previous version back (bad code kept in src.bad)" ;;
              3) echo "::error::the roll failed and there was nothing (or no way) to roll back: see $DEST/.deploy.log" ;;
              4) echo "::error::the swap failed partway: nothing was rolled; check $DEST by hand (src, src.old, *.new)" ;;
              255) echo "::error::ssh lost: the roll goes on on the server, see $DEST/.deploy.log" ;;
              *) echo "::error::the roll step failed ($rc), see $DEST/.deploy.log" ;;
            esac
            exit "$rc"
          }

      - name: Restart the API with the new .env
        if: ${{ inputs.env_only }}
        run: ssh target "cd $DEST && flock -n -E 75 .deploy.lock sh roll.sh --env-only"

      - name: Upload the web app (atomic swap)
        if: ${{ !inputs.env_only }}
        run: |
          ssh target "rm -rf $DEST/web.new && mkdir -p $DEST/web.new"
          tar -C apps/web/dist -cf - . | ssh target "tar --no-same-owner -x -C $DEST/web.new && chmod -R o+rX $DEST/web.new \
            && rm -rf $DEST/web.old && { [ ! -d $DEST/web ] || mv $DEST/web $DEST/web.old; } && mv $DEST/web.new $DEST/web"

      # Appends the two staging site blocks to the host Caddy only when they are missing (backup, validate, reload;
      # an invalid file is restored). Never edits an existing block (the CRM's, production's).
      - name: Host Caddy site blocks (only when missing)
        run: ssh target "sh -s" < deploy/stg/caddy-sites.sh

      - name: Health check
        run: |
          curl -fsS --retry 30 --retry-delay 5 --retry-all-errors "$API_URL/health"
          echo; echo "staging is up"

      # Auth URLs, sign-up off and the custom access token hook (logins carry their role) from config.toml
      # [remotes.stg], to the staging project only. Needs STG_SUPABASE_ACCESS_TOKEN (account-wide: it can reach
      # production too, so it lives only in the environment «staging»). A failure only warns.
      - name: Push the Supabase auth config (staging project only)
        if: ${{ !inputs.env_only }}
        continue-on-error: true
        working-directory: packages/db
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STG_SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::warning::no STG_SUPABASE_ACCESS_TOKEN: set the auth URLs and the hook by hand (docs/09 «Staging»)"; exit 0; fi
          pnpm exec supabase config push --project-ref gqkqbxxgqttfbbqoqedf --yes

      - name: Summary
        if: always()
        run: |
          {
            echo "### Staging deploy: ${{ job.status }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`$(git rev-parse --short HEAD)\` $(git log -1 --format=%s | head -c 90) |"
            echo "| Web | https://staging-app.ayatalbayan.com |"
            echo "| API | $API_URL/health |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key
        if: always()
        run: rm -rf ~/.ssh/id_deploy

  # DEMO data on staging only: seed-demo.mjs refuses any database but the staging project (allowedTarget).
  seed:
    needs: [preflight, migrate]
    if: ${{ !cancelled() && needs.migrate.result == 'success' && inputs.seed_demo }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: pnpm turbo build --filter=@ab/shared
      - name: seed-demo on staging
        env:
          DATABASE_URL: ${{ secrets.STG_DATABASE_URL }}
        run: node tools/scripts/seed/seed-demo.mjs --allow-remote-staging

  # After a green deploy, start mobile.yml (ota-update, profile staging → channel staging) like the manual button.
  ota:
    needs: [plan, deploy]
    if: ${{ !cancelled() && needs.deploy.result == 'success' && needs.plan.outputs.ota == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          head=$(curl -fsS "${auth[@]}" "$api/branches/develop" | jq -r .commit.sha)
          if [ "$head" != "$SHA" ]; then echo "::notice::develop moved on (${head:0:7}): no OTA now"; exit 0; fi
          curl -fsS -X POST "${auth[@]}" "$api/actions/workflows/mobile.yml/dispatches" \
            -d '{"ref":"develop","inputs":{"action":"ota-update","profile":"staging"}}'
          echo "### OTA to staging started (mobile.yml) for \`${SHA:0:7}\`" >> "$GITHUB_STEP_SUMMARY"
