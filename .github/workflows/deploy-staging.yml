name: deploy-staging
# Deploy staging from GitHub (docs/09-deployment.md §GitHub deploy): Actions → deploy-staging → Run workflow.
# Every value comes from the GitHub environment "develop" (Settings → Environments → develop) or the
# repository secrets: secrets for anything private. The public staging values below are defaults; a
# variable of the same name overrides one. Nothing is read from a laptop.
# The server's .env is MERGED, not replaced: a key left empty in GitHub keeps the server's value.
# SAFETY: this workflow never sets MESSAGING_ENABLED or WA_PHONE_NUMBER_ID (the WhatsApp cut-over is the
# owner's, by hand), never touches /opt/wacrm, and only runs on develop (push → ci → here) or by hand.
# The repo is public: no pull_request trigger, no pull_request_target, secrets only in environment jobs.
on:
  # Automatic: every merge into develop, once ci has passed on it (a red develop never ships).
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [develop]
  # By hand: Actions → deploy-staging → Run workflow.
  workflow_dispatch:
    inputs:
      migrate:
        description: Push database migrations to the staging Supabase first
        type: boolean
        default: true
      env_only:
        description: Only update the server .env and restart the API (no code, no web, no migrations)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  # Is the develop environment set up? Without the deploy key an automatic run is skipped with a
  # warning (not a red ✗ on every merge); a run started by hand still fails and says what is missing.
  preflight:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
       && github.event.workflow_run.head_branch == 'develop'
       && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: develop
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Refuse to run while the messaging flag is on
        if: ${{ vars.MESSAGING_ENABLED == 'true' }}
        run: |
          echo "::error::the repository variable for the messaging flag is 'true'. Automation never switches WhatsApp sending on: set it by hand on the server (cut-over runbook) and delete the variable."
          exit 1
      - id: check
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY || secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          if [ -n "$SSH_PRIVATE_KEY" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          msg="staging deploy skipped: add the secret VPS_SSH_PRIVATE_KEY (or SSH_PRIVATE_KEY) and the STAGING_* secrets, see docs/09-deployment.md «GitHub Actions»"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "::error::$msg"; exit 1; fi
          echo "::warning::$msg"

  # Database first (environment staging-db: the owner's required reviewer gates it), then the API.
  migrate:
    needs: preflight
    if: >-
      needs.preflight.outputs.ready == 'true' &&
      (github.event_name == 'workflow_run' || (inputs.migrate && !inputs.env_only))
    permissions:
      contents: read
    uses: ./.github/workflows/db-migrate.yml
    with:
      apply: true
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}
    secrets: inherit

  deploy:
    needs: [preflight, migrate]
    # A skipped migrate (env_only / migrate unticked) is fine; a failed or declined one stops the deploy.
    if: ${{ !cancelled() && needs.preflight.outputs.ready == 'true' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: develop
    permissions:
      contents: read
    env:
      DEST: ${{ vars.DEPLOY_DIR || '/opt/ayat-albayan-staging' }}
      SSH_HOST: ${{ vars.SSH_HOST || secrets.VPS_HOST || '148.230.116.195' }}
      SSH_USER: ${{ vars.SSH_USER || secrets.VPS_USER || 'root' }}
    steps:
      - name: Refuse to run while the messaging flag is on
        if: ${{ vars.MESSAGING_ENABLED == 'true' }}
        run: |
          echo "::error::the repository variable for the messaging flag is 'true'. Automation never switches WhatsApp sending on."
          exit 1
      - uses: actions/checkout@v5
        with:
          # The exact commit ci passed on (auto), or the chosen branch (by hand).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Build the web app (before anything on the server changes)
        if: ${{ !inputs.env_only }}
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://api.ayatalbayan.com' }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.STAGING_SUPABASE_URL || 'https://knxfwiimjcifwckhwbim.supabase.co' }}
          # Public by design; accepted as a variable or a secret.
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY || secrets.STAGING_SUPABASE_ANON_KEY }}
        run: |
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "::error::add STAGING_SUPABASE_ANON_KEY (secret) or VITE_SUPABASE_ANON_KEY (variable)"; exit 1; }
          pnpm i --frozen-lockfile
          pnpm --filter @ab/db --filter @ab/shared build >/dev/null
          pnpm --filter web build

      - name: SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY || secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY" || { echo "::error::add the secret VPS_SSH_PRIVATE_KEY (or SSH_PRIVATE_KEY)"; exit 1; }
          echo "::add-mask::$SSH_HOST"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::SSH_KNOWN_HOSTS is not set: the host key is fetched with ssh-keyscan on every run, so a man-in-the-middle on the runner network would go unnoticed. Pin it: ssh-keyscan -t ed25519 <host> and save the line as the secret SSH_KNOWN_HOSTS."
            ssh-keyscan -H "$SSH_HOST" > ~/.ssh/known_hosts
          fi
          printf 'Host target\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' \
            "$SSH_HOST" "$SSH_USER" > ~/.ssh/config
          ssh target "test -d $DEST" || { echo "::error::$DEST missing on the server"; exit 1; }

      - name: Merge the server .env (key names only are logged)
        # API .env keys (apps/api/src/env.ts), scoped to this step only. The WhatsApp phone number id and
        # the messaging switch are deliberately NOT here: they stay whatever the server has.
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          WA_ACCESS_TOKEN: ${{ secrets.WA_ACCESS_TOKEN }}
          WA_APP_SECRET: ${{ secrets.WA_APP_SECRET }}
          WA_VERIFY_TOKEN: ${{ secrets.WA_VERIFY_TOKEN }}
          FEEDBACK_TOKEN_SECRET: ${{ secrets.FEEDBACK_TOKEN_SECRET }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          RECORDING_S3_ACCESS_KEY: ${{ secrets.RECORDING_S3_ACCESS_KEY }}
          RECORDING_S3_SECRET: ${{ secrets.RECORDING_S3_SECRET }}
          EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
          # … and variables:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.STAGING_SUPABASE_URL }}
          WEB_ORIGIN: ${{ vars.WEB_ORIGIN }}
          WA_API_BASE: ${{ vars.WA_API_BASE || 'https://graph.facebook.com' }}
          WA_API_VERSION: ${{ vars.WA_API_VERSION }}
          WA_WABA_ID: ${{ vars.WA_WABA_ID }}
          WA_APP_ID: ${{ vars.WA_APP_ID }}
          LIVEKIT_URL: ${{ vars.LIVEKIT_URL }}
          RECORDING_S3_ENDPOINT: ${{ vars.RECORDING_S3_ENDPOINT }}
          RECORDING_S3_REGION: ${{ vars.RECORDING_S3_REGION }}
          RECORDING_S3_BUCKET: ${{ vars.RECORDING_S3_BUCKET }}
          EXPO_API_BASE: ${{ vars.EXPO_API_BASE }}
          FX_API_URL: ${{ vars.FX_API_URL }}
        run: |
          umask 077
          # Missing file = start empty; present but unreadable = stop (never write a partial .env).
          ssh target "if [ -e $DEST/.env ]; then cat $DEST/.env; fi" > current.env
          keys="SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY SUPABASE_JWT_SECRET WEB_ORIGIN WA_API_BASE WA_API_VERSION
            WA_WABA_ID WA_ACCESS_TOKEN WA_APP_ID WA_APP_SECRET WA_VERIFY_TOKEN
            FEEDBACK_TOKEN_SECRET LIVEKIT_URL LIVEKIT_API_KEY LIVEKIT_API_SECRET RECORDING_S3_ENDPOINT RECORDING_S3_REGION
            RECORDING_S3_BUCKET RECORDING_S3_ACCESS_KEY RECORDING_S3_SECRET EXPO_ACCESS_TOKEN EXPO_API_BASE FX_API_URL"
          node tools/scripts/env-merge.mjs current.env $keys > new.env
          if cmp -s current.env new.env; then echo "server .env unchanged"; else
            ssh target "cp $DEST/.env $DEST/.env.bak-\$(date +%F-%H%M%S) 2>/dev/null || true; umask 077; cat > $DEST/.env.new && mv $DEST/.env.new $DEST/.env" < new.env
            echo "server .env updated (backup kept next to it)"; fi
          rm -f current.env new.env

      - name: Ship the API and rebuild its container
        if: ${{ !inputs.env_only }}
        run: |
          ssh target "rm -rf $DEST/src.new && mkdir -p $DEST/src.new"
          git archive --format=tar HEAD | ssh target "tar --no-same-owner -x -C $DEST/src.new"
          scp -q deploy/staging/docker-compose.yml "target:$DEST/docker-compose.yml"
          ssh target "cd $DEST && rm -rf src.old && { [ ! -d src ] || mv src src.old; } && mv src.new src \
            && docker compose up -d --build --remove-orphans \
            && docker image prune -f --filter 'label=com.docker.compose.project=ayat-albayan-staging' >/dev/null"

      - name: Restart the API with the new .env
        if: ${{ inputs.env_only }}
        run: ssh target "cd $DEST && docker compose up -d --force-recreate --remove-orphans"

      - name: Upload the web app (atomic swap)
        if: ${{ !inputs.env_only }}
        run: |
          ssh target "rm -rf $DEST/web.new && mkdir -p $DEST/web.new"
          tar -C apps/web/dist -cf - . | ssh target "tar --no-same-owner -x -C $DEST/web.new && chmod -R o+rX $DEST/web.new \
            && rm -rf $DEST/web.old && { [ ! -d $DEST/web ] || mv $DEST/web $DEST/web.old; } && mv $DEST/web.new $DEST/web"

      - name: Health check
        id: health
        env:
          API_URL: ${{ vars.API_URL || 'https://api.ayatalbayan.com' }}
        run: |
          url="${API_URL}"
          if [ -z "$url" ]; then ssh target "curl -fsS --retry 30 --retry-delay 5 --retry-all-errors http://127.0.0.1:3110/health"
          else curl -fsS --retry 30 --retry-delay 5 --retry-all-errors "$url/health"; fi
          echo; echo "staging is up"

      # The API or web swap broke staging: put the previous code and web build back. Database
      # migrations are not undone (they only add); the next good deploy picks up from here.
      - name: Roll back to the previous version
        if: ${{ failure() && steps.health.conclusion == 'failure' && !inputs.env_only }}
        run: |
          ssh target "cd $DEST && { [ ! -d src.old ] || { rm -rf src.bad && mv src src.bad && mv src.old src; }; } \
            && { [ ! -d web.old ] || { rm -rf web.bad && mv web web.bad && mv web.old web; }; } \
            && docker compose up -d --build --remove-orphans"
          echo "::error::health check failed: staging rolled back to the previous version (bad build kept in src.bad / web.bad)"

      - name: Summary
        if: always()
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          {
            echo "### Staging deploy: ${{ job.status }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`$(git rev-parse --short HEAD)\` $(git log -1 --format=%s | head -c 90) |"
            echo "| Trigger | ${{ github.event_name }} |"
            echo "| Web | https://app.ayatalbayan.com |"
            echo "| API | ${API_URL:-https://api.ayatalbayan.com}/health |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key
        if: always()
        run: rm -rf ~/.ssh/id_deploy
