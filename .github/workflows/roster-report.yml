name: roster-report
# Owner-run, read-only: every student with teacher, status, package and weekly slots from the
# staging database, as roster.csv attached to the run (kept 1 day; holds students' names, so it is
# never printed to the log). Actions → roster-report → Run workflow.
on:
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: develop
    steps:
      - uses: actions/checkout@v5
      - name: Query the staging database (read-only)
        env:
          PGHOST: ${{ vars.DB_POOLER_HOST || 'aws-1-eu-central-1.pooler.supabase.com' }}
          PGPORT: '5432'
          PGUSER: postgres.${{ vars.SUPABASE_PROJECT_REF || 'knxfwiimjcifwckhwbim' }}
          PGDATABASE: postgres
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGSSLMODE: require
        run: |
          test -n "$PGPASSWORD" || { echo "::error::add the secret SUPABASE_DB_PASSWORD to the develop environment"; exit 1; }
          sudo apt-get -qq install -y postgresql-client >/dev/null 2>&1 || true
          psql -v ON_ERROR_STOP=1 -q -f tools/reports/roster-report.sql
          echo "rows: $(($(wc -l < roster.csv) - 1))"
      - uses: actions/upload-artifact@v4
        with:
          name: roster
          path: roster.csv
          retention-days: 1
