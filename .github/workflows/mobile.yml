name: mobile
# Android preview APK and over-the-air (OTA) updates from GitHub instead of the owner's PC
# (docs/09-deployment.md «GitHub Actions»). Manual (Actions → mobile → Run workflow, on develop), or an
# ota-update to preview started by deploy-staging after a deploy with mobile JS changes and no native change.
# Never production, never iOS/Apple. The repo is public: no pull_request trigger; EXPO_TOKEN lives
# in the environment `mobile` (restrict it to develop). An OTA replaces JavaScript only, so it is
# refused when a native dependency, plugin or app.json native field changed since the last build.
# profile stripe-test (owner 2026-10-28, docs/30): the separate Stripe TEST app (eas.json `stripe-test`,
# APP_VARIANT=stripetest, no FCM push): its APK, or an OTA to its own channel compared with its own last build.
# app family (owner 2026-11-14, docs/50 §7): the separate family app apps/family (its own EAS project
# @holdmycup/ayat-albayan-family, linked or created by `eas init` first): its eas.json `preview` APK, or an
# OTA to its channel preview compared with its own last build. profile and branch apply to the staff app only.
# Every automatic run (deploy-staging) sends no app and no profile, so it stays the staff app's preview.
# deploy-staging.yml «plan» finds the last preview OTA by this title (tools/scripts/env/deploy-baseline.mjs):
# a stripe-test run is titled «... stripe-test» and a family run «... family-preview», so neither is ever taken
# for the staff app's preview OTA.
run-name: >-
  mobile ${{ inputs.action }}
  ${{ inputs.app == 'family' && 'family-preview'
  || inputs.profile == 'stripe-test' && 'stripe-test' || inputs.branch }}
on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        options: [build-android-apk, ota-update, both]
        default: ota-update
      branch:
        description: Staff app only, EAS update branch and environment (the preview APK listens to preview)
        type: choice
        options: [preview, development]
        default: preview
      app:
        description: "staff (apps/mobile, the normal app) or family (apps/family, guardians and students: docs/50)"
        type: choice
        options: [staff, family]
        default: staff
      profile:
        description: "Staff app only: preview (the normal one) or stripe-test (the separate Stripe test APK, channel stripe-test; branch is then ignored)"
        type: choice
        options: [preview, stripe-test]
        default: preview
      force_ota:
        description: "I confirm: ship the OTA although a native change was found (the installed app may crash until a new APK is installed)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mobile
  cancel-in-progress: false

env:
  EAS_CLI: eas-cli@24.10.0
  # The Expo project every step works in, and its native-change guard's app (native-changes.mjs).
  APP_DIR: ${{ inputs.app == 'family' && 'apps/family' || 'apps/mobile' }}

jobs:
  build:
    if: ${{ inputs.action == 'build-android-apk' || inputs.action == 'both' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: mobile
    outputs:
      eas_url: ${{ steps.eas.outputs.url }}
    steps:
      - name: Develop only
        env:
          REF: ${{ github.ref }}
        run: test "$REF" = refs/heads/develop || { echo "::error::run this workflow on develop (it is on $REF)"; exit 1; }
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Both apps, whichever this run ships (a missing file is skipped: plain grep would exit 2 and pass).
      - name: Never re-add forcesRTL
        run: |
          for f in apps/{mobile,family}/app.json apps/{mobile,family}/app.config.ts; do
            [ ! -f "$f" ] || ! grep -n forcesRTL "$f" || exit 1
          done
      # `eas build` loads the app config, which resolves the config plugins (expo-router ...) from
      # node_modules: without the install it fails «Failed to resolve plugin for module "expo-router"» (run 39154529791).
      - run: pnpm i --frozen-lockfile
      # The family app's EAS project (owner `holdmycup`, slug ayat-albayan-family): `eas init --force` links it, or
      # creates it on the first run. Its app.config.ts is dynamic, so eas init cannot write the id there: it prints
      # it (and may exit non-zero). The id goes to FAMILY_EAS_PROJECT_ID for the next steps (app.config.ts reads it)
      # and to the run summary (not a secret) for the owner to keep (docs/50 §8).
      - name: Link the family EAS project (eas init)
        if: ${{ inputs.app == 'family' }}
        working-directory: apps/family
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN" || { echo "::error::add the secret EXPO_TOKEN to the environment mobile"; exit 1; }
          rc=0
          npx --yes "$EAS_CLI" init --non-interactive --force > "$RUNNER_TEMP/eas-init.log" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/eas-init.log"
          uuid='[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'
          ids=$(grep -oE "$uuid" "$RUNNER_TEMP/eas-init.log" | tr 'A-F' 'a-f' | sort -u || true)
          if [ -z "$ids" ] || [ "$(wc -l <<< "$ids")" != 1 ]; then
            echo "::error::eas init (exit $rc) printed no single project id (${ids:-none}): see above"
            exit 1
          fi
          echo "FAMILY_EAS_PROJECT_ID=$ids" >> "$GITHUB_ENV"
          {
            echo "### Family EAS project @holdmycup/ayat-albayan-family"
            echo "FAMILY_EAS_PROJECT_ID=\`$ids\` (eas init exit $rc). Keep it as docs/50 §8 says."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: EAS build (Android APK of the chosen profile, built on Expo's servers)
        id: eas
        working-directory: ${{ env.APP_DIR }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PROFILE: ${{ inputs.app == 'family' && 'preview' || inputs.profile || 'preview' }}
        # pipefail: a failed build still fails the step through the tee. The build page link it prints (expo.dev,
        # no secret) goes to the release notes (job «release»).
        run: |
          test -n "$EXPO_TOKEN" || { echo "::error::add the secret EXPO_TOKEN to the environment mobile"; exit 1; }
          set -o pipefail
          npx --yes "$EAS_CLI" build --platform android --profile "$PROFILE" --non-interactive 2>&1 | tee "$RUNNER_TEMP/eas-build.log"
          url=$(grep -oE 'https://expo\.dev/accounts/[^[:space:]]+/builds/[0-9a-f-]+' "$RUNNER_TEMP/eas-build.log" | tail -1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"

  ota:
    needs: build
    # Runs after a successful build (action=both) or alone (ota-update); never after a failed or skipped-by-mistake one.
    if: ${{ !cancelled() && (inputs.action == 'ota-update' || (inputs.action == 'both' && needs.build.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: mobile
    steps:
      - name: Develop only
        env:
          REF: ${{ github.ref }}
        run: test "$REF" = refs/heads/develop || { echo "::error::run this workflow on develop (it is on $REF)"; exit 1; }
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Both apps, whichever this run ships (a missing file is skipped: plain grep would exit 2 and pass).
      - name: Never re-add forcesRTL
        run: |
          for f in apps/{mobile,family}/app.json apps/{mobile,family}/app.config.ts; do
            [ ! -f "$f" ] || ! grep -n forcesRTL "$f" || exit 1
          done
      # Install BEFORE the guard: `eas build:list` loads the app config, which resolves the config plugins
      # (expo-router ...) from node_modules. No secret is present in this step.
      - run: pnpm i --frozen-lockfile
      # Metro resolves @ab/shared (and the packages cut from it) through their `exports` (dist/index.js),
      # which only exist after a build:
      # without it `eas update` fails with "While trying to resolve module `@ab/shared`" (run 37498286784).
      - run: pnpm --filter "mobile^..." build
        if: ${{ inputs.app != 'family' }}
      - run: pnpm --filter "family^..." build
        if: ${{ inputs.app == 'family' }}
      # The family app's EAS project (owner `holdmycup`, slug ayat-albayan-family): `eas init --force` links it, or
      # creates it on the first run. Its app.config.ts is dynamic, so eas init cannot write the id there: it prints
      # it (and may exit non-zero). The id goes to FAMILY_EAS_PROJECT_ID for the next steps (app.config.ts reads it)
      # and to the run summary (not a secret) for the owner to keep (docs/50 §8).
      - name: Link the family EAS project (eas init)
        if: ${{ inputs.app == 'family' }}
        working-directory: apps/family
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN" || { echo "::error::add the secret EXPO_TOKEN to the environment mobile"; exit 1; }
          rc=0
          npx --yes "$EAS_CLI" init --non-interactive --force > "$RUNNER_TEMP/eas-init.log" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/eas-init.log"
          uuid='[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'
          ids=$(grep -oE "$uuid" "$RUNNER_TEMP/eas-init.log" | tr 'A-F' 'a-f' | sort -u || true)
          if [ -z "$ids" ] || [ "$(wc -l <<< "$ids")" != 1 ]; then
            echo "::error::eas init (exit $rc) printed no single project id (${ids:-none}): see above"
            exit 1
          fi
          echo "FAMILY_EAS_PROJECT_ID=$ids" >> "$GITHUB_ENV"
          {
            echo "### Family EAS project @holdmycup/ayat-albayan-family"
            echo "FAMILY_EAS_PROJECT_ID=\`$ids\` (eas init exit $rc). Keep it as docs/50 §8 says."
          } >> "$GITHUB_STEP_SUMMARY"
      # APP_DIR (workflow env) tells native-changes.mjs which app to compare; the last build is that app's own.
      - name: Native-change guard (OTA = JavaScript only)
        working-directory: ${{ env.APP_DIR }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          FORCE: ${{ inputs.force_ota }}
          PROFILE: ${{ inputs.app == 'family' && 'preview' || inputs.profile || 'preview' }}
        run: |
          test -n "$EXPO_TOKEN" || { echo "::error::add the secret EXPO_TOKEN to the environment mobile"; exit 1; }
          last=$(npx --yes "$EAS_CLI" build:list --platform android --build-profile "$PROFILE" --status finished --limit 1 --json --non-interactive \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const b=JSON.parse(s)[0];console.log(b&&b.gitCommitHash||"")})')
          cd ../..
          if [ -z "$last" ]; then
            echo "::warning::no finished $PROFILE build found, so a native change cannot be ruled out"
            rc=1
          else
            rc=0; node tools/scripts/ci-checks/native-changes.mjs "$last" "$PROFILE" || rc=$?
          fi
          if [ "$rc" != 0 ] && [ "$FORCE" != true ]; then
            echo "::error::native change (or unknown last build): an OTA would not reach it. Build a new APK (action build-android-apk), or tick force_ota to ship anyway."
            exit 1
          fi
          if [ "$rc" != 0 ]; then echo "::warning::force_ota ticked: shipping the OTA despite the native change"; fi
      # The stripe-test app has no FCM (app.config.ts drops googleServicesFile), so it never needs the file. The
      # family app's file is its own EAS project's GOOGLE_SERVICES_JSON file variable (docs/50 §8), not this secret.
      - name: Write the Firebase file (only if the secret exists)
        if: ${{ inputs.app != 'family' && inputs.profile != 'stripe-test' }}
        env:
          GOOGLE_SERVICES_JSON_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_SECRET" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_SECRET" > "$RUNNER_TEMP/google-services.json"
            echo "GOOGLE_SERVICES_JSON=$RUNNER_TEMP/google-services.json" >> "$GITHUB_ENV"
          fi
      - name: EAS update
        working-directory: ${{ env.APP_DIR }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BRANCH: ${{ inputs.branch }}
          APP: ${{ inputs.app || 'staff' }}
          PROFILE: ${{ inputs.app == 'family' && 'preview' || inputs.profile || 'preview' }}
          COMMIT: ${{ github.sha }}
          # Stripe go live (owner 2026-11-01, docs/30): the normal app's OTA has the pay-link buttons too, like
          # eas.json `preview`. They show only when GET /stripe/feature says so (the API's switch and keys).
          EXPO_PUBLIC_FEATURE_STRIPE: "1"
        run: |
          if [ "$APP" = family ]; then
            # apps/family/eas.json preview: channel and environment preview, no Stripe flag (its env decides).
            unset EXPO_PUBLIC_FEATURE_STRIPE
            npx --yes "$EAS_CLI" update --channel preview --environment preview \
              --message "Family OTA from GitHub ${COMMIT:0:7}" --non-interactive
            exit 0
          fi
          if [ "$PROFILE" = stripe-test ]; then
            # The eas.json stripe-test env (Stripe UI on, the test app's config) and its own channel / environment.
            export EXPO_PUBLIC_FEATURE_STRIPE=1 APP_VARIANT=stripetest
            npx --yes "$EAS_CLI" update --channel stripe-test --environment preview \
              --message "Stripe test OTA from GitHub ${COMMIT:0:7}" --non-interactive
            exit 0
          fi
          npx --yes "$EAS_CLI" update --branch "$EAS_BRANCH" --environment "$EAS_BRANCH" \
            --message "OTA from GitHub ${COMMIT:0:7}" --non-interactive
      - name: Remove the Firebase file
        if: always()
        run: rm -f "$RUNNER_TEMP/google-services.json"

  # Release tag + GitHub Release per shipped APK / OTA (owner 2026-10-30, docs/09 «Release tags»), on the commit
  # this run built; skipped when that commit already has a tag of the family (a re-run). The only job here that may
  # write contents; no environment, no secret. A failure only warns, and continue-on-error keeps the run green
  # (deploy-baseline.mjs reads the green mobile runs).
  release:
    needs: [build, ota]
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.ota.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Tag the APK
        if: ${{ needs.build.result == 'success' }}
        env:
          KIND: apk
          # The family APK: mobile-family-v<version>-b<run> (release-tag.mjs prefixes a non-preview profile).
          PROFILE: ${{ inputs.app == 'family' && 'family' || inputs.profile || 'preview' }}
          EAS_URL: ${{ needs.build.outputs.eas_url }}
        run: VERSION=$(jq -r .expo.version "$APP_DIR/app.json") node tools/scripts/ci-checks/release-tags/release-tag.mjs
      - name: Tag the OTA
        if: ${{ needs.ota.result == 'success' }}
        env:
          KIND: ota
          # ota-family-preview-<day>-<n> for the family app: never the staff app's ota-preview-… family of tags.
          CHANNEL: >-
            ${{ inputs.app == 'family' && 'family-preview'
            || inputs.profile == 'stripe-test' && 'stripe-test' || inputs.branch }}
        run: node tools/scripts/ci-checks/release-tags/release-tag.mjs
