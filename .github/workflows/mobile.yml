name: mobile
# Android APKs and over-the-air (OTA) updates from GitHub instead of the owner's PC
# (docs/09-deployment.md «GitHub Actions»). Manual (Actions → mobile → Run workflow, on develop), or an
# ota-update started after a deploy with mobile JS changes and no native change: deploy-production → preview
# (the PRODUCTION app, the phones in use), deploy-staging → profile staging (the staging app, channel staging).
# Never iOS/Apple. The repo is public: no pull_request trigger; EXPO_TOKEN lives
# in the environment `mobile` (restrict it to develop). An OTA replaces JavaScript only, so it is
# refused when a native dependency, plugin or app.json native field changed since the last build.
# Side apps (eas.json, each its own package, name and channel, no FCM push, pointed at STAGING, EAS environment
# development): profile stripe-test (owner 2026-10-28, docs/30, the Stripe TEST app) and profile staging (owner
# 2026-10-31, «آيات البيان (تجريبي)»). Their APK, or an OTA to their own channel compared with their own last build.
# deploy-production.yml «plan» finds the last preview OTA by this title (tools/scripts/env/deploy-baseline.mjs),
# deploy-staging.yml the last staging one: a side run is titled with its profile, never taken for preview.
run-name: mobile ${{ inputs.action }} ${{ inputs.profile != 'preview' && inputs.profile || inputs.branch }}
on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        options: [build-android-apk, ota-update, both]
        default: ota-update
      branch:
        description: EAS update branch and environment for profile preview (the production APK listens to preview)
        type: choice
        options: [preview, development]
        default: preview
      profile:
        description: "Which app: preview (the normal production one), stripe-test (the Stripe test APK) or staging (the staging APK); a side app uses its own channel and ignores branch"
        type: choice
        options: [preview, stripe-test, staging]
        default: preview
      force_ota:
        description: "I confirm: ship the OTA although a native change was found (the installed app may crash until a new APK is installed)"
        type: boolean
        default: false

permissions:
  contents: read

# Per app: a staging OTA never waits behind (or cancels) a production one.
concurrency:
  group: mobile-${{ inputs.profile || 'preview' }}
  cancel-in-progress: false

env:
  EAS_CLI: eas-cli@24.10.0

jobs:
  build:
    if: ${{ inputs.action == 'build-android-apk' || inputs.action == 'both' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: mobile
    outputs:
      eas_url: ${{ steps.eas.outputs.url }}
    steps:
      - name: Develop only
        env:
          REF: ${{ github.ref }}
        run: test "$REF" = refs/heads/develop || { echo "::error::run this workflow on develop (it is on $REF)"; exit 1; }
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Never re-add forcesRTL
        run: "! grep -n forcesRTL apps/mobile/app.json apps/mobile/app.config.ts"
      # `eas build` loads the app config, which resolves the config plugins (expo-router ...) from
      # node_modules: without the install it fails «Failed to resolve plugin for module "expo-router"» (run 39154529791).
      - run: pnpm i --frozen-lockfile
      - name: EAS build (Android APK of the chosen profile, built on Expo's servers)
        id: eas
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PROFILE: ${{ inputs.profile || 'preview' }}
        # pipefail: a failed build still fails the step through the tee. The build page link it prints (expo.dev,
        # no secret) goes to the release notes (job «release»).
        run: |
          test -n "$EXPO_TOKEN" || { echo "::error::add the secret EXPO_TOKEN to the environment mobile"; exit 1; }
          set -o pipefail
          npx --yes "$EAS_CLI" build --platform android --profile "$PROFILE" --non-interactive 2>&1 | tee "$RUNNER_TEMP/eas-build.log"
          url=$(grep -oE 'https://expo\.dev/accounts/[^[:space:]]+/builds/[0-9a-f-]+' "$RUNNER_TEMP/eas-build.log" | tail -1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"

  ota:
    needs: build
    # Runs after a successful build (action=both) or alone (ota-update); never after a failed or skipped-by-mistake one.
    if: ${{ !cancelled() && (inputs.action == 'ota-update' || (inputs.action == 'both' && needs.build.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: mobile
    steps:
      - name: Develop only
        env:
          REF: ${{ github.ref }}
        run: test "$REF" = refs/heads/develop || { echo "::error::run this workflow on develop (it is on $REF)"; exit 1; }
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Never re-add forcesRTL
        run: "! grep -n forcesRTL apps/mobile/app.json apps/mobile/app.config.ts"
      # Install BEFORE the guard: `eas build:list` loads the app config, which resolves the config plugins
      # (expo-router ...) from node_modules. No secret is present in this step.
      - run: pnpm i --frozen-lockfile
      # Metro resolves @ab/shared through its `exports` (dist/index.js), which only exists after a build:
      # without it `eas update` fails with "While trying to resolve module `@ab/shared`" (run 37498286784).
      - run: pnpm --filter @ab/db --filter @ab/shared --filter @ab/client-core build
      - name: Native-change guard (OTA = JavaScript only)
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          FORCE: ${{ inputs.force_ota }}
          PROFILE: ${{ inputs.profile || 'preview' }}
        run: |
          test -n "$EXPO_TOKEN" || { echo "::error::add the secret EXPO_TOKEN to the environment mobile"; exit 1; }
          last=$(npx --yes "$EAS_CLI" build:list --platform android --build-profile "$PROFILE" --status finished --limit 1 --json --non-interactive \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const b=JSON.parse(s)[0];console.log(b&&b.gitCommitHash||"")})')
          cd ../..
          if [ -z "$last" ]; then
            echo "::warning::no finished $PROFILE build found, so a native change cannot be ruled out"
            rc=1
          else
            rc=0; node tools/scripts/ci-checks/native-changes.mjs "$last" "$PROFILE" || rc=$?
          fi
          if [ "$rc" != 0 ] && [ "$FORCE" != true ]; then
            echo "::error::native change (or unknown last build): an OTA would not reach it. Build a new APK (action build-android-apk), or tick force_ota to ship anyway."
            exit 1
          fi
          if [ "$rc" != 0 ]; then echo "::warning::force_ota ticked: shipping the OTA despite the native change"; fi
      # The side apps have no FCM (app.config.ts drops googleServicesFile), so they never need the file.
      - name: Write the Firebase file (only if the secret exists)
        if: ${{ (inputs.profile || 'preview') == 'preview' }}
        env:
          GOOGLE_SERVICES_JSON_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_SECRET" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_SECRET" > "$RUNNER_TEMP/google-services.json"
            echo "GOOGLE_SERVICES_JSON=$RUNNER_TEMP/google-services.json" >> "$GITHUB_ENV"
          fi
      - name: EAS update
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BRANCH: ${{ inputs.branch }}
          PROFILE: ${{ inputs.profile || 'preview' }}
          COMMIT: ${{ github.sha }}
        run: |
          if [ "$PROFILE" != preview ]; then
            # A side app: the bundle gets its eas.json profile env exactly as its build did (APP_VARIANT, the staging
            # URLs, the Stripe flag), its own channel and the profile's EAS environment (development).
            eval "$(node -p 'Object.entries(require("./eas.json").build[process.env.PROFILE].env).map(([k, v]) => `export ${k}=${JSON.stringify(v)}`).join("\n")')"
            npx --yes "$EAS_CLI" update --channel "$PROFILE" --environment "$(node -p 'require("./eas.json").build[process.env.PROFILE].environment')" \
              --message "$PROFILE OTA from GitHub ${COMMIT:0:7}" --non-interactive
            exit 0
          fi
          npx --yes "$EAS_CLI" update --branch "$EAS_BRANCH" --environment "$EAS_BRANCH" \
            --message "OTA from GitHub ${COMMIT:0:7}" --non-interactive
      - name: Remove the Firebase file
        if: always()
        run: rm -f "$RUNNER_TEMP/google-services.json"

  # Release tag + GitHub Release per shipped APK / OTA (owner 2026-10-30, docs/09 «Release tags»), on the commit
  # this run built; skipped when that commit already has a tag of the family (a re-run). The only job here that may
  # write contents; no environment, no secret. A failure only warns, and continue-on-error keeps the run green
  # (deploy-baseline.mjs reads the green mobile runs).
  release:
    needs: [build, ota]
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.ota.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Tag the APK
        if: ${{ needs.build.result == 'success' }}
        env:
          KIND: apk
          PROFILE: ${{ inputs.profile || 'preview' }}
          EAS_URL: ${{ needs.build.outputs.eas_url }}
        run: VERSION=$(jq -r .expo.version apps/mobile/app.json) node tools/scripts/ci-checks/release-tags/release-tag.mjs
      - name: Tag the OTA
        if: ${{ needs.ota.result == 'success' }}
        env:
          KIND: ota
          CHANNEL: ${{ inputs.profile != 'preview' && inputs.profile || inputs.branch }}
        run: node tools/scripts/ci-checks/release-tags/release-tag.mjs
