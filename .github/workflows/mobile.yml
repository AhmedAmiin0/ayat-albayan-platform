name: mobile
# Android preview APK and over-the-air (OTA) updates from GitHub instead of the owner's PC
# (docs/09-deployment.md «GitHub Actions»). Manual (Actions → mobile → Run workflow, on develop), or an
# ota-update to preview started by deploy-staging after a deploy with mobile JS changes and no native change.
# Never iOS/Apple; production only as the family app's Google Play build (below). The repo is public: no pull_request trigger; EXPO_TOKEN lives
# in the environment `mobile` (restrict it to develop). An OTA replaces JavaScript only, so it is
# refused when a native dependency, plugin or app.json native field changed since the last build.
# profile stripe-test (owner 2026-10-28, docs/30): the separate Stripe TEST app (eas.json `stripe-test`,
# APP_VARIANT=stripetest, no FCM push): its APK, or an OTA to its own channel compared with its own last build.
# app family (owner 2026-11-14, docs/50 §7): the separate family app apps/family-mobile (its own EAS project
# @holdmycup/ayat-albayan-family, linked or created by `eas init` first): its eas.json `preview` APK, or an
# OTA to its channel preview compared with its own last build. profile and branch apply to the staff app only.
# app family + profile production (owner 2026-11-21): the Google Play bundle (eas.json `production`: an AAB,
# channel and EAS environment production, so the build talks to the production API), tagged KIND aab. The staff
# app with profile production is refused. Nothing is submitted.
# app family + profile production + ota-update (lane L06, owner 2026-11-22): an OTA to the store build, channel
# and EAS environment production, by hand only (an automatic run or action both is refused), behind the same
# native-change guard compared with the last production build. runtimeVersion is the native fingerprint.
# builder github (owner 2026-11-24, docs/09 «Android build on the runner»): the build job runs `eas build --local`
# on the GitHub runner instead of Expo's servers (their free Android builds can run out for the month). The same
# profile, EAS environment and remote keystore; the file is uploaded as the run's artifact and tagged like a cloud
# build, and that tag is how the OTA guard knows the build (native/last-build.mjs). expo (default) is unchanged.
# Automatic runs (deploy-staging) send no profile: the staff app's preview, or app=family on channel preview.
# deploy-staging.yml «plan» finds the last preview OTA by this title (tools/scripts/env/deploy-baseline.mjs):
# a stripe-test run is titled «... stripe-test» and a family run «... family-preview», so neither is ever taken
# for the staff app's preview OTA.
run-name: >-
  mobile ${{ inputs.action }}
  ${{ inputs.app == 'family' && inputs.profile == 'production' && 'family-production'
  || inputs.app == 'family' && 'family-preview'
  || inputs.profile == 'stripe-test' && 'stripe-test' || inputs.branch }}
on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        options: [build-android-apk, ota-update, both]
        default: ota-update
      branch:
        description: Staff app only, EAS update branch and environment (the preview APK listens to preview)
        type: choice
        options: [preview, development]
        default: preview
      app:
        description: "staff (apps/staff-mobile, the normal app) or family (apps/family-mobile, guardians and students: docs/50)"
        type: choice
        options: [staff, family]
        default: staff
      profile:
        description: "Staff app: preview (the normal one) or stripe-test (the separate Stripe test APK, channel stripe-test; branch is then ignored). Family app: preview (its APK) or production = the Google Play AAB (eas.json production, EAS environment production; not submitted) with build-android-apk, or an OTA to channel production with ota-update"
        type: choice
        options: [preview, stripe-test, production]
        default: preview
      builder:
        description: "Where the Android build runs: expo (EAS cloud, the default) or github (eas build --local on this runner, the file uploaded as the run's artifact)"
        type: choice
        options: [expo, github]
        default: expo
      force_ota:
        description: "I confirm: ship the OTA although a native change was found (the installed app may crash until a new APK is installed)"
        type: boolean
        default: false

permissions:
  contents: read

# One queue per app: deploy-staging may dispatch the staff and the family OTA together, and a second pending
# run in one group would cancel the first.
concurrency:
  group: mobile-${{ inputs.app || 'staff' }}
  cancel-in-progress: false

env:
  EAS_CLI: eas-cli@24.10.0
  # The Expo project every step works in, and its native-change guard's app (native-changes.mjs).
  APP_DIR: ${{ inputs.app == 'family' && 'apps/family-mobile' || 'apps/staff-mobile' }}

jobs:
  build:
    if: ${{ inputs.action == 'build-android-apk' || inputs.action == 'both' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.builder == 'github' && 90 || 60 }}
    environment: mobile
    outputs:
      # A runner build has no expo.dev page: the release links its artifact instead.
      eas_url: ${{ steps.eas.outputs.url }}
      artifact_url: ${{ steps.upload.outputs.artifact-url }}
      sha256: ${{ steps.runner.outputs.sha256 }}
    steps:
      - name: Develop only
        env:
          REF: ${{ github.ref }}
        run: test "$REF" = refs/heads/develop || { echo "::error::run this workflow on develop (it is on $REF)"; exit 1; }
      - name: Family production builds only
        if: ${{ inputs.profile == 'production' && inputs.app != 'family' }}
        run: |
          echo "::error::profile production is the family app's Google Play build: choose app family"
          exit 1
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/pnpm-store
      # Both apps, whichever this run ships (a missing file is skipped: plain grep would exit 2 and pass).
      - name: Never re-add forcesRTL
        run: |
          for f in apps/{staff-mobile,family-mobile}/app.json apps/{staff-mobile,family-mobile}/app.config.ts; do
            [ ! -f "$f" ] || ! grep -n forcesRTL "$f" || exit 1
          done
      # `eas build` loads the app config, which resolves the config plugins (expo-router ...) from
      # node_modules: without the install it fails «Failed to resolve plugin for module "expo-router"» (run 39154529791).
      - run: pnpm i --frozen-lockfile
      # The family app's EAS project: linked or created, its id exported (eas-init-family.sh).
      - name: Link the family EAS project (eas init)
        if: ${{ inputs.app == 'family' }}
        working-directory: apps/family-mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: bash ../../tools/scripts/ci-checks/eas-init-family.sh
      # The family runtime (app.json runtimeVersion policy fingerprint, lane L06): an OTA reaches only a build of
      # the same value, so it must equal the runtime version on the EAS build page (fingerprint.config.cjs).
      - name: Family runtime (fingerprint)
        if: ${{ inputs.app == 'family' }}
        working-directory: apps/family-mobile
        run: |
          hash=$(npx expo-updates fingerprint:generate --platform android | jq -r .hash)
          echo "Family runtime (fingerprint): \`$hash\`" >> "$GITHUB_STEP_SUMMARY"
      # The family app: preview (APK) unless profile production (eas.json production: AAB, environment production).
      - name: EAS build (Android APK or the family AAB of the chosen profile, built on Expo's servers)
        id: eas
        if: ${{ inputs.builder != 'github' }}
        working-directory: ${{ env.APP_DIR }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PROFILE: ${{ inputs.app == 'family' && (inputs.profile == 'production' && 'production' || 'preview') || inputs.profile || 'preview' }}
        # pipefail: a failed build still fails the step through the tee. The build page link it prints (expo.dev,
        # no secret) goes to the release notes (job «release»).
        run: |
          test -n "$EXPO_TOKEN" || { echo "::error::add the secret EXPO_TOKEN to the environment mobile"; exit 1; }
          set -o pipefail
          npx --yes "$EAS_CLI" build --platform android --profile "$PROFILE" --non-interactive 2>&1 | tee "$RUNNER_TEMP/eas-build.log"
          url=$(grep -oE 'https://expo\.dev/accounts/[^[:space:]]+/builds/[0-9a-f-]+' "$RUNNER_TEMP/eas-build.log" | tail -1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      # builder github: the runner's own Android SDK (ANDROID_HOME) with Java 17, and room for Gradle.
      - name: Free disk space for the Android build
        if: ${{ inputs.builder == 'github' }}
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost && df -h /
      - uses: actions/setup-java@v5
        if: ${{ inputs.builder == 'github' }}
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK (the runner's)
        if: ${{ inputs.builder == 'github' }}
        run: |
          test -d "${ANDROID_HOME:-}" || { echo "::error::the runner has no Android SDK at ANDROID_HOME"; exit 1; }
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          java -version
      # Pulls the profile's EAS environment (values never printed), checks the family store build's API and
      # Firebase file, builds with the remote keystore, then writes the sha256 and versionCode to the summary.
      - name: Runner build (eas build --local, the profile's EAS environment and remote keystore)
        id: runner
        if: ${{ inputs.builder == 'github' }}
        working-directory: ${{ env.APP_DIR }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          APP: ${{ inputs.app || 'staff' }}
          PROFILE: ${{ inputs.app == 'family' && (inputs.profile == 'production' && 'production' || 'preview') || inputs.profile || 'preview' }}
          RUN_NUMBER: ${{ github.run_number }}
        run: bash ../../tools/scripts/ci-checks/eas-local-build.sh
      # The very file the build wrote and the summary hashed: stored as is (no recompression).
      - name: Upload the runner build
        id: upload
        if: ${{ inputs.builder == 'github' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.runner.outputs.artifact }}
          path: ${{ steps.runner.outputs.file }}
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
      - name: Remove the pulled EAS environment
        if: ${{ always() && inputs.builder == 'github' }}
        run: rm -rf "$RUNNER_TEMP/eas-env" "$APP_DIR/.eas"

  ota:
    needs: build
    # Runs after a successful build (action=both) or alone (ota-update); never after a failed or skipped-by-mistake one.
    if: ${{ !cancelled() && (inputs.action == 'ota-update' || (inputs.action == 'both' && needs.build.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: mobile
    steps:
      - name: Develop only
        env:
          REF: ${{ github.ref }}
        run: test "$REF" = refs/heads/develop || { echo "::error::run this workflow on develop (it is on $REF)"; exit 1; }
      # The store OTA: the family app, action ota-update, started by a person (deploy-staging's bot never).
      - name: Family production OTA by hand only
        if: ${{ inputs.profile == 'production' }}
        env:
          APP: ${{ inputs.app }}
          ACTION: ${{ inputs.action }}
          ACTOR: ${{ github.actor }}
        run: |
          test "$APP" = family || { echo "::error::profile production is the family app's: choose app family"; exit 1; }
          test "$ACTION" = ota-update || { echo "::error::a production OTA is action ota-update only"; exit 1; }
          test "$ACTOR" != 'github-actions[bot]' || { echo "::error::a production OTA is started by hand only"; exit 1; }
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/pnpm-store
      # Both apps, whichever this run ships (a missing file is skipped: plain grep would exit 2 and pass).
      - name: Never re-add forcesRTL
        run: |
          for f in apps/{staff-mobile,family-mobile}/app.json apps/{staff-mobile,family-mobile}/app.config.ts; do
            [ ! -f "$f" ] || ! grep -n forcesRTL "$f" || exit 1
          done
      # Install BEFORE the guard: `eas build:list` loads the app config, which resolves the config plugins
      # (expo-router ...) from node_modules. No secret is present in this step.
      - run: pnpm i --frozen-lockfile
      # Metro resolves @ab/shared (and the packages cut from it) through their `exports` (dist/index.js),
      # which only exist after a build:
      # without it `eas update` fails with "While trying to resolve module `@ab/shared`" (run 37498286784).
      - run: pnpm --filter "staff-mobile^..." build
        if: ${{ inputs.app != 'family' }}
      - run: pnpm --filter "family-mobile^..." build
        if: ${{ inputs.app == 'family' }}
      # The family app's EAS project: linked or created, its id exported (eas-init-family.sh).
      - name: Link the family EAS project (eas init)
        if: ${{ inputs.app == 'family' }}
        working-directory: apps/family-mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: bash ../../tools/scripts/ci-checks/eas-init-family.sh
      # The family runtime (app.json runtimeVersion policy fingerprint, lane L06): an OTA reaches only a build of
      # the same value, so it must equal the runtime version on the EAS build page (fingerprint.config.cjs).
      - name: Family runtime (fingerprint)
        if: ${{ inputs.app == 'family' }}
        working-directory: apps/family-mobile
        run: |
          hash=$(npx expo-updates fingerprint:generate --platform android | jq -r .hash)
          echo "Family runtime (fingerprint): \`$hash\`" >> "$GITHUB_STEP_SUMMARY"
      # APP_DIR (workflow env) tells native-changes.mjs which app to compare; the last build is that app's own,
      # from EAS or from the runner (builder github), whichever is newer. fetch-depth 0 brings the tags.
      - name: Native-change guard (OTA = JavaScript only)
        working-directory: ${{ env.APP_DIR }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          FORCE: ${{ inputs.force_ota }}
          APP: ${{ inputs.app || 'staff' }}
          # action both with builder github: this run's runner build, which is not tagged yet.
          JUST_BUILT: ${{ inputs.action == 'both' && inputs.builder == 'github' && needs.build.result == 'success' && github.sha || '' }}
          PROFILE: ${{ inputs.app == 'family' && (inputs.profile == 'production' && 'production' || 'preview') || inputs.profile || 'preview' }}
        run: |
          test -n "$EXPO_TOKEN" || { echo "::error::add the secret EXPO_TOKEN to the environment mobile"; exit 1; }
          eas=$(npx --yes "$EAS_CLI" build:list --platform android --build-profile "$PROFILE" --status finished --limit 1 --json --non-interactive \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const b=JSON.parse(s)[0];console.log(b&&b.gitCommitHash||"")})')
          cd ../..
          # The newest of the last EAS cloud build and the last runner build (its release tag).
          last=$(node tools/scripts/ci-checks/native/last-build.mjs "$eas" "$JUST_BUILT")
          if [ -z "$last" ]; then
            echo "::warning::no finished $PROFILE build found, so a native change cannot be ruled out"
            rc=1
          else
            rc=0; node tools/scripts/ci-checks/native-changes.mjs "$last" "$PROFILE" || rc=$?
          fi
          if [ "$rc" != 0 ] && [ "$FORCE" != true ]; then
            echo "::error::native change (or unknown last build): an OTA would not reach it. Build a new APK (action build-android-apk), or tick force_ota to ship anyway."
            exit 1
          fi
          if [ "$rc" != 0 ]; then echo "::warning::force_ota ticked: shipping the OTA despite the native change"; fi
      # The stripe-test app has no FCM (app.config.ts drops googleServicesFile), so it never needs the file. The
      # family app's file is its own EAS project's GOOGLE_SERVICES_JSON file variable (docs/50 §8), not this secret.
      - name: Write the Firebase file (only if the secret exists)
        if: ${{ inputs.app != 'family' && inputs.profile != 'stripe-test' }}
        env:
          GOOGLE_SERVICES_JSON_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_SECRET" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_SECRET" > "$RUNNER_TEMP/google-services.json"
            echo "GOOGLE_SERVICES_JSON=$RUNNER_TEMP/google-services.json" >> "$GITHUB_ENV"
          fi
      - name: EAS update
        working-directory: ${{ env.APP_DIR }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BRANCH: ${{ inputs.branch }}
          APP: ${{ inputs.app || 'staff' }}
          PROFILE: ${{ inputs.app == 'family' && (inputs.profile == 'production' && 'production' || 'preview') || inputs.profile || 'preview' }}
          COMMIT: ${{ github.sha }}
          # Stripe go live (owner 2026-11-01, docs/30): the normal app's OTA has the pay-link buttons too, like
          # eas.json `preview`. They show only when GET /stripe/feature says so (the API's switch and keys).
          EXPO_PUBLIC_FEATURE_STRIPE: "1"
        run: |
          if [ "$APP" = family ]; then
            # apps/family-mobile/eas.json preview or production: channel = environment = profile, no Stripe flag
            # (its env decides).
            unset EXPO_PUBLIC_FEATURE_STRIPE
            npx --yes "$EAS_CLI" update --channel "$PROFILE" --environment "$PROFILE" \
              --message "Family $PROFILE OTA from GitHub ${COMMIT:0:7}" --non-interactive
            exit 0
          fi
          if [ "$PROFILE" = stripe-test ]; then
            # The eas.json stripe-test env (Stripe UI on, the test app's config) and its own channel / environment.
            export EXPO_PUBLIC_FEATURE_STRIPE=1 APP_VARIANT=stripetest
            npx --yes "$EAS_CLI" update --channel stripe-test --environment preview \
              --message "Stripe test OTA from GitHub ${COMMIT:0:7}" --non-interactive
            exit 0
          fi
          npx --yes "$EAS_CLI" update --branch "$EAS_BRANCH" --environment "$EAS_BRANCH" \
            --message "OTA from GitHub ${COMMIT:0:7}" --non-interactive
      - name: Remove the Firebase file
        if: always()
        run: rm -f "$RUNNER_TEMP/google-services.json"

  # Release tag + GitHub Release per shipped APK / OTA (owner 2026-10-30, docs/09 «Release tags»), on the commit
  # this run built; skipped when that commit already has a tag of the family (a re-run). The only job here that may
  # write contents; no environment, no secret. A failure only warns, and continue-on-error keeps the run green
  # (deploy-baseline.mjs reads the green mobile runs).
  release:
    needs: [build, ota]
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.ota.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Tag the APK
        if: ${{ needs.build.result == 'success' && !(inputs.app == 'family' && inputs.profile == 'production') }}
        env:
          KIND: apk
          # The family APK: mobile-family-v<version>-b<run> (release-tag.mjs prefixes a non-preview profile).
          PROFILE: ${{ inputs.app == 'family' && 'family' || inputs.profile || 'preview' }}
          EAS_URL: ${{ needs.build.outputs.eas_url }}
          ARTIFACT_URL: ${{ needs.build.outputs.artifact_url }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: VERSION=$(jq -r .expo.version "$APP_DIR/app.json") node tools/scripts/ci-checks/release-tags/release-tag.mjs
      # The family Google Play bundle: aab-family-production-v<version>-b<run>, never a mobile-… APK tag.
      - name: Tag the AAB
        if: ${{ needs.build.result == 'success' && inputs.app == 'family' && inputs.profile == 'production' }}
        env:
          KIND: aab
          PROFILE: family-production
          EAS_URL: ${{ needs.build.outputs.eas_url }}
          ARTIFACT_URL: ${{ needs.build.outputs.artifact_url }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: VERSION=$(jq -r .expo.version "$APP_DIR/app.json") node tools/scripts/ci-checks/release-tags/release-tag.mjs
      - name: Tag the OTA
        if: ${{ needs.ota.result == 'success' }}
        env:
          KIND: ota
          # ota-family-preview-<day>-<n> for the family app: never the staff app's ota-preview-… family of tags.
          # The run-name's own expression: ota-family-production-… for the store OTA (lane L06).
          CHANNEL: >-
            ${{ inputs.app == 'family' && inputs.profile == 'production' && 'family-production'
            || inputs.app == 'family' && 'family-preview'
            || inputs.profile == 'stripe-test' && 'stripe-test' || inputs.branch }}
        run: node tools/scripts/ci-checks/release-tags/release-tag.mjs
