# TEMPORARY (removed before the PR is final): records mobile's existing useMemo / useCallback / memo in
# eslint-suppressions.json and refactor/guards/lint.json in CI, never on the owner's PC (docs/31a §5.1). No secrets.
name: tmp-mobile-compiler
on:
  push:
    branches: [chore/mobile-react-compiler]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - name: suppress no-restricted-syntax (mobile)
        continue-on-error: true
        run: pnpm turbo lint --filter=mobile --force -- --suppress-rule no-restricted-syntax
      - name: lint baseline
        continue-on-error: true
        run: node tools/scripts/ci-checks/lint/lint-gate.mjs --write; git diff --stat; git diff refactor/guards/lint.json
      - name: lint again (must be green)
        continue-on-error: true
        run: pnpm turbo lint --filter=mobile --force
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-compiler-baseline
          path: |
            apps/mobile/eslint-suppressions.json
            refactor/guards/lint.json
          retention-days: 3
