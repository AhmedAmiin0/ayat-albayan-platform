# TEMPORARY (removed before the PR is ready). Run 1 (40987960781) wrote pnpm-lock.yaml and compared tsc with
# tsgo per package; this run checks the committed lockfile, Oxlint, planted errors, the guards and ESLint.
name: tmp-probe
on:
  push:
    branches: [ci/fast-lint-typecheck]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - name: Oxlint
        run: |
          set +e
          time pnpm lint:ox; echo "oxlint exit $?"
          true
      - name: Build what typecheck reads
        run: pnpm turbo build --filter=@ab/shared --filter=@ab/client-core && pnpm --filter web exec tsr generate
      # The same errors from both compilers, flags included (strict, noImplicitReturns, noUncheckedIndexedAccess,
      # erasableSyntaxOnly, verbatimModuleSyntax, decorators).
      - name: tsc vs tsgo on planted errors
        run: |
          set +e
          printf '%s\n' "export const n: number = 'x';" "export function f(a: number) { if (a) return 1; }" \
            "import { Injectable } from '@nestjs/common';" "@Injectable() export class P { constructor(private readonly n: number) {} }" > apps/api/src/zz-probe.ts
          printf '%s\n' "export enum E { A }" "const xs: number[] = [];" "export const y: number = xs[0];" > apps/mobile/src/zz-probe.ts
          printf '%s\n' "import { ReactNode } from 'react';" "export type R = ReactNode;" "export const z: string = 1;" > apps/web/src/zz-probe.ts
          for d in apps/api apps/mobile apps/web; do
            a=$(cd $d && pnpm exec tsc --noEmit 2>&1 | grep -o -E 'zz-probe.ts\([0-9]+,[0-9]+\): error TS[0-9]+' | sort | tr '\n' ' ')
            b=$(cd $d && pnpm exec tsgo --noEmit 2>&1 | grep -o -E 'zz-probe.ts[:(][0-9]+[:,][0-9]+\)?: error TS[0-9]+' | sed -E 's/zz-probe.ts:([0-9]+):([0-9]+)/zz-probe.ts(\1,\2)/' | sort | tr '\n' ' ')
            echo "$d tsc : $a" | tee -a "$GITHUB_STEP_SUMMARY"; echo "$d tsgo: $b" | tee -a "$GITHUB_STEP_SUMMARY"
            [ "$a" = "$b" ] && echo "$d: SAME" | tee -a "$GITHUB_STEP_SUMMARY" || echo "$d: DIFFERENT" | tee -a "$GITHUB_STEP_SUMMARY"
            (cd $d && pnpm exec tsgo --noEmit 2>&1 | grep zz-probe | head -8)
          done
          rm apps/*/src/zz-probe.ts
          true
      - name: Guards
        run: |
          set +e
          pnpm guard:knip; echo "knip exit $?"
          pnpm guard:dup; echo "jscpd exit $?"
          pnpm guard:lint; echo "lint gate exit $?"
          true
      - name: ESLint (all packages)
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm turbo lint --concurrency=3 --continue
