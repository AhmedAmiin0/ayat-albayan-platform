name: Claude Code Review
# Owner 2026-11-13: an automatic Claude review on every pull request (installed by /install-github-app).
# THE REPO IS PUBLIC: no pull_request_target, so a fork PR gets no secret, and the job skips forks and
# drafts anyway. The only secret is the Anthropic credential; the review can only post PR comments.
# @claude on issues/PRs stays with claude-tasks (owner-only). Docs: docs/09-deployment.md «GitHub Actions».
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # v1.0.275 (the v1 tag on 2026-11-13)
      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@4d75e5f390ee76b2e09c1980ecc99ff3a2e088c8
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
