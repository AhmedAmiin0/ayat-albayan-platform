name: ci
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - name: Start local Supabase
        run: pnpm supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector
      - run: pnpm env:local
      - run: pnpm turbo lint typecheck test
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      - run: pnpm turbo e2e --filter=e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
