name: ci
on:
  push:
    branches: [main, develop]
  pull_request:
  # Run by hand from the Actions tab (e2e included).
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch or PR cancels the run it replaces.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Remote Turborepo cache: with both set, unchanged packages skip lint, typecheck and test.
# Unset (forks, no secret) = a normal uncached run, nothing breaks.
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  # Which parts changed. e2e drives apps/web against the API and database, so a change that only touches
  # the mobile app, docs, the migration tool or other scripts skips the e2e machines; a docs-only change
  # (docs/**, *.md; not docs/09, which workflows.test.mjs reads) also skips verify.
  # PRs diff against the base branch. Pushes diff against the previous commit, but only when ci passed on
  # that commit (so a run cancelled by this push never lets its changes through untested).
  # FAIL SAFE: a manual run, a new branch, an unknown previous commit, an API or git error = everything runs.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      e2e: ${{ steps.diff.outputs.e2e }}
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          full() { printf 'e2e=true\ncode=true\n' >> "$GITHUB_OUTPUT"; echo "::notice::$1: everything runs"; exit 0; }
          case "$EVENT" in
            pull_request)
              files=$(git diff --name-only "origin/$BASE_REF...HEAD") || full "diff against $BASE_REF failed" ;;
            push)
              case "$BEFORE" in ''|0000000000000000000000000000000000000000) full "no previous commit" ;; esac
              green=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$BEFORE&status=success&per_page=1" \
                | jq -r '.total_count') || full "GitHub API failed"
              [ "${green:-0}" -ge 1 ] 2>/dev/null || full "ci did not pass on ${BEFORE:0:7}"
              files=$(git diff --name-only "$BEFORE" HEAD) || full "${BEFORE:0:7} not found" ;;
            *) full "$EVENT run" ;;
          esac
          [ -n "$files" ] || full "empty diff"
          echo "$files"
          e2e=false; code=false
          # Here-strings, not pipes: with pipefail an early `grep -q` exit could make the test read false.
          if grep -qvE '^(apps/mobile/|docs/|tools/migrate/|tools/scripts/|.*\.md$)' <<< "$files" \
            || grep -qE '^tools/scripts/(e2e-shards|write-local-env)\.mjs$' <<< "$files"; then e2e=true; fi
          if grep -qvE '^docs/|\.md$' <<< "$files" || grep -qx 'docs/09-deployment.md' <<< "$files"; then code=true; fi
          printf 'e2e=%s\ncode=%s\n' "$e2e" "$code" | tee -a "$GITHUB_OUTPUT"

  # Lint, typecheck and the unit tests on parallel machines. The tests used to be one 13-minute job where
  # web (13 min), api (9.5 min) and mobile (5 min) fought over 4 CPUs; each now has its own machine(s),
  # web and api split in halves (vitest --shard). Turborepo's local cache is kept between runs, so
  # packages a change did not touch are replayed from cache instead of re-run.
  verify:
    name: verify (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: lint, task: lint, key: lint }
          - { name: typecheck, task: typecheck, key: typecheck }
          - { name: test web 1/2, task: test, key: web-1, filter: --filter=web, args: '-- --shard=1/2' }
          - { name: test web 2/2, task: test, key: web-2, filter: --filter=web, args: '-- --shard=2/2' }
          - { name: test api 1/2, task: test, key: api-1, filter: --filter=api, args: '-- --shard=1/2' }
          - { name: test api 2/2, task: test, key: api-2, filter: --filter=api, args: '-- --shard=2/2' }
          - { name: test mobile, task: test, key: mobile, filter: --filter=mobile }
          - { name: test others, task: test, key: others, filter: '--filter=!web --filter=!api --filter=!mobile' }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ matrix.key }}-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ matrix.key }}-${{ runner.os }}-
      - run: pnpm turbo ${{ matrix.task }} ${{ matrix.filter }} --cache-dir=.turbo/cache ${{ matrix.args }}

  # The required aggregate for branch protection: every verify job passed, or a docs-only change skipped
  # them all (changes said code=false). Anything else (a failed or cancelled job, a failed changes job) is red.
  check:
    needs: [changes, verify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          VERIFY: ${{ needs.verify.result }}
        run: |
          test "$CHANGES" = success
          if [ "$CODE" = false ] && [ "$VERIFY" = skipped ]; then echo "docs only: verify skipped"; exit 0; fi
          test "$VERIFY" = success

  # The e2e suite shares one database per run and runs with one worker, so it is split across machines
  # instead: each shard has its own local Supabase, API and web server (docs/04 §9). A failing shard does
  # not stop the others (fail-fast off), so one run shows every red spec.
  # Shards 1-4 split the spec files on measured durations (tools/scripts/e2e-shards.mjs, e2e/shard-durations.json;
  # refresh it from the «e2e-durations-*» artifacts of a push run). «single line» is the production
  # configuration (docs/12 §13.12): ONE WhatsApp line, no WA_CHAT_* keys (playwright.config.ts reads E2E_LINES);
  # the six §5 journeys plus the template status and settings switch specs, desktop only.
  e2e:
    name: ${{ matrix.name }}
    needs: changes
    # On again (owner, 2026-10-05) now that the suite is fast. To pause it without a code change, set the
    # repository variable RUN_E2E to 'false' (Settings → Secrets and variables → Actions → Variables).
    if: needs.changes.outputs.e2e == 'true' && vars.RUN_E2E != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: e2e (1), shard: '1' }
          - { name: e2e (2), shard: '2' }
          - { name: e2e (3), shard: '3' }
          - { name: e2e (4), shard: '4' }
          - { name: e2e (single line), shard: single }
    env:
      SHARDS: 4
      # Only what the e2e suite uses: Postgres, auth, PostgREST, storage and the gateway.
      SUPABASE_EXCLUDE: studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,postgres-meta,supavisor
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - name: Supabase CLI version
        id: sb
        run: echo "version=$(pnpm --filter @ab/db exec supabase --version | tail -1)" >> "$GITHUB_OUTPUT"
      # The Supabase Docker images (~0.9 GB gzipped), saved once per CLI version: loading them is faster
      # than pulling five images from the registry on every shard.
      - name: Restore the Supabase images
        id: sb-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/supabase-images.tar.gz
          key: supabase-images-${{ runner.os }}-${{ steps.sb.outputs.version }}-${{ hashFiles('packages/db/supabase/config.toml') }}
      # In the background: the browser and the build below get ready at the same time (was ~80 s in a row).
      - name: Start local Supabase (background)
        run: |
          nohup bash -c '
            img="$RUNNER_TEMP/supabase-images.tar.gz"
            if [ -f "$img" ]; then time (gunzip -c "$img" | docker load -q); fi
            time pnpm supabase start -x "$SUPABASE_EXCLUDE"; echo $? > "$RUNNER_TEMP/supabase.rc"
          ' > "$RUNNER_TEMP/supabase.log" 2>&1 &
      # apt's man-db trigger rebuilds the manual index after every install: minutes on hosted runners.
      - run: sudo rm -f /var/lib/man-db/auto-update
      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm --filter e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install the browser (only on a cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter e2e exec playwright install --with-deps chromium
      # install-deps ran apt-get update + install on every shard (16 s, but 8-12 min when the mirror was slow).
      # --dry-run exits non-zero when a library is missing (or apt cannot tell): only then install.
      - name: Install the browser's system libraries (cache hit, only if missing)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: |
          pnpm --filter e2e exec playwright install-deps --dry-run chromium \
            || pnpm --filter e2e exec playwright install-deps chromium
      - name: Restore the build cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-e2e-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-e2e-${{ runner.os }}-
      - name: Build what the e2e servers run
        run: pnpm turbo build --filter=e2e^... --cache-dir=.turbo/cache
      - name: Wait for local Supabase
        run: |
          for _ in $(seq 1 300); do [ -f "$RUNNER_TEMP/supabase.rc" ] && break; sleep 1; done
          cat "$RUNNER_TEMP/supabase.log"
          test "$(cat "$RUNNER_TEMP/supabase.rc" 2>/dev/null)" = 0
      - name: Save the Supabase images (once per CLI version)
        if: steps.sb-cache.outputs.cache-hit != 'true' && matrix.shard == '1'
        run: docker save $(docker images --format '{{.Repository}}:{{.Tag}}' | grep -E 'supabase/|postgrest/|kong') | gzip -1 > "$RUNNER_TEMP/supabase-images.tar.gz"
      - if: steps.sb-cache.outputs.cache-hit != 'true' && matrix.shard == '1'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/supabase-images.tar.gz
          key: ${{ steps.sb-cache.outputs.cache-primary-key }}
      - run: pnpm env:local
      # PRs run the desktop project only (half the specs); pushes to main/develop also run the phone-size
      # project, so a mobile layout regression is still caught before a release.
      - name: e2e
        env:
          CI: 'true'
          SHARD: ${{ matrix.shard }}
          EVENT: ${{ github.event_name }}
          E2E_LINES: ${{ matrix.shard == 'single' && 'single' || '' }}
          E2E_DURATIONS_FILE: ${{ matrix.shard != 'single' && format('{0}/e2e-durations.json', runner.temp) || '' }}
        run: |
          if [ "$SHARD" = single ]; then
            args="--project=desktop"
            files="tests/journey-1-lead-to-trial.spec.ts tests/journey-2-report.spec.ts
              tests/journey-3-payment-renewal.spec.ts tests/journey-4-reschedule-conflict.spec.ts
              tests/journey-5-availability-wizard.spec.ts tests/journey-6-duplicate-student.spec.ts
              tests/inbox-template-status.spec.ts tests/settings-switches.spec.ts"
          else
            if [ "$EVENT" = pull_request ]; then mode=desktop; args="--project=desktop"; else mode=all; args=""; fi
            files=$(node tools/scripts/e2e-shards.mjs plan "$SHARD" "$SHARDS" "$mode")
          fi
          pnpm turbo e2e --filter=e2e --cache-dir=.turbo/cache -- $args $files
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ${{ matrix.shard == 'single' && 'playwright-report-single-line' || format('playwright-report-shard-{0}', matrix.shard) }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
      # Per-file durations of this shard, to refresh e2e/shard-durations.json (tools/scripts/e2e-shards.mjs merge).
      - uses: actions/upload-artifact@v4
        if: always() && matrix.shard != 'single'
        with:
          name: e2e-durations-${{ github.event_name }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/e2e-durations.json
          if-no-files-found: ignore
          retention-days: 14
      # Journey 7's screenshots and the assistant's video for the owner, on every run (fake data only). Only the shard that ran the
      # spec has them; the others upload nothing.
      - uses: actions/upload-artifact@v4
        if: always() && matrix.shard != 'single'
        with:
          name: assistant-journey-screens
          path: |
            e2e/test-results/**/journey-7-*/**/*.png
            e2e/test-results/**/journey-7-*/**/*.webm
          if-no-files-found: ignore
          retention-days: 7
