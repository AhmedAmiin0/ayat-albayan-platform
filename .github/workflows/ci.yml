name: ci
on:
  push:
    branches: [main, develop]
  pull_request:
  # Run by hand from the Actions tab (e2e included).
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR cancels the run it replaces. On develop/main a running run always finishes
# (its success starts deploy-staging): newer pushes queue behind it, and only the newest queued one runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which parts changed. e2e drives apps/web against the API and database, so a change that only touches
  # the mobile app, docs, the migration tool or other scripts skips the e2e machines; a docs-only change
  # (docs/**, *.md; not docs/09, which workflows.test.mjs reads, nor the linted docs/design/brand/tools) also
  # skips verify.
  # PRs diff against the base branch. Pushes diff against the previous commit, but only when ci passed on
  # that commit (so a run cancelled by this push never lets its changes through untested).
  # FAIL SAFE: a manual run, a new branch, an unknown previous commit, an API or git error = everything runs.
  # On a PR, step «e2e specs» also picks the e2e specs the change can reach (e2e/areas.json, through the
  # import graph: tools/scripts/ci-checks/e2e-areas/select.mjs) and how many shards they need; anything it
  # does not understand, and every push, = the full suite on 8 shards.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      e2e: ${{ steps.move.outputs.e2e || steps.diff.outputs.e2e }}
      code: ${{ steps.diff.outputs.code }}
      e2e_matrix: ${{ steps.e2e.outputs.e2e_matrix }}
      e2e_specs: ${{ steps.e2e.outputs.e2e_specs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          full() { printf 'e2e=true\ncode=true\n' >> "$GITHUB_OUTPUT"; echo "::notice::$1: everything runs"; exit 0; }
          case "$EVENT" in
            pull_request)
              files=$(git diff --name-only "origin/$BASE_REF...HEAD") || full "diff against $BASE_REF failed" ;;
            push)
              case "$BEFORE" in ''|0000000000000000000000000000000000000000) full "no previous commit" ;; esac
              green=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$BEFORE&status=success&per_page=1" \
                | jq -r '.total_count') || full "GitHub API failed"
              [ "${green:-0}" -ge 1 ] 2>/dev/null || full "ci did not pass on ${BEFORE:0:7}"
              files=$(git diff --name-only "$BEFORE" HEAD) || full "${BEFORE:0:7} not found" ;;
            *) full "$EVENT run" ;;
          esac
          [ -n "$files" ] || full "empty diff"
          echo "$files"
          e2e=false; code=false
          # Here-strings, not pipes: with pipefail an early `grep -q` exit could make the test read false.
          if grep -qvE '^(apps/mobile/|docs/|tools/migrate/|tools/scripts/|.*\.md$)' <<< "$files" \
            || grep -qE '^tools/scripts/(ci-checks/e2e-shards|env/write-local-env)\.mjs$' <<< "$files"; then e2e=true; fi
          if grep -qvE '^docs/|\.md$' <<< "$files" || grep -qx 'docs/09-deployment.md' <<< "$files" \
            || grep -q '^docs/design/brand/tools/' <<< "$files"; then code=true; fi
          printf 'e2e=%s\ncode=%s\n' "$e2e" "$code" | tee -a "$GITHUB_OUTPUT"
      - if: github.event_name == 'pull_request' && steps.diff.outputs.e2e == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # A proven pure move (docs/32 g1): plain folder moves only (move-e2e.mjs: a move map in the diff, no
      # identifier or file-name renames, no route moves, nothing e2e reads at start-up) and pure-move-check green.
      # Typecheck and the unit tests still run; e2e is skipped. FAIL SAFE: anything else = e2e as usual.
      - name: move PR
        id: move
        if: github.event_name == 'pull_request' && steps.diff.outputs.e2e == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --name-status -M50% "origin/$BASE_REF...HEAD" | node tools/scripts/ci-checks/pure-move/move-e2e.mjs \
            && node tools/scripts/ci-checks/pure-move-check.mjs "origin/$BASE_REF" HEAD; then
            echo "e2e=false" | tee -a "$GITHUB_OUTPUT"; echo "::notice::pure folder move: e2e skipped"
          fi
      # PRs only. Any failure leaves the selection out: plan.mjs (or the e2e job's fallback) = full suite.
      - name: e2e specs
        id: e2e
        if: github.event_name == 'pull_request' && steps.diff.outputs.e2e == 'true' && steps.move.outputs.e2e != 'false'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          sel="$RUNNER_TEMP/e2e-selection.json"
          { base=$(git merge-base "origin/$BASE_REF" HEAD) \
            && git diff --name-only "$base" HEAD | node tools/scripts/ci-checks/e2e-areas/select.mjs "$base"; } > "$sel" \
            || echo '{"full":true,"reason":"selection step failed"}' > "$sel"
          jq -r '"::notice::e2e: " + (if .full then "full suite (" + .reason + ")" else .reason end)' "$sel" || true
          node tools/scripts/ci-checks/e2e-areas/plan.mjs "$sel" | tee -a "$GITHUB_OUTPUT" || true

  # Lint, typecheck and the unit tests on parallel machines. The tests used to be one 13-minute job where
  # web (13 min), api (9.5 min) and mobile (5 min) fought over 4 CPUs; each now has its own machine(s),
  # web and api split in halves (vitest --shard). Turborepo's remote cache lives in the GitHub Actions cache
  # (rharkor/caching-for-turbo: a local cache server, one cache entry per task hash, no token or outside service),
  # shared by every job and run, so a task a change did not touch is replayed instead of re-run.
  # Lint: Oxlint first (seconds, the rules of .oxlintrc.json), then ESLint for the type-aware, custom and
  # react-hooks rules. Typecheck: tsgo (TypeScript 7, @typescript/native-preview); e2e lints and typechecks
  # against @ab/shared only (e2e/turbo.json), so neither job builds api or web.
  verify:
    name: verify (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Type-aware lint (docs/31a): more heap, fewer packages at once.
          - { name: lint, task: lint, opts: --concurrency=3, heap: --max-old-space-size=6144 }
          - { name: typecheck, task: typecheck }
          - { name: test web 1/2, task: test, filter: --filter=web, args: '-- --shard=1/2' }
          - { name: test web 2/2, task: test, filter: --filter=web, args: '-- --shard=2/2' }
          - { name: test api 1/2, task: test, filter: --filter=api, args: '-- --shard=1/2' }
          - { name: test api 2/2, task: test, filter: --filter=api, args: '-- --shard=2/2' }
          - { name: test mobile, task: test, filter: --filter=mobile }
          - { name: test others, task: test, filter: '--filter=!web --filter=!api --filter=!mobile' }
          # Metro bundle of the mobile app (docs/32 x0, critic correction 11): the same Babel config as an OTA, so
          # React Compiler output, Metro resolution errors and barrel require cycles fail here, not after `eas update`.
          - { name: bundle mobile, task: bundle, filter: --filter=mobile }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - name: Oxlint
        if: matrix.task == 'lint'
        run: pnpm lint:ox --format github
      - name: Turbo cache (GitHub Actions cache)
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2
      - id: turbo
        run: pnpm turbo ${{ matrix.task }} ${{ matrix.filter }} ${{ matrix.opts }} --cache-dir=.turbo/cache ${{ matrix.args }}
        env:
          NODE_OPTIONS: ${{ matrix.heap }}
      # ESLint fails on a suppression that no longer occurs (a fixed long line, a split function). On a red lint
      # the log shows the pruned eslint-suppressions.json to commit (or run `pnpm lint:prune` and
      # `pnpm guard:lint -- --write` locally, docs/31a §5).
      - name: Suppressions to prune (commit this diff)
        if: failure() && steps.turbo.outcome == 'failure' && matrix.task == 'lint'
        env:
          NODE_OPTIONS: ${{ matrix.heap }}
        run: |
          pnpm lint:prune > /dev/null 2>&1 || true
          git --no-pager diff -- '*eslint-suppressions.json'

  # Refactor guards (docs/27 §4). Folder cap: an error since Wave F (a new crowded folder, an allow-listed one
  # that grew, a stale allow-list entry). Pure-move check: for move PRs (refactor/* and cloud/refactor-* heads
  # of any lane, and any PR whose diff adds or changes refactor/moves/*.json, whatever its branch name); it fails
  # on any hunk that is not a rename, a module path, a listed identifier rename, a new index.ts barrel, config
  # that only follows moved paths or a baseline entry that follows its moved file. No install, no secrets.
  refactor:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node tools/scripts/ci-checks/folder-cap.mjs --strict
      - name: Pure-move check
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          MAPS=$(git diff --name-only --diff-filter=AMR "origin/$BASE_REF...HEAD" -- 'refactor/moves/*.json')
          case "$HEAD_REF" in refactor/*|cloud/refactor-*) MAPS="${MAPS:-$HEAD_REF}" ;; esac
          if [ -n "$MAPS" ]; then node tools/scripts/ci-checks/pure-move-check.mjs "origin/$BASE_REF" HEAD
          else echo "not a move PR ($HEAD_REF): skipped"; fi

  # Code-health gates (docs/27 Wave F), against baselines in refactor/guards/ that only shrink: jscpd (no
  # more clones, duplicated lines or cross-app clones), knip (no new unused file, export, type or
  # dependency) and lint (docs/31a §5.1: per-rule totals of every eslint-suppressions.json; the lint job fails on a
  # new violation, this gate on a count raised by hand, a stale baseline or an entry whose file is gone; on a PR no
  # total may rise above the base branch's lint.json either, so rewriting both files cannot pass). The e2e area
  # guard: every e2e spec is in e2e/areas.json or its developOnly list (none can silently never run on a PR). No secrets.
  guards:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: pnpm guard:dup
      - run: pnpm guard:knip
      - run: pnpm guard:queries
      - run: pnpm guard:cycles
      # A base without lint.json (before the ratchet) has nothing to compare with; a git error fails the step.
      - name: pnpm guard:lint (on a PR, also against the base branch)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then pnpm guard:lint; exit; fi
          base=$(git merge-base "origin/$BASE_REF" HEAD)
          if ! git cat-file -e "$base:refactor/guards/lint.json" 2>/dev/null; then
            echo "::notice::no lint.json on $BASE_REF: in-tree check only"; pnpm guard:lint; exit
          fi
          git show "$base:refactor/guards/lint.json" > "$RUNNER_TEMP/lint-base.json"
          # The ESLint config sources of both sides: a rule only the head names gets its one-time baseline.
          configs() {
            git ls-tree -r --name-only "$1" | grep -E '(^packages/config/[^/]+|(^|/)eslint\.config)\.[cm]?js$' \
              | grep -v '\.test\.' | while read -r f; do git show "$1:$f"; done
          }
          configs "$base" > "$RUNNER_TEMP/configs-base.txt"
          configs HEAD > "$RUNNER_TEMP/configs-head.txt"
          pnpm guard:lint -- --base "$RUNNER_TEMP/lint-base.json" \
            --configs "$RUNNER_TEMP/configs-base.txt" "$RUNNER_TEMP/configs-head.txt"
      - run: node tools/scripts/ci-checks/e2e-areas/guard.mjs

  # The required aggregate for branch protection: every verify job and the guards passed, or a docs-only change
  # skipped them all (changes said code=false); on a PR the refactor job (folder cap, pure moves) passed too.
  # Anything else (a failed or cancelled job, a failed changes job) is red.
  check:
    needs: [changes, verify, guards, refactor]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          VERIFY: ${{ needs.verify.result }}
          GUARDS: ${{ needs.guards.result }}
          REFACTOR: ${{ needs.refactor.result }}
        run: |
          test "$CHANGES" = success
          test "$REFACTOR" = success || { [ "$GITHUB_EVENT_NAME" != pull_request ] && [ "$REFACTOR" = skipped ]; }
          if [ "$CODE" = false ] && [ "$VERIFY" = skipped ] && [ "$GUARDS" = skipped ]; then echo "docs only: verify skipped"; exit 0; fi
          test "$VERIFY" = success
          test "$GUARDS" = success

  # The e2e suite shares one database per run and runs with one worker, so it is split across machines
  # instead: each shard has its own local Supabase, API and web server (docs/04 §9). A failing shard does
  # not stop the others (fail-fast off), so one run shows every red spec.
  # A PR runs only the specs its change can reach (job «changes», e2e/areas.json) on 1-8 shards; pushes to
  # develop/main run every spec on both projects, the safety net for anything a PR selection missed.
  # Shards 1-8 are Playwright's own --shard, sized on measured durations (step «Shard sizes»; refresh
  # e2e/shard-durations.json from the «e2e-durations-*» artifacts of a push run). «single line» is the production
  # configuration (docs/12 §13.12): ONE WhatsApp line, no WA_CHAT_* keys (playwright.config.ts reads E2E_LINES);
  # the six §5 journeys plus the template status and settings switch specs, desktop only. Named by file
  # name alone: Playwright matches them as path patterns, so they keep working inside e2e/tests/<domain>/.
  e2e:
    name: ${{ matrix.name }}
    needs: changes
    # On again (owner, 2026-10-05) now that the suite is fast. To pause it without a code change, set the
    # repository variable RUN_E2E to 'false' (Settings → Secrets and variables → Actions → Variables).
    if: needs.changes.outputs.e2e == 'true' && vars.RUN_E2E != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The matrix comes from «changes» (plan.mjs): on a PR only the shards its selected specs need, plus
    # «single line» (the smoke set) always; the fallback below is the full matrix (pushes, any failure).
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.e2e_matrix || '{"include":[{"name":"e2e (1)","shard":"1","total":8},{"name":"e2e (2)","shard":"2","total":8},{"name":"e2e (3)","shard":"3","total":8},{"name":"e2e (4)","shard":"4","total":8},{"name":"e2e (5)","shard":"5","total":8},{"name":"e2e (6)","shard":"6","total":8},{"name":"e2e (7)","shard":"7","total":8},{"name":"e2e (8)","shard":"8","total":8},{"name":"e2e (single line)","shard":"single","total":8}]}') }}
    env:
      SHARDS: ${{ matrix.total }}
      # The PR's selected spec files (empty = all of them).
      SPECS: ${{ needs.changes.outputs.e2e_specs }}
      # Only what the e2e suite uses: Postgres, auth, PostgREST, storage and the gateway.
      SUPABASE_EXCLUDE: studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,postgres-meta,supavisor
      # The CLI pulls from public.ecr.aws by default, which answered every pull with «toomanyrequests: Data
      # limit exceeded» and two retries (4 s + 8 s) before the image came (2026-10-27): same images, Docker Hub.
      SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
    steps:
      # Supabase's host ports (54321 API, 54322 db, … 54329) sit inside Linux's ephemeral range: an outgoing
      # socket took 54322 first ("address already in use"), twice on 2026-10-25 even with the ports reserved
      # just before the start, so they are reserved first thing, before checkout and pnpm open any socket.
      - run: sudo sysctl -qw net.ipv4.ip_local_reserved_ports=54320-54329
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      # In the background: the browser and the build below get ready at the same time (was ~80 s in a row).
      # Measured 2026-10-23: caching the images (docker save/load, 0.9 GB) was SLOWER than pulling them
      # (load 70 s + start 30 s against ~80 s for pull + start), so the images are pulled.
      # One retry if the start fails; the log first lists the sockets on 54320-54329 (who held the port).
      - name: Start local Supabase (background)
        run: |
          nohup bash -c 'up() { pnpm supabase start -x "$SUPABASE_EXCLUDE"; }
            time up || { sudo ss -tanp | grep -E ":5432[0-9] " || true; pnpm supabase stop --no-backup; up; }
            echo $? > "$RUNNER_TEMP/supabase.rc"' > "$RUNNER_TEMP/supabase.log" 2>&1 &
      # apt's man-db trigger rebuilds the manual index after every install (skipped with this file gone).
      - run: sudo rm -f /var/lib/man-db/auto-update
      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm --filter e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install the browser (only on a cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter e2e exec playwright install chromium
      # The browser's system libraries: only fonts are missing on the hosted image, but apt fetched them from
      # the Azure mirror at times at 34 kB/s (12 min for 25 MB). The .deb files are cached per runner image
      # and Playwright version and installed with dpkg, offline; apt only runs when they do not cover it.
      - name: Runner image
        id: img
        run: echo "id=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Restore the browser's system packages
        id: deb-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/pw-debs
          key: pw-debs-${{ steps.img.outputs.id }}-${{ steps.pw.outputs.version }}
      - name: Install the browser's system libraries (only if missing)
        id: deps
        run: |
          pw() { pnpm --filter e2e exec playwright "$@"; }
          debs="$RUNNER_TEMP/pw-debs"
          if pw install-deps --dry-run chromium; then exit 0; fi
          if ls "$debs"/*.deb >/dev/null 2>&1; then
            if sudo dpkg -i "$debs"/*.deb >/dev/null && pw install-deps --dry-run chromium; then exit 0; fi
            echo "::warning::the cached packages did not cover everything: installing from apt"
          fi
          pw install-deps chromium
          mkdir -p "$debs" && cp /var/cache/apt/archives/*.deb "$debs"/ 2>/dev/null \
            && echo "save=true" >> "$GITHUB_OUTPUT" || true
      - if: steps.deps.outputs.save == 'true' && steps.deb-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/pw-debs
          key: ${{ steps.deb-cache.outputs.cache-primary-key }}
      - name: Turbo cache (GitHub Actions cache, shared with verify)
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2
      - name: Build what the e2e servers run
        run: pnpm turbo build --filter=e2e^... --cache-dir=.turbo/cache
      - name: Wait for local Supabase
        run: |
          for _ in $(seq 1 300); do [ -f "$RUNNER_TEMP/supabase.rc" ] && break; sleep 1; done
          cat "$RUNNER_TEMP/supabase.log"
          test "$(cat "$RUNNER_TEMP/supabase.rc" 2>/dev/null)" = 0
      - run: pnpm env:local
      # Shard sizes from the measured durations (tools/scripts/ci-checks/e2e-shards.mjs, e2e/shard-durations.json): the
      # shards keep Playwright's own order and contiguous cuts, only the cut points move. FAIL SAFE: any error
      # leaves the value empty and Playwright splits by equal test counts, as before. Every test still runs:
      # Playwright itself assigns every group to exactly one shard whatever the sizes.
      - name: Shard sizes
        id: weights
        if: matrix.shard != 'single'
        env:
          PROJECT: ${{ github.event_name == 'pull_request' && '--project=desktop' || '' }}
          E2E_GROUPS_FILE: ${{ runner.temp }}/groups.json
        run: |
          if pnpm --filter e2e exec playwright test --list --reporter=./support/durations-reporter.ts $PROJECT $SPECS >/dev/null \
            && w=$(node tools/scripts/ci-checks/e2e-shards.mjs weights "$SHARDS" "$RUNNER_TEMP/groups.json") \
            && [[ "$w" =~ ^[0-9]+(:[0-9]+)*$ ]]; then
            echo "weights=$w" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::shard sizes unknown: equal test counts per shard"
          fi
      # PRs run the desktop project only (half the specs); pushes to main/develop also run the phone-size
      # project, so a mobile layout regression is still caught before a release.
      - name: e2e
        env:
          CI: 'true'
          SHARD: ${{ matrix.shard }}
          PROJECT: ${{ github.event_name == 'pull_request' && '--project=desktop' || '' }}
          PWTEST_SHARD_WEIGHTS: ${{ steps.weights.outputs.weights }}
          E2E_LINES: ${{ matrix.shard == 'single' && 'single' || '' }}
          E2E_DURATIONS_FILE: ${{ matrix.shard != 'single' && format('{0}/e2e-durations.json', runner.temp) || '' }}
        run: |
          if [ "$SHARD" = single ]; then
            pnpm turbo e2e --filter=e2e --cache-dir=.turbo/cache -- --project=desktop \
              journey-1-lead-to-trial.spec.ts journey-2-report.spec.ts \
              journey-3-payment-renewal.spec.ts journey-4-reschedule-conflict.spec.ts \
              journey-5-availability-wizard.spec.ts journey-6-duplicate-student.spec.ts \
              inbox-template-status.spec.ts settings-switches.spec.ts
          else
            pnpm turbo e2e --filter=e2e --cache-dir=.turbo/cache -- --shard="$SHARD/$SHARDS" $PROJECT $SPECS
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ${{ matrix.shard == 'single' && 'playwright-report-single-line' || format('playwright-report-shard-{0}', matrix.shard) }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
      # Per-file durations of this shard, to refresh e2e/shard-durations.json (tools/scripts/ci-checks/e2e-shards.mjs merge).
      - uses: actions/upload-artifact@v4
        if: always() && matrix.shard != 'single'
        with:
          name: e2e-durations-${{ github.event_name }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/e2e-durations.json
          if-no-files-found: ignore
          retention-days: 14
      # Journey 7's screenshots and the assistant's video for the owner, on every run (fake data only). Only the shard that ran the
      # spec has them; the others upload nothing.
      - uses: actions/upload-artifact@v4
        if: always() && matrix.shard != 'single'
        with:
          name: assistant-journey-screens
          path: |
            e2e/test-results/**/journey-7-*/**/*.png
