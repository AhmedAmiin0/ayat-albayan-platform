name: ci
on:
  push:
    branches: [main, develop]
  pull_request:
  # Run by hand from the Actions tab (e2e included).
  workflow_dispatch:

# A new push to the same branch or PR cancels the run it replaces.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Remote Turborepo cache: with both set, unchanged packages skip lint, typecheck and test.
# Unset (forks, no secret) = a normal uncached run, nothing breaks.
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  # Which parts changed: e2e drives apps/web against the API and database, so a PR that only touches the
  # mobile app, docs or the migration tool skips the four e2e machines. Pushes to main/develop always run them.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      e2e: ${{ steps.diff.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "e2e=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "$files"
          if echo "$files" | grep -qvE '^(apps/mobile/|docs/|tools/migrate/|tools/scripts/|.*\.md$)'; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          fi

  # Lint, typecheck and unit tests need no database: they run alongside the e2e shards, not before them.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: pnpm turbo lint typecheck test

  # The e2e suite shares one database per run and runs with one worker, so it is split across machines
  # instead: each shard has its own local Supabase, API and web server (docs/04 §9). A failing shard does
  # not stop the others (fail-fast off), so one run shows every red spec.
  e2e:
    needs: changes
    # e2e is paused (owner's call): it runs only when started by hand, or once the repository variable
    # RUN_E2E is set to 'true' (Settings → Secrets and variables → Actions → Variables). No code change needed.
    if: needs.changes.outputs.e2e == 'true' && (github.event_name == 'workflow_dispatch' || vars.RUN_E2E == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - name: Start local Supabase
        # Only what the e2e suite uses: Postgres, auth, PostgREST, storage and the gateway.
        run: pnpm supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,postgres-meta,supavisor
      - run: pnpm env:local
      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm --filter e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install the browser (only on a cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter e2e exec playwright install --with-deps chromium
      - name: Install the browser's system libraries (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter e2e exec playwright install-deps chromium
      # PRs run the desktop project only (half the specs); pushes to main/develop also run the phone-size
      # project, so a mobile layout regression is still caught before a release.
      - run: pnpm turbo e2e --filter=e2e -- --shard=${{ matrix.shard }}/4 ${{ github.event_name == 'pull_request' && '--project=desktop' || '' }}
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
