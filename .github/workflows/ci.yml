name: ci
on:
  push:
    branches: [main, develop]
    # The «baselines» job's own commit (it touches only these lists) never starts a run.
    paths-ignore: ['refactor/guards/**']
  # ready_for_review on top of the default types: a draft PR runs everything but e2e (job «e2e» below); marking
  # it ready starts the full run. A ready PR runs exactly what it ran before.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Run by hand from the Actions tab (e2e included).
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR cancels the run it replaces. On develop/main a running run always finishes
# (its success starts deploy-staging): newer pushes queue behind it, and only the newest queued one runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which parts changed. e2e drives both web apps (apps/staff-web, apps/family-web) against the API and database, so a change that only
  # touches the mobile apps (apps/staff-mobile, apps/family-mobile and their shared packages/mobile-kit,
  # which apps/staff-web never imports), docs, the migration tool or other scripts skips the e2e machines; a docs-only change
  # (docs/**, *.md; not docs/09, which workflows.test.mjs reads, nor the linted docs/design/brand/tools) also
  # skips verify.
  # PRs diff against the base branch. Pushes diff against the previous commit, but only when ci passed on
  # that commit (so a run cancelled by this push never lets its changes through untested).
  # FAIL SAFE: a manual run, a new branch, an unknown previous commit, an API or git error = everything runs.
  # On a PR, step «e2e specs» also picks the e2e specs the change can reach (e2e/areas.json, through the
  # import graph: tools/scripts/ci-checks/e2e-areas/select.mjs) and how many shards they need; anything it
  # does not understand, and every push, = the full suite on 10 shards.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      e2e: ${{ steps.move.outputs.e2e || steps.diff.outputs.e2e }}
      image: ${{ steps.diff.outputs.image }}
      code: ${{ steps.diff.outputs.code }}
      e2e_matrix: ${{ steps.e2e.outputs.e2e_matrix }}
      e2e_specs: ${{ steps.e2e.outputs.e2e_specs }}
      tree: ${{ steps.diff.outputs.tree }}
      verified: ${{ steps.verified.outputs.verified }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The checked-out tree (on a PR: the merge commit's), the key of the «verified» skip below.
          echo "tree=$(git rev-parse 'HEAD^{tree}')" | tee -a "$GITHUB_OUTPUT"
          full() { printf 'e2e=true\ncode=true\nimage=true\n' >> "$GITHUB_OUTPUT"; echo "::notice::$1: everything runs"; exit 0; }
          case "$EVENT" in
            pull_request)
              files=$(git diff --name-only "origin/$BASE_REF...HEAD") || full "diff against $BASE_REF failed" ;;
            push)
              case "$BEFORE" in ''|0000000000000000000000000000000000000000) full "no previous commit" ;; esac
              green=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$BEFORE&status=success&per_page=1" \
                | jq -r '.total_count') || full "GitHub API failed"
              [ "${green:-0}" -ge 1 ] 2>/dev/null || full "ci did not pass on ${BEFORE:0:7}"
              files=$(git diff --name-only "$BEFORE" HEAD) || full "${BEFORE:0:7} not found" ;;
            *) full "$EVENT run" ;;
          esac
          [ -n "$files" ] || full "empty diff"
          echo "$files"
          e2e=false; code=false
          # Here-strings, not pipes: with pipefail an early `grep -q` exit could make the test read false.
          if grep -qvE '^(apps/(staff-mobile|family-mobile)/|packages/mobile-kit/|docs/|tools/migrate/|tools/scripts/|.*\.md$)' <<< "$files" \
            || grep -qE '^tools/scripts/(ci-checks/e2e-shards|env/write-local-env)\.mjs$' <<< "$files"; then e2e=true; fi
          if grep -qvE '^docs/|\.md$' <<< "$files" || grep -qx 'docs/09-deployment.md' <<< "$files" \
            || grep -q '^docs/design/brand/tools/' <<< "$files"; then code=true; fi
          # Job «image»: what apps/api/Dockerfile reads to install (the lockfile, the workspace manifests, .npmrc,
          # patches/), the Dockerfile and .dockerignore themselves, and deploy/ (the compose files that run it).
          IMAGE_PATHS='^(apps/api/Dockerfile|\.dockerignore|\.npmrc|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|(apps|packages|tools)/[^/]+/package\.json|e2e/package\.json|docs/design/brand/tools/package\.json|patches/.+|deploy/.+)$'
          image=false
          if grep -qE "$IMAGE_PATHS" <<< "$files"; then image=true; fi
          printf 'e2e=%s\ncode=%s\nimage=%s\n' "$e2e" "$code" "$image" | tee -a "$GITHUB_OUTPUT"
      - if: github.event_name == 'pull_request' && steps.diff.outputs.e2e == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Develop pushes: a tree that a green PR run already put through verify and guards (job «check» uploaded
      # ci-green-tree-<tree>) skips them here; e2e still runs in full. Only a run of this repository counts (no
      # fork), and a push that changes a cache key file (lockfile, vitest/tsconfig) runs everything, so develop
      # keeps writing the default-branch caches. Off with the repository variable VERIFIED_TREE_SKIP = 'false'.
      # FAIL SAFE: no previous commit, an install, API or parse error = verified unset = everything runs.
      - name: May develop skip verify and guards?
        id: skip
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/develop' && steps.diff.outputs.code == 'true'
          && vars.VERIFIED_TREE_SKIP != 'false'
        run: echo "try=true" >> "$GITHUB_OUTPUT"
      - if: steps.skip.outputs.try == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.skip.outputs.try == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - if: steps.skip.outputs.try == 'true'
        uses: ./.github/actions/pnpm-store
      - name: Same tree verified on a PR?
        id: verified
        if: steps.skip.outputs.try == 'true'
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
          TREE: ${{ steps.diff.outputs.tree }}
          GH_TOKEN: ${{ github.token }}
        run: |
          pnpm i --frozen-lockfile --filter @ab/scripts > /dev/null
          files=$(git diff --name-only "$BEFORE" HEAD)
          node tools/scripts/ci-checks/ci-skip/verified-tree.mjs "$TREE" <<< "$files"
      # A proven pure move (docs/32 g1): plain folder moves only (move-e2e.mjs: a move map in the diff, no
      # identifier or file-name renames, no route moves, nothing e2e reads at start-up) and pure-move-check green.
      # Typecheck and the unit tests still run; e2e is skipped. FAIL SAFE: anything else = e2e as usual.
      # A comment-only branch (chore/comments-*) skips e2e too: guard:comments fails the required «guards»
      # job unless the code is unchanged, so nothing e2e could catch can reach develop through it.
      - name: move or comment-only PR
        id: move
        if: github.event_name == 'pull_request' && steps.diff.outputs.e2e == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD_REF" == chore/comments-* ]]; then
            echo "e2e=false" | tee -a "$GITHUB_OUTPUT"; echo "::notice::comment-only branch: e2e skipped"
            exit 0
          fi
          if git diff --name-status -M50% "origin/$BASE_REF...HEAD" | node tools/scripts/ci-checks/pure-move/move-e2e.mjs \
            && node tools/scripts/ci-checks/pure-move-check.mjs "origin/$BASE_REF" HEAD; then
            echo "e2e=false" | tee -a "$GITHUB_OUTPUT"; echo "::notice::pure folder move: e2e skipped"
          fi
      # PRs only. Any failure leaves the selection out: plan.mjs (or the e2e job's fallback) = full suite.
      - name: e2e specs
        id: e2e
        if: github.event_name == 'pull_request' && steps.diff.outputs.e2e == 'true' && steps.move.outputs.e2e != 'false'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          sel="$RUNNER_TEMP/e2e-selection.json"
          { base=$(git merge-base "origin/$BASE_REF" HEAD) \
            && git diff --name-only "$base" HEAD | node tools/scripts/ci-checks/e2e-areas/select.mjs "$base"; } > "$sel" \
            || echo '{"full":true,"reason":"selection step failed"}' > "$sel"
          jq -r '"::notice::e2e: " + (if .full then "full suite (" + .reason + ")" else .reason end)' "$sel" || true
          node tools/scripts/ci-checks/e2e-areas/plan.mjs "$sel" | tee -a "$GITHUB_OUTPUT" || true

  # Lint, typecheck and the unit tests on parallel machines. The tests used to be one 13-minute job where
  # web (13 min), api (9.5 min) and mobile (5 min) fought over 4 CPUs; each now has its own machine(s),
  # web and api in quarters (vitest --shard). Vitest's persistent transform cache (fsModuleCache:
  # <repo>/node_modules/.vitest-cache) is restored per shard (`vcache`): vitest keys every entry by the module's
  # path, its content, the config files' content and its own version, and empties the folder when pnpm-lock.yaml
  # changes; it holds transformed code only, never a test result, so every test still runs. Turborepo's remote
  # cache lives in the GitHub Actions cache
  # (rharkor/caching-for-turbo: a local cache server, one cache entry per task hash, no token or outside service),
  # shared by every job and run, so a task a change did not touch is replayed instead of re-run.
  # Lint: Oxlint first (seconds, the rules of .oxlintrc.json), then ESLint for the type-aware, custom and
  # react-hooks rules. Typecheck: tsgo (TypeScript 7, @typescript/native-preview); e2e lints and typechecks
  # against @ab/shared only (e2e/turbo.json), so neither job builds api or web.
  verify:
    name: verify (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.verified != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Type-aware lint (docs/31a): more heap, fewer packages at once. Every package is linted (--continue)
          # and saves its findings, bulk-suppressed ones included (eslint-findings.mjs, a turbo output), so the
          # Oxlint parity steps below compare against this ESLint run instead of running ESLint a second time.
          # Two rows (11-18): api alone took 7.5 of the 13 min, so it has its own machine and lints on two
          # threads (ESLint --concurrency=2: the same findings, half the time; 4 threads run out of memory).
          # `scope` (LINT_SCOPE) gives each row's Oxlint, its baselines and the parity the same packages:
          # `apps/api` and `!apps/api` are complementary (ci-lint-row.test.mjs), so every package is still
          # held to ESLint, Oxlint's baselines and the parity, exactly once.
          - name: lint + parity (oxlint)
            task: lint
            filter: --filter=!api
            scope: '!apps/api'
            opts: --concurrency=3 --continue --log-prefix=task
            heap: --max-old-space-size=6144
            args: '-- -f "$GITHUB_WORKSPACE/tools/scripts/ci-checks/lint/parity/eslint-findings.mjs"'
          - name: lint + parity (oxlint api)
            task: lint
            filter: --filter=api
            scope: apps/api
            opts: --continue --log-prefix=task
            heap: --max-old-space-size=6144
            args: '-- -f "$GITHUB_WORKSPACE/tools/scripts/ci-checks/lint/parity/eslint-findings.mjs" --concurrency=2'
          # Every typecheck and both Metro bundles (only the two Expo apps have a bundle task) in one turbo graph;
          # a red row's log names the failing task. Metro bundle of each mobile app (docs/32 x0, critic correction
          # 11): the same Babel config as an OTA, so React Compiler output, Metro resolution errors and barrel
          # require cycles fail here, not after `eas update`.
          - { name: typecheck + bundles, task: typecheck bundle }
          - { name: test web 1/4, task: test, filter: --filter=staff-web, args: '-- --shard=1/4', vcache: web-1-4 }
          - { name: test web 2/4, task: test, filter: --filter=staff-web, args: '-- --shard=2/4', vcache: web-2-4 }
          - { name: test web 3/4, task: test, filter: --filter=staff-web, args: '-- --shard=3/4', vcache: web-3-4 }
          - { name: test web 4/4, task: test, filter: --filter=staff-web, args: '-- --shard=4/4', vcache: web-4-4 }
          # api in quarters (11-18): each third took 7-9.5 min, 92 % of it module import (vitest's own summary),
          # with equal file counts and a different slowest third on every run, so no rebalancing helps.
          - { name: test api 1/4, task: test, filter: --filter=api, args: '-- --shard=1/4', vcache: api-1-4 }
          - { name: test api 2/4, task: test, filter: --filter=api, args: '-- --shard=2/4', vcache: api-2-4 }
          - { name: test api 3/4, task: test, filter: --filter=api, args: '-- --shard=3/4', vcache: api-3-4 }
          - { name: test api 4/4, task: test, filter: --filter=api, args: '-- --shard=4/4', vcache: api-4-4 }
          # jest-expo by file path (--shard), its transform cache kept like vitest's (`jcache`).
          - { name: test mobile 1/2, task: test, filter: --filter=staff-mobile, args: '-- --shard=1/2', jcache: mobile-1-2 }
          - { name: test mobile 2/2, task: test, filter: --filter=staff-mobile, args: '-- --shard=2/2', jcache: mobile-2-2 }
          # The family web app and the web kit both web apps build from source (docs/51 §2), on their own machine.
          - { name: test family web, task: test, filter: --filter=family-web --filter=@ab/web-kit, vcache: family-web }
          # Every other package, the family app (docs/50 §7) and the source package both apps share included.
          - { name: test others, task: test, filter: '--filter=!staff-web --filter=!api --filter=!staff-mobile --filter=!family-web --filter=!@ab/web-kit', vcache: others }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/pnpm-store
      - run: pnpm i --frozen-lockfile
      - name: Oxlint
        if: matrix.task == 'lint'
        run: pnpm lint:ox --format github
      - name: Turbo cache (GitHub Actions cache)
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2
      # A new lockfile, vitest config or tsconfig (swc and oxc read compilerOptions) starts empty; otherwise the
      # newest cache of this shard (this branch's, else the base branch's). jest (`jcache`, staff-mobile): the
      # same with the Babel and jest configs.
      - name: Transform cache key
        id: vkey
        if: matrix.vcache || matrix.jcache
        env:
          LOCK: ${{ hashFiles('pnpm-lock.yaml') }}
          CONF: >-
            ${{ matrix.vcache && hashFiles('*/*/vitest.config.mts', '*/*/vite.config.ts', 'packages/config/vite.js', 'tsconfig*.json',
            '*/*/tsconfig*.json', 'packages/config/tsconfig/**') || hashFiles('*/*/babel.config.cjs',
            '*/*/jest.config.cjs', '*/*/jest.setup.cjs', 'packages/mobile-kit/jest.base.cjs', 'packages/mobile-kit/babel.cjs') }}
          KIND: ${{ matrix.vcache && 'vitest' || 'jest' }}
          SHARD: ${{ matrix.vcache || matrix.jcache }}
        run: |
          echo "prefix=$KIND-$RUNNER_OS-$LOCK-$CONF-$SHARD-" >> "$GITHUB_OUTPUT"
          echo "dir=node_modules/.$KIND-cache" >> "$GITHUB_OUTPUT"
      - name: Restore the transform cache
        id: vcache
        if: matrix.vcache || matrix.jcache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.vkey.outputs.dir }}
          key: ${{ steps.vkey.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.vkey.outputs.prefix }}
      - name: Mark the restored transform cache
        if: matrix.vcache || matrix.jcache
        run: touch "$RUNNER_TEMP/vitest-start"
      - id: turbo
        run: |
          start=$SECONDS
          status=0
          set -o pipefail
          pnpm turbo ${{ matrix.task }} ${{ matrix.filter }} ${{ matrix.opts }} --cache-dir=.turbo/cache ${{ matrix.args }} 2>&1 \
            | tee "$RUNNER_TEMP/turbo.log" || status=$?
          echo "turbo ${{ matrix.task }}: $((SECONDS - start)) s" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
        env:
          NODE_OPTIONS: ${{ matrix.heap }}
          JEST_CACHE_DIR: ${{ matrix.jcache && format('{0}/node_modules/.jest-cache', github.workspace) || '' }}
      # Saved only when vitest (or jest) wrote new transforms (not when turbo replayed the task), also after a red test (the
      # transforms are still right), and only when nothing was restored, i.e. a new lockfile or config (~50 MB per
      # shard): one entry per key prefix instead of a new one per develop run, so the Actions cache keeps room for turbo.
      - name: New transforms?
        id: vwrote
        if: ${{ !cancelled() && (matrix.vcache || matrix.jcache) }}
        env:
          DIR: ${{ steps.vkey.outputs.dir }}
        run: |
          new=$(find "$DIR" -type f -newer "$RUNNER_TEMP/vitest-start" -print -quit 2>/dev/null || true)
          [ -z "$new" ] || echo "new=true" >> "$GITHUB_OUTPUT"
      - name: Save the transform cache
        if: ${{ !cancelled() && steps.vwrote.outputs.new == 'true' && steps.vcache.outputs.cache-matched-key == '' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.vkey.outputs.dir }}
          key: ${{ steps.vcache.outputs.cache-primary-key }}
      # ESLint fails on a suppression that no longer occurs (a fixed long line, a split function). On a red lint
      # the log shows the pruned eslint-suppressions.json to commit (or run `pnpm lint:prune` in a cloud session,
      # never on the owner's PC; docs/31a §5). Only when ESLint printed that message, and only for the packages
      # that printed it (turbo's «<package>:lint:» prefix); the message with no package found = every package.
      # A red lint from a real violation alone ends without this re-lint.
      - name: Suppressions to prune (commit this diff)
        if: failure() && steps.turbo.outcome == 'failure' && matrix.task == 'lint'
        env:
          NODE_OPTIONS: ${{ matrix.heap }}
        run: |
          stale=$(sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/turbo.log" | grep -F 'suppressions left that do not occur anymore' || true)
          if [ -z "$stale" ]; then echo "no stale suppressions: nothing to prune"; exit 0; fi
          filters=$(sed -nE 's/^([@A-Za-z0-9._/-]+):lint: .*/--filter=\1/p' <<< "$stale" | sort -u | tr '\n' ' ')
          echo "pruning: ${filters:-every package}"
          pnpm turbo lint --force --continue --concurrency=3 $filters -- --prune-suppressions > /dev/null 2>&1 || true
          git --no-pager diff -- '*eslint-suppressions.json'

      # Oxlint parity (owner 2026-11-07 «go with oxlint», docs/31b-oxlint-mapping.md): ESLint still gates (step
      # above); these steps prove Oxlint can take over with no lost coverage, and run even after a red ESLint.
      # «Oxlint (every rule)»: oxlint.full.config.ts (every ESLint rule of every package, type-aware) held to each
      # package's oxlint-suppressions.json, the exact per-file, per-rule counts (lint-gate.mjs --oxlint).
      # «Parity»: the findings turbo lint saved (no suppressions; a package with no saved file is linted again)
      # against that same Oxlint report; red when Oxlint misses a finding ESLint reports, outside the reviewed
      # parity/gaps.json, or a rule ESLint turns on for a file is off or set otherwise in Oxlint. Both need the
      # workspace packages built (their types), as turbo lint does.
      - name: Build the workspace packages (parity)
        if: ${{ !cancelled() && matrix.task == 'lint' && steps.turbo.outcome != 'skipped' }}
        run: pnpm turbo build --filter='./packages/*' --cache-dir=.turbo/cache
      - name: Oxlint (every rule)
        id: oxfull
        if: ${{ !cancelled() && matrix.task == 'lint' && steps.turbo.outcome != 'skipped' }}
        env:
          LINT_SCOPE: ${{ matrix.scope }}
        run: pnpm lint:oxfull
      - name: Parity with ESLint
        if: ${{ !cancelled() && matrix.task == 'lint' && steps.oxfull.outcome != 'skipped' }}
        env:
          LINT_PARITY_ESLINT: ${{ github.workspace }}
          LINT_PARITY_OXLINT: oxlint-report.json
          LINT_SCOPE: ${{ matrix.scope }}
          NODE_OPTIONS: ${{ matrix.heap }}
        run: pnpm lint:parity
      # A count below the baseline fails until pruned: the log shows the pruned files to commit.
      - name: Oxlint baselines to prune (commit this diff)
        if: failure() && steps.oxfull.outcome == 'failure'
        env:
          LINT_SCOPE: ${{ matrix.scope }}
        run: |
          pnpm lint:oxfull -- --prune > /dev/null 2>&1 || true
          git --no-pager diff -- '*oxlint-suppressions.json'
      - name: Parity details
        if: failure() && matrix.task == 'lint'
        uses: actions/upload-artifact@v4
        with:
          name: lint-parity-report${{ matrix.scope == 'apps/api' && '-api' || '' }}
          path: lint-parity-report.json
          if-no-files-found: ignore

  # Refactor guards (docs/27 §4). Folder cap: an error since Wave F (a new crowded folder, an allow-listed one
  # that grew, a stale allow-list entry). Pure-move check: for move PRs (refactor/* and cloud/refactor-* heads
  # of any lane, and any PR whose diff adds or changes refactor/moves/*.json, whatever its branch name); it fails
  # on any hunk that is not a rename, a module path, a listed identifier rename, a new index.ts barrel, config
  # that only follows moved paths or a baseline entry that follows its moved file. No install, no secrets.
  refactor:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node tools/scripts/ci-checks/folder-cap.mjs --strict
      - name: Pure-move check
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          MAPS=$(git diff --name-only --diff-filter=AMR "origin/$BASE_REF...HEAD" -- 'refactor/moves/*.json')
          case "$HEAD_REF" in refactor/*|cloud/refactor-*) MAPS="${MAPS:-$HEAD_REF}" ;; esac
          if [ -n "$MAPS" ]; then node tools/scripts/ci-checks/pure-move-check.mjs "origin/$BASE_REF" HEAD
          else echo "not a move PR ($HEAD_REF): skipped"; fi

  # Code-health gates (docs/27 Wave F). Counts are measured on both sides, never stored: on a PR the merge base is
  # checked out beside the head (GUARD_BASE) and jscpd (clones, duplicated lines, cross-app clones), cycles,
  # package boundaries (both sides under the head's refactor/guards/packages.json) and lint (docs/59: every
  # eslint- and oxlint-suppressions.json per file and per rule; the lint job fails on a new violation, this gate on a
  # count raised by hand, a new entry or file, or an entry whose file is gone) fail only above the base branch's.
  # Equal or below passes with nothing to edit, so PRs never touch a baseline and never conflict on one. knip and
  # queries (and the floating units) keep their lists in refactor/guards/ (paths a move rewrites): a new entry fails, a fixed one passes and
  # job «baselines» drops it on develop. Pushes print the counts (each change was compared on its PR). The e2e area
  # guard: every e2e spec is in e2e/areas.json or its developOnly list (none can silently never run on a PR). No secrets.
  guards:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.verified != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/pnpm-store
      - run: pnpm i --frozen-lockfile
      # The base branch's own tree, with its jscpd report, for the count gates below. A git error fails the step.
      - name: Base branch checkout (on a PR)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base=$(git merge-base "origin/$BASE_REF" HEAD)
          git worktree add --detach "$RUNNER_TEMP/base" "$base"
          (cd "$RUNNER_TEMP/base" && "$GITHUB_WORKSPACE/node_modules/.bin/jscpd")
          echo "GUARD_BASE=$RUNNER_TEMP/base" >> "$GITHUB_ENV"
      - run: pnpm guard:dup
      - run: pnpm guard:knip
      - run: pnpm guard:queries
      - run: pnpm guard:cycles
      - run: pnpm guard:packages
      - run: pnpm guard:comments
      - run: pnpm guard:units
      - run: pnpm guard:move-only
      # On a PR: every suppressions file per file and per rule against the base branch's (docs/59), and the
      # refactor/guards and refactor/folder-cap baselines: only shrink, never a new entry or file.
      - run: pnpm guard:lint
      - run: pnpm guard:baselines
      # A head lint config looser than the base's (a rule off or warn, a new ignore or exemption, a raised limit):
      # a «lint rules loosened» annotation, never a failure; such a PR merges only with the owner's go.
      - name: Lint config loosened?
        continue-on-error: true
        run: pnpm guard:loosened
      - run: node tools/scripts/ci-checks/e2e-areas/guard.mjs

  # develop only, after green guards (or guards skipped because a green PR run checked this tree): drop the knip, queries and units entries that are fixed (the gates pass on them, so
  # PRs never edit the lists for that; after a green gate `--write` can only remove lines). The commit says
  # [skip ci], touches only refactor/guards/ (paths-ignore above) and is pushed with the built-in token, which
  # starts no workflow: nothing loops and nothing deploys. The only ci job that may write contents; the token
  # reaches only the push step. continue-on-error: a rejected push (develop moved meanwhile) only warns and the
  # next push prunes, so ci stays green for deploy-staging.
  baselines:
    needs: [changes, guards]
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/develop' && needs.changes.result == 'success'
      && (needs.guards.result == 'success' || needs.changes.outputs.verified == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - id: store
        uses: ./.github/actions/pnpm-store
      - run: pnpm i --frozen-lockfile
      # The one place the pnpm store is saved (.github/actions/pnpm-store): once per lockfile, from develop
      # (readable by every PR), after dropping the packages this lockfile no longer uses.
      - name: Prune the pnpm store (new lockfile only)
        if: steps.store.outputs.hit != 'true'
        run: pnpm store prune
      - if: steps.store.outputs.hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.store.outputs.dir }}
          key: ${{ steps.store.outputs.key }}
      - run: pnpm guard:knip -- --write
      - run: pnpm guard:queries -- --write
      - run: pnpm guard:units -- --write
      - name: Commit the pruned lists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- refactor/guards; then echo "nothing to prune"; exit 0; fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'chore(guards): drop fixed knip, queries and units entries [skip ci]' -- refactor/guards
          git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" HEAD:develop \
            || echo "::warning::develop moved: the next push prunes the lists"

  # The API image as the VPS builds it (deploy/staging/roll.sh: `docker compose build`, apps/api/Dockerfile), on
  # a change to what the Dockerfile installs or to deploy/ (job «changes», IMAGE_PATHS). Layers come from the
  # GitHub Actions cache (scope api-image; a PR reads develop's and writes its own), so a warm run rebuilds only
  # what changed. Then the container itself: the report PDF through its Chromium, the chat PDF sandbox listening
  # as ayat-pdf runs it (no network, read-only, no capabilities), and /health with stub env (no database).
  image:
    name: api image
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build the API image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/api/Dockerfile
          tags: ayat-api:ci
          load: true
          cache-from: type=gha,scope=api-image
          cache-to: type=gha,mode=max,scope=api-image
      - name: Report PDF (Chromium of the image)
        run: |
          docker run --rm ayat-api:ci node -e "
            const { chromium } = require('playwright-core');
            (async () => {
              const b = await chromium.launch();
              const p = await b.newPage();
              await p.setContent('<p dir=rtl>تقرير الحلقة</p>');
              const pdf = await p.pdf();
              await b.close();
              if (pdf.length < 500) throw new Error('empty pdf');
              console.log('report pdf bytes', pdf.length);
            })().catch((e) => { console.error(e); process.exit(1); });"
      - name: PDF sandbox listens (as ayat-pdf)
        run: |
          docker run -d --name pdf --init --user node --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --tmpfs /tmp:size=64m \
            --tmpfs /run/pdf:size=64k,uid=1000,gid=1000,mode=0700 \
            ayat-api:ci node dist/modules/messaging/inbox/files/pdf/pdf-sandbox.js
          for i in $(seq 30); do docker exec pdf test -S /run/pdf/pdf.sock && { echo listening; exit 0; }; sleep 1; done
          docker logs pdf; exit 1
      - name: /health with stub env
        run: |
          docker run -d --name api -p 127.0.0.1:3000:3000 -e APP_ROLE=api \
            -e SUPABASE_URL=http://127.0.0.1:54321 -e SUPABASE_SERVICE_ROLE_KEY=stub ayat-api:ci
          curl -fsS --retry 30 --retry-delay 2 --retry-all-errors http://127.0.0.1:3000/health && echo
          for i in $(seq 30); do
            s=$(docker inspect -f '{{.State.Health.Status}}' api)
            [ "$s" = starting ] || break; sleep 2
          done
          echo "docker health: $s"
      - if: failure()
        run: docker logs api || true

  # The required aggregate for branch protection: every verify job (lint parity is in the lint row) and the guards passed, or a docs-only change
  # skipped them all (changes said code=false); on a PR the refactor job (folder cap, pure moves) passed too.
  # A develop push whose tree a green PR run already checked (changes said verified=true) passes with verify and the
  # guards skipped. Anything else (a failed or cancelled job, a failed changes job) is red.
  # A green PR run (code, verify, guards and refactor all passed) leaves ci-green-tree-<tree> for that skip.
  # Secret scan: no private key, keystore, service-account file, .env with values or provider token enters
  # through a PR (its commits) or a push (the pushed range; a new or rewritten base = the head commit).
  # gitleaks is a pinned release binary checked by sha256 (no third-party action, no licence); rules and the
  # test-fixture allow-list are in .gitleaks.toml. Findings are redacted in the log. Never skipped, no secrets.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          TAR="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$TAR" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          (cd "$RUNNER_TEMP" && echo "$GITLEAKS_SHA256  $TAR" | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$TAR" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the new commits
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) RANGE="origin/$BASE_REF..HEAD" ;;
            *) RANGE="$BEFORE..$AFTER"
               git cat-file -e "$BEFORE^{commit}" 2>/dev/null || RANGE="-1 $AFTER" ;;
          esac
          echo "range: $RANGE"
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --config .gitleaks.toml --log-opts="$RANGE" .
          # git mode skips binary diffs: a keystore is caught by its name.
          BIN=$(git log --diff-filter=A --name-only --format= $RANGE | grep -iE '\.(keystore|jks|p12|pfx)$' || true)
          test -z "$BIN" || { echo "::error::keystore files added:"; echo "$BIN"; exit 1; }

  check:
    needs: [changes, verify, guards, refactor, image, secret-scan]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          VERIFY: ${{ needs.verify.result }}
          GUARDS: ${{ needs.guards.result }}
          REFACTOR: ${{ needs.refactor.result }}
          VERIFIED: ${{ needs.changes.outputs.verified }}
          IMAGE: ${{ needs.image.result }}
          SECRET_SCAN: ${{ needs.secret-scan.result }}
        run: |
          test "$CHANGES" = success
          test "$SECRET_SCAN" = success
          # The API image job runs only when its inputs changed (changes said image=true): skipped = ok.
          test "$IMAGE" = success || test "$IMAGE" = skipped
          test "$REFACTOR" = success || { [ "$GITHUB_EVENT_NAME" != pull_request ] && [ "$REFACTOR" = skipped ]; }
          if [ "$VERIFIED" = true ] && [ "$GITHUB_EVENT_NAME" = push ] && [ "$VERIFY" = skipped ] && [ "$GUARDS" = skipped ]; then
            echo "same tree passed verify and guards on a PR: skipped"; exit 0
          fi
          if [ "$CODE" = false ] && [ "$VERIFY" = skipped ] && [ "$GUARDS" = skipped ]; then
            echo "docs only: verify skipped"; exit 0
          fi
          test "$VERIFY" = success
          test "$GUARDS" = success
      - name: Green tree (PR)
        id: green
        if: >-
          github.event_name == 'pull_request' && needs.changes.outputs.code == 'true' && needs.verify.result == 'success'
          && needs.guards.result == 'success' && needs.refactor.result == 'success' && needs.changes.outputs.tree != ''
        env:
          TREE: ${{ needs.changes.outputs.tree }}
        run: echo "$TREE" > "$RUNNER_TEMP/green-tree.txt"
      - if: steps.green.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ci-green-tree-${{ needs.changes.outputs.tree }}
          path: ${{ runner.temp }}/green-tree.txt
          retention-days: 7

  # The e2e suite shares one database per run and runs with one worker, so it is split across machines
  # instead: each shard has its own local Supabase, API and web server (docs/04 §9). A failing shard does
  # not stop the others (fail-fast off), so one run shows every red spec.
  # A PR runs only the specs its change can reach (job «changes», e2e/areas.json) on 1-10 shards; pushes to
  # develop/main run every spec on both projects, the safety net for anything a PR selection missed.
  # Shards 1-8 are Playwright's own --shard, sized on measured durations (step «Shard sizes»; refresh
  # e2e/shard-durations.json from the «e2e-durations-*» artifacts of a push run). «single line» is the production
  # configuration (docs/12 §13.12): ONE WhatsApp line, no WA_CHAT_* keys (playwright.config.ts reads E2E_LINES);
  # the six §5 journeys plus the template status and settings switch specs, desktop only. Named by file
  # name alone: Playwright matches them as path patterns, so they keep working inside e2e/tests/<domain>/.
  e2e:
    name: ${{ matrix.name }}
    needs: changes
    # On again (owner, 2026-10-05) now that the suite is fast. To pause it without a code change, set the
    # repository variable RUN_E2E to 'false' (Settings → Secrets and variables → Actions → Variables).
    # A draft PR skips e2e (marking it ready starts a run that has it); pushes are never drafts.
    if: >-
      needs.changes.outputs.e2e == 'true' && vars.RUN_E2E != 'false'
      && !(github.event_name == 'pull_request' && github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The matrix comes from «changes» (plan.mjs): on a PR only the shards its selected specs need, plus
    # «single line» (the smoke set) always; the fallback below is the full matrix (pushes, any failure).
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.e2e_matrix || '{"include":[{"name":"e2e (1)","shard":"1","total":10},{"name":"e2e (2)","shard":"2","total":10},{"name":"e2e (3)","shard":"3","total":10},{"name":"e2e (4)","shard":"4","total":10},{"name":"e2e (5)","shard":"5","total":10},{"name":"e2e (6)","shard":"6","total":10},{"name":"e2e (7)","shard":"7","total":10},{"name":"e2e (8)","shard":"8","total":10},{"name":"e2e (9)","shard":"9","total":10},{"name":"e2e (10)","shard":"10","total":10},{"name":"e2e (single line)","shard":"single","total":10}]}') }}
    env:
      SHARDS: ${{ matrix.total }}
      # The PR's selected spec files (empty = all of them).
      SPECS: ${{ needs.changes.outputs.e2e_specs }}
      # Only what the e2e suite uses: Postgres, auth, PostgREST, storage and the gateway.
      SUPABASE_EXCLUDE: studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,postgres-meta,supavisor
      # The CLI pulls from public.ecr.aws by default, which answered every pull with «toomanyrequests: Data
      # limit exceeded» and two retries (4 s + 8 s) before the image came (2026-10-27): same images, Docker Hub.
      SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
    steps:
      # Supabase's host ports (54321 API, 54322 db, … 54329) sit inside Linux's ephemeral range: an outgoing
      # socket took 54322 first ("address already in use"), twice on 2026-10-25 even with the ports reserved
      # just before the start, so they are reserved first thing, before checkout and pnpm open any socket.
      - run: sudo sysctl -qw net.ipv4.ip_local_reserved_ports=54320-54329
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/pnpm-store
      - run: pnpm i --frozen-lockfile
      # In the background: the browser and the build below get ready at the same time (was ~80 s in a row).
      # Measured 2026-10-23: caching the images (docker save/load, 0.9 GB) was SLOWER than pulling them
      # (load 70 s + start 30 s against ~80 s for pull + start), so the images are pulled.
      # One retry if the start fails; the log first lists the sockets on 54320-54329 (who held the port).
      - name: Start local Supabase (background)
        run: |
          nohup bash -c 'up() { pnpm supabase start -x "$SUPABASE_EXCLUDE"; }
            time up || { sudo ss -tanp | grep -E ":5432[0-9] " || true; pnpm supabase stop --no-backup; up; }
            echo $? > "$RUNNER_TEMP/supabase.rc"' > "$RUNNER_TEMP/supabase.log" 2>&1 &
      # apt's man-db trigger rebuilds the manual index after every install (skipped with this file gone).
      - run: sudo rm -f /var/lib/man-db/auto-update
      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm --filter e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install the browser (only on a cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter e2e exec playwright install chromium
      # The browser's system libraries: only fonts are missing on the hosted image, but apt fetched them from
      # the Azure mirror at times at 34 kB/s (12 min for 25 MB). The .deb files are cached per runner image
      # and Playwright version and installed with dpkg, offline; apt only runs when they do not cover it.
      - name: Runner image
        id: img
        run: |
          echo "os=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"
          echo "id=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Restore the browser's system packages
        id: deb-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/pw-debs
          key: pw-debs-${{ steps.img.outputs.id }}-${{ steps.pw.outputs.version }}
          # A new image version of the same Ubuntu release reuses the last packages (dpkg checks them).
          restore-keys: pw-debs-${{ steps.img.outputs.os }}-
      - name: Install the browser's system libraries (only if missing)
        id: deps
        run: |
          pw() { pnpm --filter e2e exec playwright "$@"; }
          debs="$RUNNER_TEMP/pw-debs"
          if pw install-deps --dry-run chromium; then exit 0; fi
          if ls "$debs"/*.deb >/dev/null 2>&1; then
            if sudo dpkg -i "$debs"/*.deb >/dev/null && pw install-deps --dry-run chromium; then exit 0; fi
            echo "::warning::the cached packages did not cover everything: installing from apt"
          fi
          # apt over the network. 11-11: the runners could not resolve any *.ubuntu.com host for hours
          # («Temporary failure resolving archive.ubuntu.com») and every e2e shard failed. After a failed
          # try, apt also uses a mirror outside ubuntu.com (packages are still checked against Ubuntu's
          # signing keys, whatever the mirror), then retries.
          other_mirror() {
            m=https://mirrors.edge.kernel.org/ubuntu/
            list=/etc/apt/apt-mirrors.txt
            [ -f "$list" ] && echo "$m" | sudo tee "$list" >/dev/null # the image's mirror list (26.04)
            sudo sed -i -E "s#https?://(azure\.)?(archive|security)\.ubuntu\.com/ubuntu/?#$m#g" \
              /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
          }
          for wait in 0 20 60; do
            sleep "$wait"
            if pw install-deps chromium; then ok=1; break; fi
            echo "::warning::installing the browser's system libraries failed: other mirror, retrying"
            other_mirror
          done
          [ "${ok:-}" = 1 ] || { echo "::error::apt failed 3 times"; exit 1; }
          mkdir -p "$debs" && cp /var/cache/apt/archives/*.deb "$debs"/ 2>/dev/null \
            && echo "save=true" >> "$GITHUB_OUTPUT" || true
      - if: steps.deps.outputs.save == 'true' && steps.deb-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/pw-debs
          key: ${{ steps.deb-cache.outputs.cache-primary-key }}
      - name: Turbo cache (GitHub Actions cache, shared with verify)
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2
      - name: Build what the e2e servers run
        run: pnpm turbo build --filter=e2e^... --cache-dir=.turbo/cache
      - name: Wait for local Supabase
        run: |
          for _ in $(seq 1 300); do [ -f "$RUNNER_TEMP/supabase.rc" ] && break; sleep 1; done
          cat "$RUNNER_TEMP/supabase.log"
          test "$(cat "$RUNNER_TEMP/supabase.rc" 2>/dev/null)" = 0
      - run: pnpm env:local
      # Shard sizes from the measured durations (tools/scripts/ci-checks/e2e-shards.mjs, e2e/shard-durations.json): the
      # shards keep Playwright's own order and contiguous cuts, only the cut points move. FAIL SAFE: any error
      # leaves the value empty and Playwright splits by equal test counts, as before. Every test still runs:
      # Playwright itself assigns every group to exactly one shard whatever the sizes.
      - name: Shard sizes
        id: weights
        if: matrix.shard != 'single'
        env:
          PROJECT: ${{ github.event_name == 'pull_request' && '--project=desktop' || '' }}
          E2E_GROUPS_FILE: ${{ runner.temp }}/groups.json
        run: |
          if pnpm --filter e2e exec playwright test --list --reporter=./support/durations-reporter.ts $PROJECT $SPECS >/dev/null \
            && w=$(node tools/scripts/ci-checks/e2e-shards.mjs weights "$SHARDS" "$RUNNER_TEMP/groups.json") \
            && [[ "$w" =~ ^[0-9]+(:[0-9]+)*$ ]]; then
            echo "weights=$w" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::shard sizes unknown: equal test counts per shard"
          fi
      # PRs run the desktop project only (half the specs); pushes to main/develop also run the phone-size
      # project, so a mobile layout regression is still caught before a release.
      # --only: the servers were built by «Build what the e2e servers run» above. Without it turbo hashed the
      # Playwright arguments (--shard=n/10) into every dependency's build, so each shard built api and web a
      # second time (~60 s, 11-18). Same task, same strict env; only its dependencies are not run again.
      - name: e2e
        env:
          CI: 'true'
          SHARD: ${{ matrix.shard }}
          PROJECT: ${{ github.event_name == 'pull_request' && '--project=desktop' || '' }}
          PWTEST_SHARD_WEIGHTS: ${{ steps.weights.outputs.weights }}
          E2E_LINES: ${{ matrix.shard == 'single' && 'single' || '' }}
          E2E_DURATIONS_FILE: ${{ matrix.shard != 'single' && format('{0}/e2e-durations.json', runner.temp) || '' }}
        run: |
          if [ "$SHARD" = single ]; then
            pnpm turbo e2e --filter=e2e --only --cache-dir=.turbo/cache -- --project=desktop \
              journey-1-lead-to-trial.spec.ts journey-2-report.spec.ts \
              journey-3-payment-renewal.spec.ts journey-4-reschedule-conflict.spec.ts \
              journey-5-availability-wizard.spec.ts journey-6-duplicate-student.spec.ts \
              inbox-template-status.spec.ts settings-switches.spec.ts
          else
            pnpm turbo e2e --filter=e2e --only --cache-dir=.turbo/cache -- --shard="$SHARD/$SHARDS" $PROJECT $SPECS
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ${{ matrix.shard == 'single' && 'playwright-report-single-line' || format('playwright-report-shard-{0}', matrix.shard) }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
      # Per-file durations of this shard, to refresh e2e/shard-durations.json (tools/scripts/ci-checks/e2e-shards.mjs merge).
      # Also printed on one line: the job log outlives the 14-day artifact and needs no download.
      - name: e2e durations (one line)
        if: always() && matrix.shard != 'single'
        run: |
          f="$RUNNER_TEMP/e2e-durations.json"
          if [ -s "$f" ]; then echo "e2e-durations $(jq -c . "$f")"; fi
      - uses: actions/upload-artifact@v4
        if: always() && matrix.shard != 'single'
        with:
          name: e2e-durations-${{ github.event_name }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/e2e-durations.json
          if-no-files-found: ignore
          retention-days: 14
      # Journey 7's screenshots and the assistant's video for the owner, on every run (fake data only). Only the shard that ran the
      # spec has them; the others upload nothing.
      - uses: actions/upload-artifact@v4
        if: always() && matrix.shard != 'single'
        with:
          name: assistant-journey-screens
          path: |
            e2e/test-results/**/journey-7-*/**/*.png
            e2e/test-results/**/journey-7-*/**/*.webm
          if-no-files-found: ignore
          retention-days: 7
