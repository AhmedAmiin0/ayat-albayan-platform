# TEMPORARY (removed before the PR is final): writes the lockfile and the eslint suppressions baselines in CI,
# never on the owner's PC (docs/31a §5.1). No secrets.
name: tmp-strict-baseline
on:
  push:
    branches: [chore/strict-rules]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm i --no-frozen-lockfile
      - run: git diff --stat pnpm-lock.yaml
      - name: fresh suppressions
        run: rm -f apps/*/eslint-suppressions.json packages/*/eslint-suppressions.json tools/*/eslint-suppressions.json e2e/eslint-suppressions.json
      - name: suppress-all
        continue-on-error: true
        run: pnpm turbo lint --force --continue=always --concurrency=3 -- --suppress-all
      - name: lint baseline
        continue-on-error: true
        run: node tools/scripts/ci-checks/lint/lint-gate.mjs --write && cat refactor/guards/lint.json
      - name: lint again (must be green)
        continue-on-error: true
        run: pnpm turbo lint --force --continue=always --concurrency=3
      - name: typecheck
        continue-on-error: true
        run: pnpm turbo typecheck --force --continue=always
      - name: new unit tests
        continue-on-error: true
        run: node --test packages/config/eslint-react.test.js packages/config/eslint-boundaries.test.js tools/scripts/ci-checks/lint/lint-gate.test.mjs
      - name: print-config (exhaustive-deps, no-deriving-state-in-effects, no-restricted-syntax selectors)
        continue-on-error: true
        run: |
          q='{ "exhaustive-deps": .rules["react-hooks/exhaustive-deps"], "no-deriving-state-in-effects": .rules["react-hooks/no-deriving-state-in-effects"], "no-restricted-syntax": (.rules["no-restricted-syntax"] | length), "complexity": .rules.complexity }'
          (cd apps/web && pnpm exec eslint --print-config src/main.tsx | jq "$q")
          (cd apps/mobile && f=$(ls app/*.tsx | head -1) && echo "$f" && pnpm exec eslint --print-config "$f" | jq "$q")
      - name: knip
        continue-on-error: true
        run: pnpm guard:knip
      - name: jscpd
        continue-on-error: true
        run: pnpm guard:dup
      - name: folder cap
        continue-on-error: true
        run: node tools/scripts/ci-checks/folder-cap.mjs --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strict-baseline
          path: |
            pnpm-lock.yaml
            apps/*/eslint-suppressions.json
            packages/*/eslint-suppressions.json
            tools/*/eslint-suppressions.json
            e2e/eslint-suppressions.json
            refactor/guards/lint.json
          retention-days: 3
