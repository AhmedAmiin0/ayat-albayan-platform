name: deploy-production
# PRODUCTION = the live app (owner 2026-10-31: «keep the current and make it the production»): app.ayatalbayan.com,
# api.ayatalbayan.com, Supabase knxfwiimjcifwckhwbim, /opt/ayat-albayan-staging on the VPS. The names that still say
# «staging» (the directory, the compose project, the image tag, the GitHub environment «develop», STAGING_* secrets)
# are legacy and kept on purpose: renaming them would touch live state. docs/09-deployment.md «Production».
# BY HAND ONLY, on the owner's «go»: Actions → deploy-production → Run workflow (branch develop). Nothing starts it
# automatically: a develop merge deploys the separate STAGING (deploy-staging.yml), never this.
# Every value comes from the GitHub environment "develop" (Settings → Environments → develop; the owner may rename
# it «production» later and add himself as required reviewer) or the repository secrets: secrets for anything
# private. The public production values below are defaults; a variable of the same name overrides one.
# The server's .env is MERGED, not replaced: a key left empty in GitHub keeps the server's value.
# SAFETY: this workflow never sets WA_PHONE_NUMBER_ID (the WhatsApp cut-over is the owner's, by hand;
# sending itself is switched only in /admin/settings, settings.messaging_enabled, docs/23) and never touches /opt/wacrm.
# The repo is public: no pull_request trigger, no pull_request_target, secrets only in environment jobs.
# The title carries the deployed commit (and a marker when migrations or code were skipped by hand):
# the «plan» job of the next run reads it back to know what production last received.
run-name: >-
  deploy-production ${{ inputs.sha || github.sha }}${{ inputs.env_only && ' env-only'
  || !inputs.migrate && ' no-migrate' || '' }}
on:
  # By hand only: Actions → deploy-production → Run workflow, on develop.
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to deploy (40 hex, already on develop). Empty = develop's head
        type: string
        default: ''
      migrate:
        description: Push database migrations to the production Supabase first (waits for the staging-db reviewer)
        type: boolean
        default: true
      env_only:
        description: Only update the server .env and restart the API (no code, no web, no migrations)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  # Is the develop environment set up, and is the commit one develop already has? Without the deploy key the
  # run fails and says what is missing.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: develop
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Started on develop
        if: ${{ github.ref != 'refs/heads/develop' }}
        run: |
          echo "::error::production is deployed from develop only (this run is on ${{ github.ref }})"
          exit 1
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      # A commit that is not on develop (a PR's, a fork's) is never deployed, whatever was typed.
      - name: The chosen commit is on develop
        if: ${{ inputs.sha != '' }}
        env:
          SHA: ${{ inputs.sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be 40 hex characters"; exit 1; }
          git merge-base --is-ancestor "$SHA" HEAD || { echo "::error::$SHA is not on develop"; exit 1; }
      - id: check
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY || secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          if [ -n "$SSH_PRIVATE_KEY" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "::error::production deploy needs the secret VPS_SSH_PRIVATE_KEY (or SSH_PRIVATE_KEY) and the STAGING_* secrets, see docs/09-deployment.md «GitHub Actions»"
          exit 1

  # What changed since production last got it (owner 2026-10-23: no approval click when no migration changed,
  # automatic OTA). GitHub API with actions: read only; no environment, no secret.
  #  - migrations: false only when the last deploy that pushed migrations is known (tools/scripts/env/deploy-baseline.mjs)
  #    AND nothing under packages/db/supabase/migrations/ changed since. FAIL SAFE: an unknown or unfound
  #    baseline, an API or git error, or an empty output all leave the gated migrate job ON.
  #  - ota: true only when apps/mobile or packages/shared (the JS the app bundles) changed since the last green
  #    preview OTA (else since the last deploy) AND native-changes.mjs finds no native change since the last
  #    APK (repository variable OTA_BASELINE_SHA, default c140b4cc). Anything unclear = no OTA.
  plan:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      migrations: ${{ steps.migrations.outputs.migrations }}
      ota: ${{ steps.ota.outputs.ota }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - id: base
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/scripts/env/deploy-baseline.mjs | tee -a "$GITHUB_OUTPUT"
      - id: migrations
        env:
          BASE: ${{ steps.base.outputs.migrate_base }}
        run: |
          migrations=true
          if [ -z "$BASE" ]; then
            echo "::notice::last migrated deploy unknown: the gated migrate job runs"
          elif ! changed=$(git diff --name-only "$BASE" HEAD -- packages/db/supabase/migrations/); then
            echo "::warning::git diff against $BASE failed: the gated migrate job runs"
          elif [ -n "$changed" ]; then
            printf 'migrations changed since %s:\n%s\n' "${BASE:0:7}" "$changed"
          else
            migrations=false
            echo "::notice::no migration changed since ${BASE:0:7}: migrate skipped (no staging-db approval needed)"
          fi
          echo "migrations=$migrations" >> "$GITHUB_OUTPUT"
      - id: ota
        if: ${{ !inputs.env_only }}
        env:
          BASE: ${{ steps.base.outputs.ota_base || steps.base.outputs.code_base }}
          NATIVE_BASE: ${{ vars.OTA_BASELINE_SHA || 'c140b4cc' }}
        run: |
          ota=false
          js() { git diff --name-only "$BASE" HEAD -- apps/mobile packages/shared \
            ':(glob,exclude)**/*.test.ts' ':(glob,exclude)**/*.test.tsx' ':(glob,exclude)**/*.md'; }
          if [ -z "$BASE" ]; then echo "::notice::no earlier OTA or deploy known: no automatic OTA (run mobile by hand)"
          elif ! git merge-base --is-ancestor "$BASE" HEAD; then echo "::notice::${BASE:0:7} is not behind this commit: no automatic OTA"
          elif [ -z "$(js)" ]; then echo "no mobile JS change since ${BASE:0:7}: no OTA"
          elif ! node tools/scripts/ci-checks/native-changes.mjs "$NATIVE_BASE"; then
            echo "::warning::native change since the last APK ($NATIVE_BASE): no automatic OTA. Build an APK by hand (mobile → build-android-apk), then set OTA_BASELINE_SHA."
          else ota=true; echo "mobile JS changed since ${BASE:0:7} and no native change: OTA to preview after the deploy"; fi
          echo "ota=$ota" >> "$GITHUB_OUTPUT"

  # Database first (environment staging-db: the owner's required reviewer gates it), then the API. Skipped by
  # the migrate / env_only inputs, or when «plan» proved no migration changed (any other plan result, a failed
  # plan included, runs it).
  migrate:
    needs: [preflight, plan]
    if: >-
      ${{ !cancelled() && needs.preflight.outputs.ready == 'true' && inputs.migrate && !inputs.env_only
      && needs.plan.outputs.migrations != 'false' }}
    permissions:
      contents: read
    uses: ./.github/workflows/db-migrate.yml
    with:
      apply: true
      target: production
      ref: ${{ inputs.sha || github.sha }}
    secrets: inherit

  deploy:
    needs: [preflight, migrate]
    # A skipped migrate (env_only / migrate unticked) is fine; a failed or declined one stops the deploy.
    if: ${{ !cancelled() && needs.preflight.outputs.ready == 'true' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') }}
    runs-on: ubuntu-latest
    # A build, five health waits (≤ 3 min each) and, on failure, the rollback's build and roll: a cancelled run
    # (failure() false) would skip the rollback.
    timeout-minutes: 60
    environment: develop
    permissions:
      contents: read
    env:
      DEST: ${{ vars.DEPLOY_DIR || '/opt/ayat-albayan-staging' }}
      SSH_HOST: ${{ vars.SSH_HOST || secrets.VPS_HOST || '148.230.116.195' }}
      SSH_USER: ${{ vars.SSH_USER || secrets.VPS_USER || 'root' }}
    steps:
      # Exactly production's directory (legacy name): never /opt/ayat-albayan-stg (staging) or anything else.
      - name: Only the production directory may be deployed to
        run: |
          [ "$DEST" = /opt/ayat-albayan-staging ] || { echo "::error::DEPLOY_DIR must be /opt/ayat-albayan-staging (got $DEST)"; exit 1; }
      - uses: actions/checkout@v5
        with:
          # The chosen commit (preflight checked it is on develop), or develop's head.
          ref: ${{ inputs.sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Build the web app (before anything on the server changes)
        if: ${{ !inputs.env_only }}
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://api.ayatalbayan.com' }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.STAGING_SUPABASE_URL || 'https://knxfwiimjcifwckhwbim.supabase.co' }}
          # Public by design; accepted as a variable or a secret.
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY || secrets.STAGING_SUPABASE_ANON_KEY }}
        run: |
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "::error::add STAGING_SUPABASE_ANON_KEY (secret) or VITE_SUPABASE_ANON_KEY (variable)"; exit 1; }
          pnpm i --frozen-lockfile
          pnpm --filter @ab/db --filter @ab/shared --filter @ab/client-core build >/dev/null
          pnpm --filter web build

      - name: SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY || secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY" || { echo "::error::add the secret VPS_SSH_PRIVATE_KEY (or SSH_PRIVATE_KEY)"; exit 1; }
          echo "::add-mask::$SSH_HOST"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::SSH_KNOWN_HOSTS is not set: the host key is fetched with ssh-keyscan on every run, so a man-in-the-middle on the runner network would go unnoticed. Pin it: ssh-keyscan -t ed25519 <host> and save the line as the secret SSH_KNOWN_HOSTS."
            ssh-keyscan -H "$SSH_HOST" > ~/.ssh/known_hosts
          fi
          printf 'Host target\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n  ServerAliveInterval 30\n  ServerAliveCountMax 6\n' \
            "$SSH_HOST" "$SSH_USER" > ~/.ssh/config
          ssh target "test -d $DEST" || { echo "::error::$DEST missing on the server"; exit 1; }

      - name: Merge the server .env (key names only are logged)
        # API .env keys (apps/api/src/config/env/env.ts), scoped to this step only. The WhatsApp phone number id and
        # the messaging switch are deliberately NOT here: they stay whatever the server has.
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          WA_ACCESS_TOKEN: ${{ secrets.WA_ACCESS_TOKEN }}
          WA_APP_SECRET: ${{ secrets.WA_APP_SECRET }}
          WA_VERIFY_TOKEN: ${{ secrets.WA_VERIFY_TOKEN }}
          FEEDBACK_TOKEN_SECRET: ${{ secrets.FEEDBACK_TOKEN_SECRET }}
          LOGIN_CODE_PEPPER: ${{ secrets.LOGIN_CODE_PEPPER }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          RECORDING_S3_ACCESS_KEY: ${{ secrets.RECORDING_S3_ACCESS_KEY }}
          RECORDING_S3_SECRET: ${{ secrets.RECORDING_S3_SECRET }}
          EXPO_ACCESS_TOKEN: ${{ secrets.EXPO_ACCESS_TOKEN }}
          # … and variables:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.STAGING_SUPABASE_URL }}
          WEB_ORIGIN: ${{ vars.WEB_ORIGIN }}
          WA_API_BASE: ${{ vars.WA_API_BASE }}
          WA_API_VERSION: ${{ vars.WA_API_VERSION }}
          WA_WABA_ID: ${{ vars.WA_WABA_ID }}
          WA_APP_ID: ${{ vars.WA_APP_ID }}
          LIVEKIT_URL: ${{ vars.LIVEKIT_URL }}
          RECORDING_S3_ENDPOINT: ${{ vars.RECORDING_S3_ENDPOINT }}
          RECORDING_S3_REGION: ${{ vars.RECORDING_S3_REGION }}
          RECORDING_S3_BUCKET: ${{ vars.RECORDING_S3_BUCKET }}
          EXPO_API_BASE: ${{ vars.EXPO_API_BASE }}
          FX_API_URL: ${{ vars.FX_API_URL }}
        run: |
          umask 077
          # Missing file = start empty; present but unreadable = stop (never write a partial .env).
          ssh target "if [ -e $DEST/.env ]; then cat $DEST/.env; fi" > current.env
          keys="SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY SUPABASE_JWT_SECRET WEB_ORIGIN WA_API_BASE WA_API_VERSION
            WA_WABA_ID WA_ACCESS_TOKEN WA_APP_ID WA_APP_SECRET WA_VERIFY_TOKEN
            FEEDBACK_TOKEN_SECRET LOGIN_CODE_PEPPER LIVEKIT_URL LIVEKIT_API_KEY LIVEKIT_API_SECRET RECORDING_S3_ENDPOINT RECORDING_S3_REGION
            RECORDING_S3_BUCKET RECORDING_S3_ACCESS_KEY RECORDING_S3_SECRET EXPO_ACCESS_TOKEN EXPO_API_BASE FX_API_URL"
          node tools/scripts/env/env-merge.mjs current.env $keys > new.env
          if cmp -s current.env new.env; then echo "server .env unchanged"; else
            ssh target "cp $DEST/.env $DEST/.env.bak-\$(date +%F-%H%M%S) 2>/dev/null || true; umask 077; cat > $DEST/.env.new && mv $DEST/.env.new $DEST/.env" < new.env
            echo "server .env updated (backup kept next to it)"; fi
          rm -f current.env new.env

      # docs/09 «Two API copies + one worker»: the code, the compose file, roll.sh, rollback.sh and the load balancer
      # config go up as *.new. The next step swaps them in with ONE command (the server never pairs a new layout with
      # old code; the previous ones stay as *.old) and rolls: roll.sh builds the image ONCE and rolls ayat-worker →
      # ayat-pdf → ayat-api-a → ayat-api-b (each healthy first; ayat-lb serves from the other copy; an unhealthy
      # ayat-pdf only warns), reloads ayat-lb only when its validated config changed and prunes this project's old
      # images only (no global prune; the build cache is shared with the CRM and cannot be scoped to one project, so it
      # is left alone).
      - name: Ship the API code and the compose files
        id: ship
        if: ${{ !inputs.env_only }}
        run: |
          ssh target "rm -rf $DEST/src.new && mkdir -p $DEST/src.new $DEST/lb"
          git archive --format=tar HEAD | ssh target "tar --no-same-owner -x -C $DEST/src.new"
          scp -q deploy/staging/docker-compose.yml "target:$DEST/docker-compose.yml.new"
          scp -q deploy/staging/roll.sh "target:$DEST/roll.sh.new"
          scp -q deploy/staging/rollback.sh "target:$DEST/rollback.sh.new"
          scp -q deploy/staging/lb/Caddyfile "target:$DEST/lb/Caddyfile.new"

      # Swap and roll under the deploy lock (flock -n: a second deploy refuses at once, before any change), and a failed
      # roll rolls back in the SAME command (rollback.sh, docs/09 «Roll back»), so 127.0.0.1:3110 keeps serving.
      # setsid -w, output to $DEST/.deploy.log: an ssh drop never kills the roll or its rollback halfway (they run to
      # the end on the server; the log is printed here once done). lb/Caddyfile in place (cat >, same inode): ayat-lb
      # mounts the lb/ directory and reloads the file. Exit codes: 75 lock held (nothing changed), 1 rolled back,
      # 3 the rollback failed too, 255 ssh lost.
      - name: Swap in and roll the API (one build, one container at a time)
        id: roll
        if: ${{ !inputs.env_only }}
        run: |
          ssh target "cd $DEST && setsid -w flock -n -E 75 .deploy.lock sh -c '
            for f in docker-compose.yml roll.sh lb/Caddyfile; do [ ! -f \$f ] || cp \$f \$f.old; done &&
            rm -rf src.old && { [ ! -d src ] || mv src src.old; } && mv src.new src &&
            mv docker-compose.yml.new docker-compose.yml && mv roll.sh.new roll.sh && mv rollback.sh.new rollback.sh &&
            cat lb/Caddyfile.new > lb/Caddyfile && rm lb/Caddyfile.new || exit 4
            { sh roll.sh || { sh rollback.sh || exit 3; exit 1; }; }' > .deploy.log 2>&1 < /dev/null; rc=\$?; cat .deploy.log; exit \$rc" || {
            rc=$?
            case "$rc" in
              75) echo "::error::another deploy holds $DEST/.deploy.lock: nothing was changed" ;;
              1) echo "::error::the roll failed: rollback.sh put the previous version back (bad code kept in src.bad)" ;;
              3) echo "::error::the roll failed AND rollback.sh failed: 127.0.0.1:3110 may be down, fix by hand (docs/09 «Roll back»)" ;;
              4) echo "::error::the swap failed partway: nothing was rolled; check $DEST by hand (src, src.old, *.new)" ;;
              255) echo "::error::ssh lost: the roll (and any rollback) goes on on the server, see $DEST/.deploy.log" ;;
              *) echo "::error::the roll step failed ($rc), see $DEST/.deploy.log" ;;
            esac
            exit "$rc"
          }

      # One container at a time too (roll.sh --env-only, no build), under the same lock; a server still on the
      # single-container layout restarts it.
      - name: Restart the API with the new .env
        if: ${{ inputs.env_only }}
        run: |
          ssh target "cd $DEST && flock -n -E 75 .deploy.lock sh -c 'if [ -f roll.sh ] && grep -q ayat-lb roll.sh && grep -q \"^  ayat-lb:\" docker-compose.yml; then sh roll.sh --env-only; \
            else docker compose up -d --force-recreate --remove-orphans; fi'"

      - name: Upload the web app (atomic swap)
        id: web
        if: ${{ !inputs.env_only }}
        run: |
          ssh target "rm -rf $DEST/web.new && mkdir -p $DEST/web.new"
          tar -C apps/web/dist -cf - . | ssh target "tar --no-same-owner -x -C $DEST/web.new && chmod -R o+rX $DEST/web.new \
            && rm -rf $DEST/web.old && { [ ! -d $DEST/web ] || mv $DEST/web $DEST/web.old; } && mv $DEST/web.new $DEST/web"

      - name: Health check
        id: health
        env:
          API_URL: ${{ vars.API_URL || 'https://api.ayatalbayan.com' }}
        run: |
          url="${API_URL}"
          if [ -z "$url" ]; then ssh target "curl -fsS --retry 30 --retry-delay 5 --retry-all-errors http://127.0.0.1:3110/health"
          else curl -fsS --retry 30 --retry-delay 5 --retry-all-errors "$url/health"; fi
          echo; echo "production is up"

      # The roll succeeded but the public health check failed: the same rollback.sh (under the deploy lock) puts the
      # previous code, compose files and Caddyfile back and rolls the previous layout; the web build is swapped back
      # only when this run swapped it. Database migrations are not undone (they only add). A failed roll already
      # rolled back in its own step.
      - name: Roll back to the previous version
        if: ${{ failure() && steps.roll.outcome == 'success' && steps.health.outcome == 'failure' && !inputs.env_only }}
        env:
          WEB_SWAPPED: ${{ steps.web.outcome == 'success' || steps.web.outcome == 'failure' }}
        run: |
          # Detached like the roll (setsid, output in .deploy.log): an ssh drop or a cancel never stops it halfway.
          ssh target "cd $DEST && setsid -w flock -n -E 75 .deploy.lock sh rollback.sh > .deploy.log 2>&1 < /dev/null; rc=\$?; cat .deploy.log; exit \$rc"
          if [ "$WEB_SWAPPED" = "true" ]; then
            ssh target "cd $DEST && { [ ! -d web.old ] || { rm -rf web.bad && mv web web.bad && mv web.old web; }; }"
          fi
          echo "::error::production failed its health check: rolled back to the previous version (bad build kept in src.bad / web.bad)"

      - name: Summary
        if: always()
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          {
            echo "### Production deploy: ${{ job.status }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`$(git rev-parse --short HEAD)\` $(git log -1 --format=%s | head -c 90) |"
            echo "| Trigger | ${{ github.event_name }} |"
            echo "| Web | https://app.ayatalbayan.com |"
            echo "| API | ${API_URL:-https://api.ayatalbayan.com}/health |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key
        if: always()
        run: rm -rf ~/.ssh/id_deploy

  # Automatic OTA (owner 2026-10-23): after a green deploy, when «plan» found mobile JS changes and no native
  # change, start mobile.yml (ota-update → preview, the phones in use) through the API, exactly like the manual
  # button: it runs on develop in the environment `mobile`, keeps its own native-change refusal, and never builds
  # an APK or iOS. Only when develop still points at the deployed commit (an older `sha` = no OTA), so the OTA
  # ships what was deployed.
  ota:
    needs: [plan, deploy]
    if: ${{ !cancelled() && needs.deploy.result == 'success' && needs.plan.outputs.ota == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha || github.sha }}
        run: |
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          head=$(curl -fsS "${auth[@]}" "$api/branches/develop" | jq -r .commit.sha)
          if [ "$head" != "$SHA" ]; then
            echo "::notice::develop moved on (${head:0:7}): no OTA now; the next deploy decides"; exit 0
          fi
          curl -fsS -X POST "${auth[@]}" "$api/actions/workflows/mobile.yml/dispatches" \
            -d '{"ref":"develop","inputs":{"action":"ota-update","branch":"preview"}}'
          echo "### OTA to preview started (mobile.yml) for \`${SHA:0:7}\`" >> "$GITHUB_STEP_SUMMARY"

  # Release tag + GitHub Release (owner 2026-10-30, docs/09 «Release tags»): v<UTC day>-<n> on the deployed commit
  # after a green code deploy (never env_only; a failed or rolled-back deploy fails «deploy» first), skipped when
  # that commit already has one (a re-run, a redeploy). The only job here that may write contents; no environment,
  # no secret. A failure only warns, and continue-on-error keeps the run green (deploy-baseline.mjs reads green runs).
  release:
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.result == 'success' && !inputs.env_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - name: Tag the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KIND: app
          SHA: ${{ inputs.sha || github.sha }}
        run: node tools/scripts/ci-checks/release-tags/release-tag.mjs
