<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>أكاديمية آيات البيان</title>
    <!-- Brand icons (docs/07 §11), made by docs/design/brand/tools/build.mjs -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Installable (iPhone web push needs the Home Screen app): public/manifest.json -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f3f7f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a211e" media="(prefers-color-scheme: dark)" />
    <script>
      // Resolve the theme before first paint (docs/07 §3). Keep the key in sync with src/lib/theme.ts.
      try {
        var p = localStorage.getItem('ayat-theme');
        var dark = p === 'dark' || (p !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
